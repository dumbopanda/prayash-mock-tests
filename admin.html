<!doctype html>
<html lang="en" class="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Mock Tests</title>
<link rel="preload" href="fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#1E4ED8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<style>@font-face{font-family:Inter;src:url(fonts/jakarta.woff2) format('woff2');font-weight:200 800;font-display:swap}</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div class="adm" id="adm">
  <aside class="side" id="side"><div class="brand"><span class="logo">M</span><span class="t">Mock Tests</span><span class="chip t">Admin</span></div>
    <nav id="nav" aria-label="Admin"></nav>
    <div class="side-foot"><button class="nav-i" id="col" type="button" aria-expanded="true" title="Collapse sidebar"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3v10"/></svg><span class="t">Collapse</span></button></div></aside>
  <div class="scrim" id="scrim"></div>
  <div class="shell-r">
    <header class="topbar">
      <button class="icon-btn menu" id="menu" type="button" aria-label="Open menu"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
      <button class="btn sm back" id="goback" type="button" aria-label="Back">‹ Back</button>
      <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav><b class="ptitle" id="ptitle"></b><span class="grow"></span>
      <div class="acct"><button class="flagbtn" id="flagbtn" type="button" hidden aria-haspopup="true" aria-expanded="false" aria-label="Alerts" title="Alerts"><span class="bang" aria-hidden="true">!</span><span id="flagn"></span></button>
        <div class="alerts" id="alerts" hidden role="dialog" aria-label="Alerts"></div></div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg></button>
      <div class="acct"><button class="avatar" id="acct" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Account"></button>
        <div class="pop" id="pop" hidden><span class="muted" id="who"></span><button class="btn sm" id="out" type="button">Sign out</button></div></div>
    </header>
    <main class="main"><div class="page" id="view"></div></main>
  </div>
  <nav class="bnav noprint" id="bnav" aria-label="Main"></nav>
</div>
<script type="module">
import { sb, rpc, currentUser, logout } from './shared.js';
import { SUBJECTS, CHAPTERS, bandCuts, bandOf, STRATEGIES, stratName, esc, fmt, cap, when, stat, readQuestions, CSV_HEADER, pct, verdictOf, subjectStats, periodReport, trendSvg, areaSvg, dualSvg, diffLabel, barsSvg, mmss, plural } from './util.js';

try { screen.orientation?.unlock?.(); } catch { /* not supported */ } // admin: any orientation; only her test pages lock to landscape
const $ = (s) => document.querySelector(s);
const view = $('#view');
const IMG = 'question-images';
const imgPath = (url) => url?.split(`/${IMG}/`)[1]; // storage path from its public URL
const toLocal = (iso) => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
// Next 5-minute mark, for new tests
const soon = () => { const d = new Date(Math.ceil(Date.now() / 3e5) * 3e5); return toLocal(d.toISOString()); };
// Supabase returns at most 1000 rows a request, so page through. build() makes a fresh query each time.
async function fetchAll(build) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await build().range(i, i + 999);
    if (error) return { data: null, error };
    out.push(...data);
    if (data.length < 1000) return { data: out, error: null };
  }
}
// Same question text in the same subject, ignoring case and spaces
const dupKey = (subject, body) => subject + '|' + body.toLowerCase().replace(/\s+/g, ' ').trim();
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 5000); };

const me = await currentUser();
if (!me) { location.href = 'index.html'; await new Promise(() => {}); }
if (me.role !== 'admin') { document.body.innerHTML = '<p class="center">Admins only.</p>'; await new Promise(() => {}); }

$('#out').onclick = logout;
$('#who').textContent = me.email ?? '';
$('#acct').textContent = (me.email ?? 'A')[0];
const adm = $('#adm'), store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} };
// Sidebar: collapses to icons on desktop, slides in as a drawer on small screens
const setMini = (m) => { adm.classList.toggle('mini', m); $('#col').setAttribute('aria-expanded', !m); $('#col').title = m ? 'Expand sidebar' : 'Collapse sidebar'; store('mini', m ? 1 : 0); };
setMini(store('mini') === '1');
$('#col').onclick = () => setMini(!adm.classList.contains('mini'));
const drawer = (o) => { adm.classList.toggle('open', o); };
$('#menu').onclick = () => drawer(true);
$('#scrim').onclick = () => drawer(false);
$('#refresh').onclick = () => render();
const pop = (o) => { $('#pop').hidden = !o; $('#acct').setAttribute('aria-expanded', o); };
$('#acct').onclick = (e) => { e.stopPropagation(); pop($('#pop').hidden); };
addEventListener('click', (e) => { if (!e.target.closest('.acct')) pop(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') { pop(false); drawer(false); alertsOpen(false); } });

// Sidebar, grouped by what the admin is doing
const ICON = {
  home: '<path d="M3 8.5 8 3l5 5.5V13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>', doc: '<path d="M4 2h6l3 3v9H4z"/><path d="M6 8h5M6 11h5"/>',
  tests: '<rect x="3" y="3" width="10" height="11" rx="1.5"/><path d="M6 3V2h4v1M6 8h4M6 11h3"/>', check: '<path d="M3 8.5l3 3 7-7"/>',
  list: '<path d="M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/>', plus: '<path d="M8 3v10M3 8h10"/>', up: '<path d="M8 11V3M5 6l3-3 3 3M3 13h10"/>',
};
const NAV = [
  ['Monitor', [['dash', 'Dashboard', 'home'], ['report', 'Weekly report', 'doc']]],
  ['Tests', [['tests', 'All tests', 'tests'], ['results', 'Results', 'check']]],
  ['Content', [['questions', 'Question bank', 'list']]],
];
$('#nav').innerHTML = NAV.map(([g, items]) => `<div class="nav-g"><span class="lbl">${g}</span>${items.map(([v, n, i]) =>
  `<a class="nav-i" href="#${v}" data-v="${v}" title="${n}"><svg viewBox="0 0 16 16" aria-hidden="true">${ICON[i]}</svg><span class="t">${n}</span></a>`).join('')}</div>`).join('');

// Phone: bottom tab bar instead of the sidebar
const BNAV = [['dash', 'Home', 'home'], ['tests', 'Tests', 'tests'], ['questions', 'Questions', 'list'], ['results', 'Results', 'check'], ['report', 'Report', 'doc']];
$('#bnav').innerHTML = BNAV.map(([v, n, i]) => `<a href="#${v}" data-b="${v}"><svg viewBox="0 0 16 16" aria-hidden="true">${ICON[i]}</svg><span>${n}</span></a>`).join('');
// Phone: tables turn into two-line lists, so each cell carries its column name
new MutationObserver(() => { $('#ptitle').textContent = view.querySelector('.head h1')?.textContent || $('#crumb b')?.textContent || ''; }).observe(view, { childList: true, subtree: true });
new MutationObserver(() => view.querySelectorAll('table:not([data-l])').forEach((t) => {
  t.dataset.l = 1; const h = [...(t.rows[0]?.cells ?? [])].map((c) => (c.tagName === 'TH' ? c.textContent.trim() : ''));
  [...t.rows].forEach((r) => [...r.cells].forEach((c, i) => c.tagName === 'TD' && h[i] && (c.dataset.l = h[i])));
})).observe(view, { childList: true, subtree: true });

// Routing by URL hash, so reload and the back button stay on the same page
const views = { flags: vFlags, dash: vDash, questions: vQuestions, form: vForm, import: vImport, tests: vTests, testform: vTestForm, preview: vPreview, results: vResults, sheet: vSheet, report: vReport };
const SUB = { form: ['questions', 'Edit question'], import: ['questions', 'Add questions'], flags: ['results', 'Cheat flags'], testform: ['tests', 'Test'], preview: ['tests', 'Preview'], sheet: ['results', 'Answer sheet'] }; // pages not in the sidebar: [parent, name]
const UP = { flags: 'dash', testform: 'tests', preview: 'tests', sheet: 'results', form: 'questions', import: 'questions' }; // Back goes here; other pages go to the dashboard
let ARG;
function go(v, arg) { ARG = arg; if (location.hash.slice(1) === v) render(); else location.hash = v; }
let TICK;
function render() {
  clearInterval(TICK);
  const v = views[location.hash.slice(1)] ? location.hash.slice(1) : 'dash', arg = ARG; ARG = undefined;
  view.oninput = view.onchange = view.onclick = null;
  const nv = SUB[v]?.[0] ?? v;
  document.querySelectorAll('.nav-i').forEach((a) => { const on = a.dataset.v === nv; a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  let [g, n] = (() => { for (const [g, items] of NAV) { const i = items.find((x) => x[0] === nv); if (i) return [g, i[1]]; } })();
  if (SUB[v]) n = `<a class="link" href="#${nv}">${n}</a><span>/</span><b>${SUB[v][1]}</b>`; else n = `<b>${n}</b>`;
  $('#crumb').innerHTML = `<span>${g}</span><span>/</span>${n}`;
  document.querySelectorAll('[data-b]').forEach((a) => { const on = a.dataset.b === (UP[v] ?? v); a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  $('#goback').hidden = BNAV.some((b) => b[0] === v); // no back on the five main tabs
  $('#goback').onclick = () => go(UP[v] ?? 'dash'); // one level up, the same on every page
  drawer(false);
  scrollTo(0, 0);
  views[v](arg);
}
addEventListener('hashchange', render);

/* ---------- Dashboard ---------- */
const DAY = 864e5;
// Draft / Upcoming / Live (in its slot) / Open (slot over; she can still take it)
const statusOf = (t) => { const s = Date.parse(t.start_at), n = Date.now(); return !t.published ? 'Draft' : n < s ? 'Upcoming' : t.end_at && n > Date.parse(t.end_at) ? 'Closed' : n < s + t.duration_min * 60000 ? 'Live' : 'Open'; };
const statusChip = (t) => { const s = statusOf(t); return `<span class="chip ${s === 'Live' ? 'ok' : ''}">${s === 'Live' ? '● ' : ''}${s}</span>`; };

let DP = (() => { try { return localStorage.dashPeriod || '7'; } catch { return '7'; } })(); // dashboard period: 7 | 30 | all
const FLAG = { fullscreen_exit: 'Left fullscreen', tab_hidden: 'Switched away or screen off', abandoned: 'Started but never submitted' };
const flagLine = (a) => { const c = {}; (a.flags || []).forEach((f) => (c[f.type] = (c[f.type] || 0) + 1)); return Object.entries(c).map(([k, n]) => `${FLAG[k] ?? k} ×${n}`).join(' · ') || 'None'; };
const openFlags = (a) => (a.flags || []).length > 0 && !a.flags_ignored;
const day = (iso) => new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' });

// Every submitted attempt of every student, oldest first
// attempt_metrics (difficulty, rating and the change since her previous attempt) is computed in the database; the page only shows it
const metricsOf = async (q) => new Map(((await q(sb.from('attempt_metrics').select('*'))).data ?? []).map((m) => [m.attempt_id, m]));
const r1 = (n) => +Number(n).toFixed(1);
const chg = (v) => (v == null || +v === 0 ? '' : `<span class="dlt ${v > 0 ? 'up' : 'down'}">${v > 0 ? '▲' : '▼'} ${r1(Math.abs(v))}</span>`);

async function allAttempts() {
  const st = await sb.from('profiles').select('id,name').eq('role', 'student').eq('is_test', false); // test accounts stay out of every view
  if (st.error) return { error: st.error };
  const prog = await Promise.all(st.data.map((s) => sb.rpc('get_progress', { p_student: s.id }).then((r) => (r.data?.attempts ?? []).map((a) => ({ ...a, student: s.name, sid: s.id })))));
  return { students: st.data, all: prog.flat().sort((x, y) => (x.submitted_at < y.submitted_at ? -1 : 1)) };
}
// The "!" in the top bar: things to fix plus cheat flags not yet dismissed. Fix-items are dismissed on this device; flags in the database.
const DISMISSED = new Set((() => { try { return JSON.parse(localStorage.dismissed || '[]'); } catch { return []; } })());
let ALERTS = { todo: [], flags: [] };
async function loadAlerts() {
  const [qs, ts, r] = await Promise.all([
    fetchAll(() => sb.from('questions').select('id,question_keys(correct)')),
    sb.from('tests').select('id,title,published,test_questions(questions(subject))'),
    allAttempts(),
  ]);
  if (qs.error || ts.error || r.error) return;
  const counts = (t) => SUBJECTS.map((s) => t.test_questions.filter((x) => x.questions.subject === s).length);
  const todo = []; // [key, text, page]
  ts.data.filter((t) => !r.all.some((a) => a.test_id === t.id) && counts(t).some((c) => c !== 15)).forEach((t) => todo.push([`n:${t.id}:${counts(t)}`, `<b>${esc(t.title)}</b> has ${counts(t).join(' / ')} questions (P / C / M / B), not 15 each`, 'tests']));
  ts.data.filter((t) => !t.published).forEach((t) => todo.push([`d:${t.id}`, `<b>${esc(t.title)}</b> is still a draft`, 'tests']));
  const keyless = qs.data.filter((q) => !q.question_keys).length;
  if (keyless) todo.push([`k:${keyless}`, `${plural(keyless, 'question')} without an answer key`, 'questions']);
  if (!r.students.length) todo.push(['s', 'No student account yet. Ask Claude to create one.', 'dash']);
  ALERTS = { todo: todo.filter(([k]) => !DISMISSED.has(k)), flags: r.all.filter(openFlags).reverse() };
  const n = ALERTS.todo.length + ALERTS.flags.length;
  $('#flagbtn').hidden = !n; $('#flagn').textContent = n;
  if (!$('#alerts').hidden) drawAlerts();
}
function drawAlerts() {
  const { todo, flags } = ALERTS;
  $('#alerts').innerHTML = `<div class="al-h"><b>Alerts</b><span class="grow"></span>${todo.length + flags.length > 1 ? '<button class="btn sm ghost" data-al="all">Dismiss all</button>' : ''}</div>
    ${todo.length ? `<div class="al-g"><span class="lbl">To fix</span>${todo.map(([k, t, p]) => `<div class="al-i"><a href="#${p}" class="grow">${t}</a><button class="x" data-al="t" data-k="${esc(k)}" aria-label="Dismiss">×</button></div>`).join('')}</div>` : ''}
    ${flags.length ? `<div class="al-g"><span class="lbl">Cheat flags</span>${flags.map((a) => `<div class="al-i"><a href="#sheet" class="grow" data-sheet="${a.test_id}" data-sid="${a.sid}" data-att="${a.id}"><b>${esc(a.title)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''}</b><br><span class="flagtxt">${esc(flagLine(a))}</span> <span class="muted">· ${when(a.submitted_at)}</span></a><button class="x" data-al="f" data-k="${a.id}" aria-label="Dismiss">×</button></div>`).join('')}</div>` : ''}
    ${todo.length + flags.length ? '' : '<p class="muted al-empty">All clear.</p>'}
    <a class="link al-f" href="#flags">Dismissed cheat flags</a>`;
}
const alertsOpen = (o) => { $('#alerts').hidden = !o; $('#flagbtn').setAttribute('aria-expanded', o); if (o) drawAlerts(); };
$('#flagbtn').onclick = (e) => { e.stopPropagation(); alertsOpen($('#alerts').hidden); };
$('#alerts').onclick = async (e) => {
  e.stopPropagation();
  const s = e.target.closest('[data-sheet]'); if (s) { e.preventDefault(); alertsOpen(false); return go('sheet', { test: s.dataset.sheet, sid: s.dataset.sid, attempt: s.dataset.att }); }
  if (e.target.closest('a')) return alertsOpen(false);
  const b = e.target.closest('[data-al]'); if (!b) return;
  const al = b.dataset.al, keys = al === 'all' ? ALERTS.todo.map(([k]) => k) : al === 't' ? [b.dataset.k] : [];
  const ids = al === 'all' ? ALERTS.flags.map((a) => a.id) : al === 'f' ? [b.dataset.k] : [];
  keys.forEach((k) => DISMISSED.add(k)); try { localStorage.dismissed = JSON.stringify([...DISMISSED]); } catch {}
  if (ids.length) { const { error } = await rpc('ignore_flags', { p_ids: ids, p_ignore: true }); if (error) return toast(error.message); }
  ALERTS = { todo: ALERTS.todo.filter(([k]) => !keys.includes(k)), flags: ALERTS.flags.filter((a) => !ids.includes(a.id)) };
  const n = ALERTS.todo.length + ALERTS.flags.length; $('#flagbtn').hidden = !n; $('#flagn').textContent = n;
  n ? drawAlerts() : alertsOpen(false);
};
addEventListener('click', (e) => { if (!e.target.closest('#alerts,#flagbtn')) alertsOpen(false); });
loadAlerts();

async function vFlags() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const r = await allAttempts();
  if (r.error) return (view.innerHTML = `<p class="err">${esc(r.error.message)}</p>`);
  const open = r.all.filter(openFlags).reverse(), done = r.all.filter((a) => (a.flags || []).length && a.flags_ignored).reverse();
  const row = (a, ignored) => `<div class="li frow"><div class="col grow-1"><b>${esc(a.title)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''}</b>
      <span class="muted">${when(a.submitted_at)}${r.students.length > 1 ? ` · ${esc(a.student)}` : ''}</span><span class="flagtxt">${esc(flagLine(a))}</span></div>
      <div class="row tight acts"><button class="btn sm" data-sheet="${a.test_id}" data-sid="${a.sid}" data-att="${a.id}">Answers</button>
      <button class="btn sm ${ignored ? '' : 'dark'}" data-ig="${a.id}" data-v="${ignored ? 0 : 1}">${ignored ? 'Undo' : 'Dismiss'}</button></div></div>`;
  view.innerHTML = `<div class="head"><div class="title"><h1>Cheat flags</h1><span class="muted">Leaving fullscreen or switching apps during a test. Dismissed ones stay listed here and can be undone.</span></div><span class="grow"></span>
      ${open.length > 1 ? '<button class="btn" id="igall">Dismiss all</button>' : ''}</div>
    <section class="sec"><div class="sec-h"><h2>To review</h2><span class="count">${open.length}</span></div>
      <div class="card list">${open.map((a) => row(a, false)).join('') || '<p class="muted li">Nothing to review.</p>'}</div></section>
    ${done.length ? `<section class="sec"><div class="sec-h"><h2>Dismissed</h2><span class="count">${done.length}</span></div><div class="card list">${done.map((a) => row(a, true)).join('')}</div></section>` : ''}`;
  const ignore = async (ids, v) => { const { error } = await rpc('ignore_flags', { p_ids: ids, p_ignore: v }); if (error) return toast(error.message); vFlags(); loadAlerts(); };
  view.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'igall') ignore(open.map((a) => a.id), true);
    else if (b.dataset.ig) ignore([b.dataset.ig], b.dataset.v === '1');
    else if (b.dataset.sheet) go('sheet', { test: b.dataset.sheet, sid: b.dataset.sid, attempt: b.dataset.att });
  };
}

async function vDash() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const [ts, r, run] = await Promise.all([
    sb.from('tests').select('id,title,start_at,end_at,duration_min,published').order('start_at', { ascending: false }),
    allAttempts(),
    sb.from('attempts').select('test_id,student_id,started_at,submitted_at').order('started_at', { ascending: false }),
  ]);
  const err = ts.error || r.error;
  if (err) return (view.innerHTML = `<p class="err">${esc(err.message)}</p>`);
  const { all } = r, met = await metricsOf((q) => q.in('student_id', r.students.map((s) => s.id)));
  const now = Date.now(), inP = DP === 'all' ? all : all.filter((a) => Date.parse(a.submitted_at) >= now - (DP === '30' ? 30 : 7) * DAY);
  const attemptsOf = (t) => all.filter((a) => a.test_id === t.id).length;

  // hero: latest score, change since the one before, average for the period, then the trend
  const last = inP.at(-1), prev = inP.at(-2), avg = inP.length ? Math.round(inP.reduce((n, a) => n + pct(a), 0) / inP.length) : null;
  const d = last && prev ? pct(last) - pct(prev) : null;
  const mp = inP.filter((a) => met.has(a.id)).map((a) => { const m = met.get(a.id); return { label: day(a.submitted_at), title: a.title, marks: +m.score, rating: +m.rating, diff: +m.paper_difficulty }; });
  const w = Math.max(300, Math.min(900, view.clientWidth - 40));
  const per = `<div class="pseg" id="per" role="group" aria-label="Time period">${[['7', '7 days'], ['30', '30 days'], ['all', 'All']].map(([v, l]) => `<button class="${v === DP ? 'on' : ''}" data-p="${v}" aria-pressed="${v === DP}">${l}</button>`).join('')}</div>`;
  const hero = `<section class="sec"><div class="sec-h"><h2>Score trend</h2><span class="grow"></span>${per}</div><div class="card hero2">
    ${last ? `<div class="kpis"><div class="kpi"><span class="k">Latest</span><span class="v">${pct(last)}%${d ? `<span class="dlt ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>` : ''}</span></div>
      <div class="kpi"><span class="k">Average</span><span class="v">${avg}%</span></div><div class="kpi"><span class="k">Tests</span><span class="v">${inP.length}</span></div></div>
      <div class="lg"><span><i></i>Marks</span><span><i class="r"></i>Rating</span></div>
      <div class="trendw">${mp.length ? dualSvg(mp, w) : '<p class="muted">No rating yet.</p>'}<div class="tip" hidden></div></div>` : `<p class="muted">No tests submitted in this period.</p>`}</div></section>`;

  // live strip: a published test she can take right now, and where she is with it
  const left = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m left` : `${m} min left`);
  const liveHtml = ts.data.filter((t) => ['Live', 'Open'].includes(statusOf(t))).map((t) => {
    const a = (run.data ?? []).find((x) => x.test_id === t.id && r.students.some((s) => s.id === x.student_id)), end = a && Date.parse(a.started_at) + t.duration_min * 60000;
    const st = !a ? 'Not started' : !a.submitted_at && end > now ? left(Math.max(1, Math.ceil((end - now) / 60000))) : 'Finished';
    return `<div class="live"><span class="ld" aria-hidden="true"></span><span class="lt"><b>Live</b> · ${esc(t.title)}</span><span class="grow"></span><span class="ls">${st}</span></div>`;
  }).join('');

  const recent = [...all].reverse().slice(0, 5);
  const prevOf = (a) => all.find((x) => x.test_id === a.test_id && x.attempt_no === a.attempt_no - 1);
  const recentHtml = `<section class="sec"><div class="sec-h"><h2>Recent attempts</h2><span class="grow"></span><a class="link" href="#results">All results</a></div>
    <div class="card list">${recent.map((a) => { const p = prevOf(a), dd = p ? pct(a) - pct(p) : null;
      return `<a class="li rrow" href="#results" data-sheet="${a.test_id}" data-sid="${a.sid}" data-att="${a.id}"><div class="col"><span class="t1">${esc(a.title)}</span>
        <span class="muted">${day(a.submitted_at)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''}${openFlags(a) ? ' · <span class="flagtxt">flagged</span>' : ''}</span></div>
        <div class="col r"><span class="pc">${pct(a)}%</span><span class="muted mono">${a.score}/${a.max}${dd ? ` · <span class="${dd > 0 ? 'up' : 'down'}">${dd > 0 ? '+' : '−'}${Math.abs(dd)}</span>` : ''}</span></div></a>`; }).join('') || '<p class="muted li">No attempts yet.</p>'}</div></section>`;

  const soon = ts.data.filter((t) => statusOf(t) !== 'Closed').sort((x, y) => (x.start_at < y.start_at ? -1 : 1)).slice(0, 4);
  const testsHtml = `<section class="sec"><div class="sec-h"><h2>Tests</h2><span class="grow"></span><a class="link" href="#tests">All tests</a></div>
    <div class="card list">${soon.map((t) => `<a class="li rrow" href="#tests"><div class="col"><span class="t1">${esc(t.title)}</span><span class="muted">Opens ${when(t.start_at)}${attemptsOf(t) ? ` · ${plural(attemptsOf(t), 'attempt')}` : ''}</span></div>${statusChip(t)}</a>`).join('') || '<p class="muted li">No open or upcoming tests.</p>'}
    </div></section>`;

  view.innerHTML = `<div class="head dhead"><div class="title"><h1>Dashboard</h1></div><span class="grow"></span><a class="btn dark" href="#testform">New test</a></div>
    ${liveHtml}${hero}<div class="g2d">${recentHtml}${testsHtml}</div>`;
  TICK = setInterval(() => { if (location.hash.slice(1) === 'dash' && liveHtml.includes('left')) vDash(); }, 60000);
  const tip = $('.tip'), show = (c) => { const m = mp[c.dataset.i], box = $('.trendw').getBoundingClientRect(), cr = c.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(m.title)}</b><span>Marks ${r1(m.marks)} / 240</span><span>Rating ${Math.round(m.rating)}</span><span>Difficulty ${Math.round(m.diff)}</span>`; tip.hidden = false;
    tip.style.left = Math.min(Math.max(cr.left - box.left + cr.width / 2 - tip.offsetWidth / 2, 0), box.width - tip.offsetWidth) + 'px'; tip.style.top = Math.max(cr.top - box.top - tip.offsetHeight - 4, 0) + 'px'; };
  if (tip) { const tw = $('.trendw'); tw.onpointerover = (e) => { const c = e.target.closest('.hit'); if (c) show(c); }; tw.onpointerleave = () => (tip.hidden = true); }
  view.onclick = (e) => {
    const h = e.target.closest('.hit'); if (h) return show(h);
    const b = e.target.closest('[data-p]'); if (b) { DP = b.dataset.p; try { localStorage.dashPeriod = DP; } catch {} return vDash(); }
    const s = e.target.closest('[data-sheet]'); if (s) { e.preventDefault(); go('sheet', { test: s.dataset.sheet, sid: s.dataset.sid, attempt: s.dataset.att }); }
  };
}

/* ---------- Question bank ---------- */
const F = { subject: '', chapter: '', text: '', use: '', band: '', flag: '', limit: 200 }; // bank filters, kept while moving between pages
async function vQuestions() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const { data, error } = await fetchAll(() => sb.from('questions').select('*, question_keys(correct, solution, concept, formula), test_questions(test_id)').order('created_at', { ascending: false }));
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const sel = new Set(), cuts = bandCuts(data.filter((r) => r.in_syllabus && !r.hold).map((r) => r.difficulty));
  view.innerHTML = `
    <div class="tray"><div class="row tray-head"><span class="ttl" id="cnt"></span><span class="grow"></span><a class="btn dark sm" id="addq" href="#import">Add questions</a><span class="brk"></span><button class="btn sm" id="selall">Select all shown</button><button class="btn sm phone" id="ftog" aria-expanded="false">Filters</button>
      <select id="bact" class="field auto" aria-label="Actions for selected" disabled><option value="">Actions…</option><option value="bout">Out of syllabus</option><option value="bin">Back in syllabus</option><option value="bhold">Release hold</option><option value="bulk">Delete selected</option></select>
      <select id="bch" class="field auto" aria-label="Move selected to chapter" disabled><option value="">Move to…</option>${SUBJECTS.map((s) => `<optgroup label="${cap(s)}">${CHAPTERS[s].map((c) => `<option value="${s}|${esc(c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('')}</select>
      <button class="btn sm" id="bout" disabled>Out of syllabus</button><button class="btn sm" id="bin" disabled>Back in syllabus</button><button class="btn sm" id="bhold" disabled>Release hold</button>
      <button class="btn sm danger" id="bulk" disabled>Delete selected</button></div>
    <div class="row filters" id="filters">
      <select id="fs" class="field auto" aria-label="Subject"><option value="">All subjects</option>${SUBJECTS.map((s) => `<option value="${s}" ${s === F.subject ? 'selected' : ''}>${cap(s)}</option>`).join('')}</select>
      <select id="fc" class="field auto" aria-label="Chapter"></select>
      <select id="fu" class="field auto" aria-label="Use"><option value="">Used or not</option><option value="unused" ${F.use === 'unused' ? 'selected' : ''}>Not in any test</option><option value="used" ${F.use === 'used' ? 'selected' : ''}>In a test</option></select>
      <select id="fb" class="field auto" aria-label="Difficulty"><option value="">Any difficulty</option>${['easy', 'medium', 'hard'].map((b) => `<option value="${b}" ${b === F.band ? 'selected' : ''}>${cap(b)}</option>`).join('')}</select>
      <select id="fg" class="field auto" aria-label="Status"><option value="">Any status</option>${[['in', 'In syllabus, usable'], ['out', 'Out of syllabus'], ['review', 'Chapter needs review'], ['hold', 'On hold']].map(([v, l]) => `<option value="${v}" ${v === F.flag ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
      <div class="card tbl" id="qt"></div></div>`;
  const shown = () => data.filter((r) => (!F.subject || r.subject === F.subject) && (!F.chapter || r.chapter === F.chapter)
    && (!F.use || (F.use === 'used') === r.test_questions.length > 0)
    && (!F.band || bandOf(r.difficulty, cuts) === F.band)
    && (!F.flag || (F.flag === 'in' ? r.in_syllabus && !r.hold : F.flag === 'out' ? !r.in_syllabus : F.flag === 'review' ? r.chapter_review : r.hold)));
  const chapters = () => { const l = [...new Set(data.filter((r) => !F.subject || r.subject === F.subject).map((r) => r.chapter).filter(Boolean))].sort();
    if (!l.includes(F.chapter)) F.chapter = '';
    $('#fc').innerHTML = `<option value="">All chapters</option>${l.map((c) => `<option ${c === F.chapter ? 'selected' : ''}>${esc(c)}</option>`).join('')}`; };
  const table = () => {
    const l = shown();
    $('#cnt').textContent = `${plural(l.length, 'question')} shown${sel.size ? ` · ${sel.size} selected` : ''}`;
    $('#cnt').parentNode.classList.toggle('has-sel', sel.size > 0);
    $('#selall').textContent = sel.size ? 'Clear' : 'Select all shown';
    const nf = ['subject', 'chapter', 'use', 'band', 'flag'].filter((k) => F[k]).length;
    $('#ftog').textContent = nf ? `Filters · ${nf}` : 'Filters';
    ['#bulk', '#bch', '#bout', '#bin', '#bhold', '#bact'].forEach((i) => ($(i).disabled = !sel.size));
    $('#qt').innerHTML = `<table><tr><th class="ck"></th><th>Question</th><th>Ans</th><th title="1-100, higher is harder">Diff</th><th>Tests</th><th></th></tr>
      ${l.slice(0, F.limit).map((r) => `<tr><td class="ck"><input type="checkbox" data-s="${r.id}" ${sel.has(r.id) ? 'checked' : ''} aria-label="Select"></td>
        <td class="qcell"><span class="qline">${fmt(r.body.slice(0, 160))}${r.body.length > 160 ? '…' : ''}</span><span class="qmeta">${cap(r.subject)} · ${esc(r.chapter) || 'No chapter'}${r.image_url ? ' <span class="chip">Figure</span>' : ''}${r.hold ? ' <span class="chip warn">On hold</span>' : ''}${r.in_syllabus ? '' : ' <span class="chip warn">Out of syllabus</span>'}${r.chapter_review ? ' <span class="chip">Check chapter</span>' : ''}</span></td>
        <td class="mono">${r.question_keys ? 'ABCD'[r.question_keys.correct] : '<span class="err">none</span>'}</td><td class="mono" title="${esc(bandOf(r.difficulty, cuts))}">${r.difficulty ?? '–'}</td><td class="mono">${r.test_questions.length || '–'}</td>
        <td class="actions"><button class="btn sm" data-e="${r.id}">Edit</button>${r.test_questions.length ? '' : `<button class="btn sm danger" data-d="${r.id}">Delete</button>`}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">No questions match. Import a CSV or change the filters.</td></tr>'}</table>
      ${l.length > F.limit ? `<div class="row li"><span class="muted">Showing ${F.limit} of ${l.length}.</span><button class="btn sm" id="more">Show all</button></div>` : ''}`;
    $('#more')?.addEventListener('click', () => { F.limit = Infinity; table(); });
  };
  const del = async (ids) => {
    const used = ids.filter((id) => data.find((r) => r.id === id).test_questions.length), free = ids.filter((id) => !used.includes(id));
    if (!free.length) return toast('These questions are used in tests. Remove them from the tests first.');
    if (!confirm(`Delete ${plural(free.length, 'question')}?${used.length ? ` ${used.length} used in tests will be kept.` : ''} This cannot be undone.`)) return;
    for (let i = 0; i < free.length; i += 100) { // short URLs
      const { error } = await sb.from('questions').delete().in('id', free.slice(i, i + 100));
      if (error) return toast(error.message);
    }
    const paths = free.map((id) => imgPath(data.find((r) => r.id === id).image_url)).filter(Boolean);
    if (paths.length) await sb.storage.from(IMG).remove(paths);
    toast(`Deleted ${plural(free.length, 'question')}`);
    vQuestions();
  };
  // bulk edits: only touches the selected rows, in chunks of 100 so the URL stays short
  const bulk = async (patch, ids, msg) => {
    for (let i = 0; i < ids.length; i += 100) { const { error } = await sb.from('questions').update(patch).in('id', ids.slice(i, i + 100)); if (error) return toast(error.message); }
    toast(msg); vQuestions();
  };
  const bulkChapter = (v) => {
    const [subj, ch] = v.split('|'), ids = [...sel].filter((id) => data.find((r) => r.id === id).subject === subj), skip = sel.size - ids.length;
    if (!ids.length) { $('#bch').value = ''; return toast(`None of the selected questions are ${cap(subj)}.`); }
    if (!confirm(`Move ${plural(ids.length, 'question')} to "${ch}"?${skip ? ` ${skip} of another subject will be left as they are.` : ''}`)) { $('#bch').value = ''; return; }
    bulk({ chapter: ch, source_chapter: ch, chapter_review: false }, ids, `Moved ${plural(ids.length, 'question')}`);
  };
  view.onchange = (e) => {
    const t = e.target;
    if (t.id === 'fs') { F.subject = t.value; chapters(); }
    else if (t.id === 'fc') F.chapter = t.value;
    else if (t.id === 'fu') F.use = t.value;
    else if (t.id === 'fb') F.band = t.value;
    else if (t.id === 'fg') F.flag = t.value;
    else if (t.id === 'bch') return t.value && bulkChapter(t.value);
    else if (t.id === 'bact') { const v = t.value; t.value = ''; return v && $('#' + v).click(); }
    else if (t.dataset.s) t.checked ? sel.add(t.dataset.s) : sel.delete(t.dataset.s);
    table();
  };
  view.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.e) go('form', data.find((r) => r.id === b.dataset.e));
    else if (b.dataset.d) del([b.dataset.d]);
    else if (b.id === 'bulk') del([...sel]);
    else if (b.id === 'bout') bulk({ in_syllabus: false }, [...sel], 'Marked out of syllabus');
    else if (b.id === 'bin') {
      const ok = [...sel].filter((id) => { const r = data.find((x) => x.id === id); return CHAPTERS[r.subject].includes(r.chapter); });
      if (!ok.length) return toast('Give these questions a current chapter first (Move to chapter), then bring them back.');
      bulk({ in_syllabus: true, chapter_review: false }, ok, `${plural(ok.length, 'question')} back in the syllabus${ok.length < sel.size ? ` · ${sel.size - ok.length} skipped, no current chapter` : ''}`);
    } else if (b.id === 'bhold' && confirm('Held questions have an unconfirmed key or figure. Release only after you have checked the answer. Release now?')) bulk({ hold: false }, [...sel], 'Hold released');
    else if (b.id === 'ftog') { const o = $('#filters').classList.toggle('open'); b.setAttribute('aria-expanded', o); }
    else if (b.id === 'selall') { if (sel.size) sel.clear(); else shown().slice(0, F.limit).forEach((r) => sel.add(r.id)); table(); }
  };
  chapters(); table();
}

/* ---------- Add / edit question ---------- */
function vForm(q, keep = {}) {
  if (!q) return go('questions'); // questions are added by import only // keep: subject and chapter carried over by "Save & add another"
  const k = q?.question_keys ?? {};
  const opts = q?.options ?? ['', '', '', ''];
  view.innerHTML = `
    <div class="head"><h1>${q ? 'Edit' : 'Add'} question</h1></div>
    ${q?.test_questions?.length ? `<p class="note">Used in ${plural(q.test_questions.length, 'test')}. Edits show in those tests. A changed answer or marks re-grades tests already taken.</p>` : ''}
    <div class="split"><div class="tray"><span class="lbl">Question</span><div class="card stack">
      <div class="row">
        <div class="col"><label class="lbl" for="subj">Subject</label><select id="subj" class="field">${SUBJECTS.map((s) => `<option value="${s}" ${(q?.subject ?? keep.subject) === s ? 'selected' : ''}>${cap(s)}</option>`).join('')}</select></div>
        <div class="col x2"><label class="lbl" for="chap">Chapter</label><select id="chap" class="field"></select></div>
        <div class="col s"><label class="lbl" for="marks">Marks</label><input id="marks" class="field mono" type="number" min="1" value="${q?.marks ?? 4}"></div>
        <div class="col s"><label class="lbl" for="diff" title="1 easiest, 100 hardest">Difficulty</label><input id="diff" class="field mono" type="number" min="1" max="100" placeholder="1-100" value="${q?.difficulty ?? ''}"></div>
      </div>
      <div class="col"><label class="lbl" for="body">Question text</label><textarea id="body" class="field" rows="4">${esc(q?.body ?? '')}</textarea>
        <span class="muted">x^2 power · x^{-3} · H_2O subscript · sqrt(10) root</span></div>
      <div class="col"><label class="lbl" for="img">Image (optional)</label><input id="img" type="file" accept="image/*">
        ${q?.image_url ? `<span class="row"><img class="thumb" src="${esc(q.image_url)}" alt="Current figure"><label class="opt sm-text"><input type="checkbox" id="noimg"> Remove the current image</label></span><span class="muted">Picking a new file replaces it.</span>` : ''}</div>
      <div class="stack tight"><span class="lbl">Options · mark the correct one</span>
        ${[0, 1, 2, 3].map((i) => `<div class="opt"><input type="radio" name="ans" value="${i}" aria-label="${'ABCD'[i]} is correct" ${k.correct === i ? 'checked' : ''}>
          <span class="key">${'ABCD'[i]}</span><input class="field o" aria-label="Option ${'ABCD'[i]}" value="${esc(opts[i])}"></div>`).join('')}</div>
      <div class="row"><div class="col"><label class="lbl" for="concept">Concept used</label><input id="concept" class="field" value="${esc(k.concept ?? '')}"></div>
        <div class="col"><label class="lbl" for="formula">Formula used</label><input id="formula" class="field mono" value="${esc(k.formula ?? '')}"></div></div>
      <div class="col"><label class="lbl" for="sol">Solution</label><textarea id="sol" class="field" rows="3">${esc(k.solution ?? '')}</textarea></div>
      <div class="err" id="msg" role="alert"></div>
      <div class="row"><button class="btn dark" id="save">Save question</button></div>
    </div></div>
    <div class="tray"><span class="lbl">Student preview</span><div class="card" id="pv"></div></div></div>`;

  const preview = () => {
    const o = [...view.querySelectorAll('.o')].map((x) => x.value);
    const c = Number(view.querySelector('input[name=ans]:checked')?.value ?? -1);
    $('#pv').innerHTML = `<div class="qblock"><div class="qbody">${fmt($('#body').value) || '<span class="muted">Question appears here</span>'}</div>
      ${q?.image_url && !$('#noimg')?.checked ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure for this question">` : ''}
      ${o.map((t, i) => `<div class="optline ${i === c ? 'right' : ''}"><span class="key">${'ABCD'[i]}</span><span class="grow">${fmt(t)}</span>${i === c ? '<span>✓ correct</span>' : ''}</div>`).join('')}</div>`;
  };
  // chapters come from the fixed current list; an old name outside it stays selectable until she picks a current one
  const fillChap = (want) => {
    const sub = $('#subj').value, cur = want ?? $('#chap').value, l = CHAPTERS[sub];
    $('#chap').innerHTML = `<option value="">Choose a chapter</option>${l.map((c) => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('')}${cur && !l.includes(cur) ? `<option selected value="${esc(cur)}">${esc(cur)} (not a current chapter)</option>` : ''}`;
  };
  fillChap(q?.chapter ?? keep.chapter ?? '');
  view.oninput = view.onchange = (e) => { if (e?.target?.id === 'subj') fillChap(''); preview(); };
  preview();

  async function save(again) {
    const msg = $('#msg'); msg.textContent = '';
    const options = [...view.querySelectorAll('.o')].map((x) => x.value.trim());
    const correct = view.querySelector('input[name=ans]:checked')?.value;
    if (!$('#body').value.trim()) return (msg.textContent = 'Write the question.');
    if (options.some((x) => !x)) return (msg.textContent = 'Fill all four options.');
    if (correct === undefined) return (msg.textContent = 'Mark the correct option.');
    if (!CHAPTERS[$('#subj').value].includes($('#chap').value)) return (msg.textContent = 'Choose a current chapter.');
    const dv = $('#diff').value.trim(); if (dv && !(dv >= 1 && dv <= 100)) return (msg.textContent = 'Difficulty is 1 to 100, or leave it empty.');
    $('#save').disabled = true;
    let image_url = $('#noimg')?.checked ? null : q?.image_url ?? null;
    const file = $('#img').files[0];
    if (file) {
      const path = `${crypto.randomUUID()}.${file.name.split('.').pop().toLowerCase()}`;
      const up = await sb.storage.from(IMG).upload(path, file);
      if (up.error) { $('#save').disabled = false; return (msg.textContent = up.error.message); }
      image_url = sb.storage.from(IMG).getPublicUrl(path).data.publicUrl;
    }
    const row = { subject: $('#subj').value, chapter: $('#chap').value, source_chapter: $('#chap').value, chapter_review: false, in_syllabus: true, difficulty: dv ? Math.round(dv) : null, body: $('#body').value.trim(), options, image_url, marks: Number($('#marks').value) || 4 };
    const r = q ? await sb.from('questions').update(row).eq('id', q.id).select('id').single() : await sb.from('questions').insert(row).select('id').single();
    if (r.error) { $('#save').disabled = false; return (msg.textContent = r.error.message); }
    const key = await sb.from('question_keys').upsert({ question_id: r.data.id, correct: Number(correct), solution: $('#sol').value.trim(), concept: $('#concept').value.trim() || null, formula: $('#formula').value.trim() || null });
    if (key.error) {
      if (!q) await sb.from('questions').delete().eq('id', r.data.id); // never keep a new question without its answer key
      $('#save').disabled = false; return (msg.textContent = key.error.message);
    }
    if ((file || !image_url) && imgPath(q?.image_url)) await sb.storage.from(IMG).remove([imgPath(q.image_url)]); // replaced or removed image
    toast(q ? 'Question saved' : 'Question added');
    again ? vForm(null, { subject: row.subject, chapter: row.chapter }) : go('questions');
  }
  $('#save').onclick = () => save(false);
}

/* ---------- CSV import ---------- */
// One paper = one CSV + its pictures. Check runs on every change; nothing is saved until Import.
function vImport() {
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Add questions</h1><span class="muted desc">Choose the CSV and its pictures. Nothing is saved until you press Import.</span></div><span class="grow"></span><button class="btn" id="tpl">Download template</button></div>
    <div class="tray"><span class="lbl">1 · Files</span><div class="card stack">
      <div class="row top-align">
        <div class="col"><label class="lbl" for="file">CSV file</label><input id="file" type="file" accept=".csv,text/csv"></div>
        <div class="col"><label class="lbl" for="imgs">Pictures · select all at once</label><input id="imgs" type="file" accept="image/*" multiple></div></div>
      <details><summary class="muted">Or paste CSV text</summary><textarea id="txt" class="field mono" rows="6" aria-label="CSV text"></textarea></details>
      <p class="muted">Columns: <span class="mono">${CSV_HEADER}</span>. Correct is A, B, C or D. Write x^2, 10^{-3}, H_2O, sqrt(10), A -> B. In Excel use Save As → "CSV UTF-8".</p></div></div>
    <div id="chk"></div>
    <div class="tray" id="opts" hidden><span class="lbl">3 · Save</span><div class="card stack">
      <label class="opt"><input type="radio" name="mk" value="test" checked><span>Add to the bank <b>and create a test</b> from this paper</span></label>
      <label class="opt"><input type="radio" name="mk" value="bank"> Add to the bank only</label>
      <div class="row" id="tf">
        <div class="col x2"><label class="lbl" for="title">Test title</label><input id="title" class="field"></div>
        <div class="col"><label class="lbl" for="start">Opens</label><input id="start" class="field" type="datetime-local" value="${soon()}"></div>
        <div class="col s"><label class="lbl" for="dur">Minutes</label><input id="dur" class="field mono" type="number" min="5" value="120"></div>
        <div class="col m"><label class="lbl" for="neg">Negative marks</label><input id="neg" class="field mono" type="number" min="0" step="0.25" value="1"></div>
        <label class="opt"><input type="checkbox" id="pub"> Publish now</label></div>
      <div class="err" id="msg" role="alert"></div>
      <div class="row"><button class="btn dark lg" id="go">Import</button><span class="muted" id="gonote"></span></div></div></div>`;
  let R = null, bank = null;
  $('#tpl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + CSV_HEADER + '\nphysics,Electricity,"Three 6 ohm resistors are joined in parallel. The total resistance is",18 ohm,2 ohm,6 ohm,3 ohm,B,"1/R = 3/6, so R = 2 ohm",4,phy_p01_q01.png\nchemistry,"Acids, Bases and Salts","The pH of a neutral solution at 25 °C is",0,7,14,1,B,Neutral water has [H^+] = 10^{-7},4,\n'], { type: 'text/csv' }));
    a.download = 'paper-template.csv'; a.click();
  };
  const check = async () => {
    const txt = $('#txt').value;
    if (!txt.trim()) { $('#chk').innerHTML = ''; $('#opts').hidden = true; return; }
    if (!bank) {
      $('#chk').innerHTML = '<p class="muted">Checking…</p>';
      const b = await fetchAll(() => sb.from('questions').select('id,subject,chapter,body,test_questions(test_id)'));
      if (b.error) return ($('#chk').innerHTML = `<p class="err">${esc(b.error.message)}</p>`);
      bank = b.data;
    }
    const r = readQuestions(txt);
    const files = new Map([...$('#imgs').files].map((f) => [f.name.toLowerCase(), f]));
    const known = new Map(bank.map((b) => [dupKey(b.subject, b.body), b]));
    const seen = new Set();
    r.ok.forEach((q) => {
      const k = dupKey(q.subject, q.body), ex = known.get(k);
      q.existing = ex?.id ?? null;
      if (seen.has(k)) r.errors.push(`Row ${q.row}: same question as an earlier row`);
      seen.add(k);
      if (ex) r.warnings.push(`Row ${q.row}: already in the bank${ex.test_questions.length ? ` and used in ${plural(ex.test_questions.length, 'test')}` : ''}. The bank copy is used; it is not added twice.`);
      if (q.image && !ex) {
        const f = files.get(q.image.toLowerCase());
        if (!f) r.errors.push(`Row ${q.row}: picture "${q.image}" not selected`);
        else if (f.size > 1.5e6) r.warnings.push(`Row ${q.row}: picture "${q.image}" is ${(f.size / 1e6).toFixed(1)} MB and will load slowly`);
      }
    });
    const used = new Set(r.ok.map((q) => q.image?.toLowerCase()).filter(Boolean)), extra = [...files.keys()].filter((n) => !used.has(n));
    if (extra.length) r.warnings.push(`Pictures not named in the CSV: ${extra.join(', ')}`);
    // every question needs a current chapter; dropped ones (Heredity) and unknown names are errors, never created on the fly
    r.warnings = r.warnings.filter((w) => !/no chapter/.test(w));
    r.ok.forEach((q) => {
      if (CHAPTERS[q.subject]?.includes(q.chapter)) return;
      r.errors.push(!q.chapter ? `Row ${q.row}: chapter is empty. Use one of the current ${cap(q.subject)} chapters.`
        : /^heredity/i.test(q.chapter) ? `Row ${q.row}: "${q.chapter}" is not in the syllabus any more.`
        : `Row ${q.row}: "${q.chapter}" is not a current ${cap(q.subject)} chapter (${CHAPTERS[q.subject]?.join(', ')}).`);
    });
    if (r.ok.length) r.warnings.push('Imported questions have no difficulty score yet. Set it in the question bank so the paper builder can use them.');
    const n = SUBJECTS.map((s) => r.ok.filter((q) => q.subject === s).length);
    if (n.some((c) => c !== 15)) r.warnings.push(`Subjects have ${n.join(' / ')} questions (P / C / M / B), not 15 each.`);
    const rowNo = (x) => +(/^Row (\d+)/.exec(x)?.[1] ?? 1e9);
    r.errors.sort((x, y) => rowNo(x) - rowNo(y)); r.warnings.sort((x, y) => rowNo(x) - rowNo(y));
    R = r;
    const fresh = r.ok.filter((q) => !q.existing).length, urls = [];
    const thumb = (q) => { const f = q.image && files.get(q.image.toLowerCase()); if (!f) return q.image ? `<span class="mono muted">${esc(q.image)}</span>` : ''; const u = URL.createObjectURL(f); urls.push(u); return `<img class="thumb" src="${u}" alt="${esc(q.image)}">`; };
    $('#chk').innerHTML = `<div class="tray"><span class="lbl">2 · Check</span><div class="card stack">
      <div class="row tight">${r.errors.length ? `<span class="chip bad">✗ ${plural(r.errors.length, 'problem')} to fix</span>` : '<span class="chip ok">✓ Ready to import</span>'}
        <span class="chip">${plural(r.ok.length, 'question')}</span>${SUBJECTS.map((s, i) => `<span class="chip ${n[i] === 15 ? '' : 'warn'}">${cap(s).slice(0, 4)} ${n[i]}</span>`).join('')}${fresh < r.ok.length ? `<span class="chip">${r.ok.length - fresh} already in bank</span>` : ''}</div>
      ${r.errors.length ? `<div class="issues bad"><b>Fix these first</b> (missing pictures: add them above; anything else: fix the CSV and choose it again)<ul>${r.errors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.warnings.length ? `<div class="issues"><b>Check these</b> (import still works)<ul>${r.warnings.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="tbl pv"><table><tr><th>Row</th><th>Subject</th><th>Chapter</th><th>Question</th><th>Ans</th><th>Picture</th></tr>
        ${r.ok.map((q) => `<tr><td class="mono">${q.row}</td><td>${cap(q.subject)}</td><td>${esc(q.chapter)}</td><td>${fmt(q.body.slice(0, 120))}${q.body.length > 120 ? '…' : ''}${q.existing ? ' <span class="chip">In bank</span>' : ''}</td><td class="mono">${'ABCD'[q.correct]}</td><td>${thumb(q)}</td></tr>`).join('')}</table></div></div></div>`;
    $('#opts').hidden = !r.ok.length;
    $('#go').disabled = !!r.errors.length || !r.ok.length;
    $('#gonote').textContent = r.errors.length ? 'Fix the problems above first.' : '';
  };
  const mode = () => view.querySelector('input[name=mk]:checked').value;
  view.onchange = async (e) => {
    const t = e.target;
    if (t.id === 'file' && t.files[0]) {
      $('#txt').value = await t.files[0].text();
      if (!$('#title').value) $('#title').value = t.files[0].name.replace(/\.csv$/i, '').replace(/[_-]+/g, ' ');
    }
    if (t.name === 'mk') { $('#tf').hidden = mode() !== 'test'; $('#go').textContent = mode() === 'test' ? 'Import and create test' : 'Import'; return; }
    if (['file', 'imgs'].includes(t.id)) check();
  };
  let deb = 0;
  view.oninput = (e) => { if (e.target.id === 'txt') { clearTimeout(deb); deb = setTimeout(check, 400); } };
  $('#go').textContent = 'Import and create test';
  $('#go').onclick = async () => {
    const msg = $('#msg'), test = mode() === 'test';
    msg.textContent = '';
    if (!R || R.errors.length) return;
    if (test && (!$('#title').value.trim() || !$('#start').value)) return (msg.textContent = 'Give the test a title and an opening time.');
    $('#go').disabled = true; $('#go').textContent = 'Importing…';
    const fail = (m) => { msg.textContent = m; $('#go').disabled = false; $('#go').textContent = test ? 'Import and create test' : 'Import'; };
    const fresh = R.ok.filter((q) => !q.existing);
    const files = Object.fromEntries([...$('#imgs').files].map((f) => [f.name.toLowerCase(), f])), urls = {}, paths = [];
    const undo = () => paths.length && sb.storage.from(IMG).remove(paths);
    for (const name of new Set(fresh.map((q) => q.image?.toLowerCase()).filter(Boolean))) {
      const path = `${crypto.randomUUID()}.${name.split('.').pop()}`;
      const up = await sb.storage.from(IMG).upload(path, files[name]);
      if (up.error) { await undo(); return fail(`Nothing imported: ${up.error.message}`); }
      paths.push(path); urls[name] = sb.storage.from(IMG).getPublicUrl(path).data.publicUrl;
    }
    // ids made here so keys and test rows match exactly; created_at keeps the CSV order
    const base = Date.now();
    fresh.forEach((q) => (q.id = crypto.randomUUID()));
    if (fresh.length) {
      const ins = await sb.from('questions').insert(fresh.map((q, i) => ({ id: q.id, subject: q.subject, chapter: q.chapter, source_chapter: q.chapter, body: q.body, options: q.options, marks: q.marks,
        image_url: q.image ? urls[q.image.toLowerCase()] : null, created_at: new Date(base + i).toISOString() })));
      if (ins.error) { await undo(); return fail(`Nothing imported: ${ins.error.message}`); }
      const keys = await sb.from('question_keys').insert(fresh.map((q) => ({ question_id: q.id, correct: q.correct, solution: q.solution })));
      if (keys.error) {
        await sb.from('questions').delete().in('id', fresh.map((q) => q.id)); // all or nothing
        await undo(); return fail(`Nothing imported: ${keys.error.message}`);
      }
    }
    bank = null;
    if (!test) { toast(`Imported ${plural(fresh.length, 'question')}`); return go('questions'); }
    const t = await sb.from('tests').insert({ title: $('#title').value.trim(), start_at: new Date($('#start').value).toISOString(), duration_min: Number($('#dur').value) || 120,
      neg_marks: Number($('#neg').value), published: $('#pub').checked, cheat_flags: true, strategies: Object.keys(STRATEGIES) }).select('id').single();
    if (t.error) { toast(`Questions imported, but the test was not created: ${t.error.message}`); return go('questions'); }
    const order = [...R.ok].sort((a, b) => SUBJECTS.indexOf(a.subject) - SUBJECTS.indexOf(b.subject)); // stable: CSV order inside each subject
    const tq = await sb.from('test_questions').insert(order.map((q, i) => ({ test_id: t.data.id, question_id: q.existing ?? q.id, position: i + 1 })));
    if (tq.error) { await sb.from('tests').delete().eq('id', t.data.id); toast(`Questions imported, but the test was not created: ${tq.error.message}`); return go('questions'); }
    toast(`Imported ${plural(fresh.length, 'question')} and created the test`);
    go('preview', t.data.id);
  };
}

/* ---------- Tests ---------- */
async function vTests() {
  const { data, error } = await sb.from('tests').select('*, test_questions(question_id, questions(subject, marks, question_keys(correct))), attempts(id, submitted_at, student_id)').order('start_at', { ascending: false });
  const real = new Set(((await sb.from('profiles').select('id').eq('role', 'student').eq('is_test', false)).data ?? []).map((p) => p.id));
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const counts = (t) => SUBJECTS.map((s) => t.test_questions.filter((x) => x.questions.subject === s).length);
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Tests</h1><span class="muted desc">Preview a test before publishing. She sees only published tests.</span></div></div>
    <section class="sec"><div class="sec-h"><h2>${plural(data.length, 'test')}</h2><span class="grow"></span><button class="btn dark sm" id="new">New test</button></div><div class="sep">
      ${data.map((t) => { const n = counts(t), done = t.attempts.filter((a) => a.submitted_at && real.has(a.student_id)).length;
        return `<div class="trow"><div class="col"><span class="row tight"><b class="tt">${esc(t.title)}</b>${statusChip(t)}${n.every((c) => c === 15) ? '' : `<span class="chip warn">${n.join(' / ')} (P / C / M / B)</span>`}</span>
        <span class="muted">${when(t.start_at)}${t.end_at ? ` to ${when(t.end_at)}` : ''} · ${t.duration_min} min${t.omr_min ? ` incl. ${t.omr_min} OMR` : ''} · +${[...new Set(t.test_questions.map((x) => x.questions.marks))].join('/') || 4} / −${t.neg_marks}${done ? ` · ${plural(done, 'attempt')}` : ''}${t.attempts.some((a) => !a.submitted_at) ? ' · one in progress' : ''}</span></div>
        <span class="row tight"><a class="btn sm" href="#preview" data-v="${t.id}">Preview</a><button class="btn sm" data-e="${t.id}">Edit</button>
        <button class="btn sm ${t.published ? 'ghost' : 'dark'}" data-p="${t.id}">${t.published ? 'Unpublish' : 'Publish'}</button>
        ${t.attempts.length ? '' : `<button class="btn sm ghost danger" data-d="${t.id}">Delete</button>`}</span></div>`; }).join('') || '<p class="muted">No tests yet. Ask Claude to build one, or press New test.</p>'}
    </div></section>`;
  view.onclick = async (e) => {
    const b = e.target.closest('[data-v],[data-e],[data-p],[data-d],#new'); if (!b) return;
    if (b.id === 'new') return go('testform');
    if (b.dataset.v) { e.preventDefault(); return go('preview', b.dataset.v); }
    const t = data.find((x) => x.id === (b.dataset.e || b.dataset.p || b.dataset.d));
    if (b.dataset.e) go('testform', t);
    else if (b.dataset.p) {
      if (!t.published) {
        const n = counts(t), keyless = t.test_questions.filter((x) => !x.questions.question_keys).length, issues = [];
        if (!t.test_questions.length) return toast('Add questions before publishing.');
        if (n.some((c) => c !== 15)) issues.push(`subjects have ${n.join(' / ')} questions, not 15 each`);
        if (keyless) issues.push(`${plural(keyless, 'question')} without an answer key`);
        if (issues.length && !confirm(`This test has ${issues.join(' and ')}. Publish anyway?`)) return;
      }
      const { error } = await sb.from('tests').update({ published: !t.published }).eq('id', t.id);
      if (error) return toast(error.message);
      toast(t.published ? 'Unpublished' : `Published. She can open it from ${when(Date.parse(t.start_at) - 15 * 60000)}.`);
      vTests();
    } else if (b.dataset.d) {
      if (t.attempts.length) return toast('She has attempts on this test. Unpublish it instead; her results stay.');
      if (!confirm(`Delete "${t.title}"? Questions stay in the bank.`)) return;
      const { error } = await sb.from('tests').delete().eq('id', t.id);
      if (error) return toast(error.message);
      toast('Test deleted'); vTests();
    }
  };
}

// The whole paper as she will see it, with answers, plus a pre-publish checklist
async function vPreview(id) {
  if (!id) return go('tests');
  view.innerHTML = '<p class="muted">Loading…</p>';
  const { data: t, error } = await sb.from('tests').select('*, test_questions(position, questions(*, question_keys(correct, solution, concept, formula)))').eq('id', id).single();
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const qs = t.test_questions.sort((a, b) => a.position - b.position).map((x) => x.questions);
  const n = SUBJECTS.map((s) => qs.filter((q) => q.subject === s).length), keyless = qs.filter((q) => !q.question_keys).length;
  const checks = [[qs.length === 60, `${qs.length} questions`], [n.every((c) => c === 15), `${n.join(' / ')} per subject (P / C / M / B)`],
    [!keyless, keyless ? `${plural(keyless, 'question')} without an answer key` : 'Every question has an answer key'],
    [qs.every((q) => q.chapter), 'Every question has a chapter'], [true, `+${[...new Set(qs.map((q) => q.marks))].join('/')} / −${t.neg_marks}, ${t.duration_min} min`]];
  view.innerHTML = `<div class="head"><div class="title"><h1>${esc(t.title)}</h1><span class="muted">Opens ${when(t.start_at)} · ${statusOf(t)}</span></div><span class="grow"></span>
      <button class="btn" id="edit">Edit</button><button class="btn ${t.published ? '' : 'dark'}" id="pub">${t.published ? 'Unpublish' : 'Publish'}</button></div>
    <div class="tray"><span class="lbl">Checklist</span><div class="card list">${checks.map(([ok, txt]) => `<div class="li"><span class="chip ${ok ? 'ok' : 'warn'}">${ok ? '✓' : '!'}</span><span>${txt}</span></div>`).join('')}
      <div class="li" id="imgcheck"><span class="chip">…</span><span>Checking pictures</span></div></div></div>
    ${SUBJECTS.filter((s, i) => n[i]).map((s) => `<div class="tray"><span class="lbl">${cap(s)} · ${n[SUBJECTS.indexOf(s)]}</span><div class="card list">${qs.filter((q) => q.subject === s).map((q, i) => `<div class="qblock pq">
      <div class="row tight"><span class="mono muted">Q${i + 1}</span><span class="chip">${esc(q.chapter) || 'No chapter'}</span><span class="grow"></span><button class="btn sm" data-q="${q.id}">Edit question</button></div>
      <div class="qbody">${fmt(q.body)}</div>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure">` : ''}
      ${q.options.map((o, j) => `<div class="optline ${q.question_keys?.correct === j ? 'right' : ''}"><span class="key">${'ABCD'[j]}</span><span class="grow">${fmt(o)}</span>${q.question_keys?.correct === j ? '<span>✓ answer</span>' : ''}</div>`).join('')}
      ${q.question_keys?.solution ? `<p class="sol">${fmt(q.question_keys.solution)}</p>` : ''}</div>`).join('')}</div></div>`).join('') || '<p class="muted">No questions in this test yet.</p>'}`;
  const imgs = [...view.querySelectorAll('.qimg')];
  Promise.all(imgs.map((im) => (im.complete ? Promise.resolve(im.naturalWidth > 0) : new Promise((r) => { im.onload = () => r(true); im.onerror = () => r(false); })))).then((ok) => {
    const bad = ok.filter((x) => !x).length, el = $('#imgcheck'); if (!el) return;
    el.innerHTML = `<span class="chip ${bad ? 'warn' : 'ok'}">${bad ? '!' : '✓'}</span><span>${imgs.length ? (bad ? `${plural(bad, 'picture')} did not load` : `All ${plural(imgs.length, 'picture')} load`) : 'No pictures'}</span>`;
  });
  $('#edit').onclick = () => go('testform', t);
  $('#pub').onclick = async () => {
    if (!t.published && checks.some(([ok]) => !ok) && !confirm('Some checks are not met. Publish anyway?')) return;
    const { error } = await sb.from('tests').update({ published: !t.published }).eq('id', t.id);
    if (error) return toast(error.message);
    toast(t.published ? 'Unpublished' : 'Published'); vPreview(id);
  };
  view.onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) go('form', { ...qs.find((q) => q.id === b.dataset.q), test_questions: [{ test_id: id }] }); };
}
