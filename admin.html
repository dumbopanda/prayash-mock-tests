<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Admin · Mock Tests</title>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div class="adm" id="adm">
  <aside class="side" id="side"><div class="brand"><span class="logo">M</span><span class="t">Mock Tests</span><span class="chip t">Admin</span></div>
    <nav id="nav" aria-label="Admin"></nav>
    <div class="side-foot"><button class="nav-i" id="col" type="button" aria-expanded="true" title="Collapse sidebar"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3v10"/></svg><span class="t">Collapse</span></button></div></aside>
  <div class="scrim" id="scrim"></div>
  <div class="shell-r">
    <header class="topbar">
      <button class="icon-btn menu" id="menu" type="button" aria-label="Open menu"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
      <button class="btn sm back" id="goback" type="button" aria-label="Back">‹ Back</button>
      <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav><span class="grow"></span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg></button>
      <div class="acct"><button class="avatar" id="acct" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Account"></button>
        <div class="pop" id="pop" hidden><span class="muted" id="who"></span><button class="btn sm" id="out" type="button">Sign out</button></div></div>
    </header>
    <main class="main"><div class="page" id="view"></div></main>
  </div>
</div>
<script type="module">
import { sb, rpc, currentUser, logout } from './shared.js';
import { SUBJECTS, STRATEGIES, stratName, esc, fmt, cap, when, stat, readQuestions, CSV_HEADER, pct, verdictOf, subjectStats, periodReport, trendSvg, barsSvg, mmss, plural } from './util.js';

try { screen.orientation?.unlock?.(); } catch { /* not supported */ } // admin: any orientation; only her test pages lock to landscape
const $ = (s) => document.querySelector(s);
const view = $('#view');
const IMG = 'question-images';
const imgPath = (url) => url?.split(`/${IMG}/`)[1]; // storage path from its public URL
const toLocal = (iso) => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
// Next 5-minute mark, for new tests
const soon = () => { const d = new Date(Math.ceil(Date.now() / 3e5) * 3e5); return toLocal(d.toISOString()); };
// Supabase returns at most 1000 rows a request, so page through. build() makes a fresh query each time.
async function fetchAll(build) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await build().range(i, i + 999);
    if (error) return { data: null, error };
    out.push(...data);
    if (data.length < 1000) return { data: out, error: null };
  }
}
// Same question text in the same subject, ignoring case and spaces
const dupKey = (subject, body) => subject + '|' + body.toLowerCase().replace(/\s+/g, ' ').trim();
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 5000); };

const me = await currentUser();
if (!me) { location.href = 'index.html'; await new Promise(() => {}); }
if (me.role !== 'admin') { document.body.innerHTML = '<p class="center">Admins only.</p>'; await new Promise(() => {}); }

$('#out').onclick = logout;
$('#who').textContent = me.email ?? '';
$('#acct').textContent = (me.email ?? 'A')[0];
const adm = $('#adm'), store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} };
// Sidebar: collapses to icons on desktop, slides in as a drawer on small screens
const setMini = (m) => { adm.classList.toggle('mini', m); $('#col').setAttribute('aria-expanded', !m); $('#col').title = m ? 'Expand sidebar' : 'Collapse sidebar'; store('mini', m ? 1 : 0); };
setMini(store('mini') === '1');
$('#col').onclick = () => setMini(!adm.classList.contains('mini'));
const drawer = (o) => { adm.classList.toggle('open', o); };
$('#menu').onclick = () => drawer(true);
$('#scrim').onclick = () => drawer(false);
$('#refresh').onclick = () => render();
const pop = (o) => { $('#pop').hidden = !o; $('#acct').setAttribute('aria-expanded', o); };
$('#acct').onclick = (e) => { e.stopPropagation(); pop($('#pop').hidden); };
addEventListener('click', (e) => { if (!e.target.closest('.acct')) pop(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') { pop(false); drawer(false); } });

// Sidebar, grouped by what the admin is doing
const ICON = {
  home: '<path d="M3 8.5 8 3l5 5.5V13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>', doc: '<path d="M4 2h6l3 3v9H4z"/><path d="M6 8h5M6 11h5"/>',
  tests: '<rect x="3" y="3" width="10" height="11" rx="1.5"/><path d="M6 3V2h4v1M6 8h4M6 11h3"/>', check: '<path d="M3 8.5l3 3 7-7"/>',
  list: '<path d="M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/>', plus: '<path d="M8 3v10M3 8h10"/>', up: '<path d="M8 11V3M5 6l3-3 3 3M3 13h10"/>',
};
const NAV = [
  ['Monitor', [['dash', 'Dashboard', 'home'], ['report', 'Weekly report', 'doc']]],
  ['Tests', [['tests', 'All tests', 'tests'], ['results', 'Results', 'check']]],
  ['Content', [['questions', 'Question bank', 'list'], ['form', 'Add question', 'plus'], ['import', 'Import CSV', 'up']]],
];
$('#nav').innerHTML = NAV.map(([g, items]) => `<div class="nav-g"><span class="lbl">${g}</span>${items.map(([v, n, i]) =>
  `<a class="nav-i" href="#${v}" data-v="${v}" title="${n}"><svg viewBox="0 0 16 16" aria-hidden="true">${ICON[i]}</svg><span class="t">${n}</span></a>`).join('')}</div>`).join('');

// Routing by URL hash, so reload and the back button stay on the same page
const views = { dash: vDash, questions: vQuestions, form: vForm, import: vImport, tests: vTests, testform: vTestForm, preview: vPreview, results: vResults, sheet: vSheet, report: vReport };
const SUB = { testform: ['tests', 'Test'], preview: ['tests', 'Preview'], sheet: ['results', 'Answer sheet'] }; // pages not in the sidebar: [parent, name]
const UP = { testform: 'tests', preview: 'tests', sheet: 'results', form: 'questions', import: 'questions' }; // Back goes here; other pages go to the dashboard
let ARG;
function go(v, arg) { ARG = arg; if (location.hash.slice(1) === v) render(); else location.hash = v; }
function render() {
  const v = views[location.hash.slice(1)] ? location.hash.slice(1) : 'dash', arg = ARG; ARG = undefined;
  view.oninput = view.onchange = view.onclick = null;
  const nv = SUB[v]?.[0] ?? v;
  document.querySelectorAll('.nav-i').forEach((a) => { const on = a.dataset.v === nv; a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  let [g, n] = (() => { for (const [g, items] of NAV) { const i = items.find((x) => x[0] === nv); if (i) return [g, i[1]]; } })();
  if (SUB[v]) n = `<a class="link" href="#${nv}">${n}</a><span>/</span><b>${SUB[v][1]}</b>`; else n = `<b>${n}</b>`;
  $('#crumb').innerHTML = `<span>${g}</span><span>/</span>${n}`;
  $('#goback').hidden = v === 'dash';
  $('#goback').onclick = () => go(UP[v] ?? 'dash'); // one level up, the same on every page
  drawer(false);
  scrollTo(0, 0);
  views[v](arg);
}
addEventListener('hashchange', render);

/* ---------- Dashboard ---------- */
const DAY = 864e5;
// Draft / Upcoming / Live (in its slot) / Open (slot over; she can still take it)
const statusOf = (t) => { const s = Date.parse(t.start_at), n = Date.now(); return !t.published ? 'Draft' : n < s ? 'Upcoming' : t.end_at && n > Date.parse(t.end_at) ? 'Closed' : n < s + t.duration_min * 60000 ? 'Live' : 'Open'; };
const statusChip = (t) => { const s = statusOf(t); return `<span class="chip ${s === 'Live' ? 'ok' : ''}">${s === 'Live' ? '● ' : ''}${s}</span>`; };

async function vDash() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const [qs, ts, st] = await Promise.all([
    fetchAll(() => sb.from('questions').select('id,subject,chapter,question_keys(correct)')),
    sb.from('tests').select('id,title,start_at,duration_min,published,test_questions(questions(subject))').order('start_at', { ascending: false }),
    sb.from('profiles').select('id,name').eq('role', 'student'),
  ]);
  const err = qs.error || ts.error || st.error;
  if (err) return (view.innerHTML = `<p class="err">${esc(err.message)}</p>`);
  const prog = await Promise.all(st.data.map((s) => sb.rpc('get_progress', { p_student: s.id }).then((r) => ({ s, at: r.data?.attempts ?? [] }))));
  const all = prog.flatMap((p) => p.at.map((a) => ({ ...a, student: p.s.name }))).sort((a, b) => (a.submitted_at < b.submitted_at ? -1 : 1));
  const now = Date.now(), wk = all.filter((a) => Date.parse(a.submitted_at) >= now - 7 * DAY);
  const mins = Math.round(wk.reduce((n, a) => n + Object.values(a.times || {}).reduce((x, y) => x + y, 0), 0) / 60);
  const flagged = wk.filter((a) => (a.flags || []).length);
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
  const perDay = days.map((d) => all.filter((a) => new Date(a.submitted_at).toDateString() === d.toDateString()).length);
  const counts = (t) => SUBJECTS.map((s) => t.test_questions.filter((x) => x.questions.subject === s).length);
  const attemptsOf = (t) => all.filter((a) => a.test_id === t.id).length;

  const todo = []; // [text, page]
  ts.data.filter((t) => !attemptsOf(t) && counts(t).some((c) => c !== 15)).forEach((t) => todo.push([`<b>${esc(t.title)}</b> has ${counts(t).join(' / ')} questions (P / C / M / B), not 15 each`, 'tests']));
  const drafts = ts.data.filter((t) => !t.published).length;
  if (drafts) todo.push([`${plural(drafts, 'test')} still in draft`, 'tests']);
  const keyless = qs.data.filter((q) => !q.question_keys).length;
  if (keyless) todo.push([`${plural(keyless, 'question')} without an answer key`, 'questions']);
  if (!st.data.length) todo.push(['No student account yet. Create one from the sign-in page.', 'dash']);
  prog.forEach(({ s, at }) => { const last = at.at(-1); if (!last || now - Date.parse(last.submitted_at) > 7 * DAY) todo.push([`<b>${esc(s.name)}</b> has not taken a test in the last 7 days`, 'results']); });
  if (flagged.length) todo.push([`${plural(flagged.length, 'attempt')} with cheat flags this week`, 'results']);

  const panel = (title, body, link) => `<div class="tray"><div class="row tray-head"><span class="ttl">${title}</span><span class="grow"></span>${link ? `<a class="link" href="#${link[0]}">${link[1]}</a>` : ''}</div><div class="card ${body.cls ?? ''}">${body.html ?? body}</div></div>`;
  const bySubj = SUBJECTS.map((s) => ({ s, n: qs.data.filter((q) => q.subject === s).length, c: new Set(qs.data.filter((q) => q.subject === s && q.chapter).map((q) => q.chapter)).size }));
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Dashboard</h1><span class="muted">Tests, scores and activity. Counts are for the last 7 days unless noted.</span></div><span class="grow"></span>
      <a class="btn dark" href="#testform">New test</a><a class="btn" href="#form">Add question</a></div>
    <div class="stats">${stat('Students', st.data.length)}${stat('Tests taken', wk.length)}${stat('Average score', wk.length ? Math.round(wk.reduce((n, a) => n + pct(a), 0) / wk.length) + '%' : '–')}
      ${stat('Time practised', mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`)}${stat('Cheat flags', flagged.reduce((n, a) => n + a.flags.length, 0))}${stat('Questions in bank', qs.data.length)}</div>
    <div class="g2">
      ${panel('Tests taken per day', `${barsSvg(perDay, days.map((d) => d.getDate()))}<p class="muted">Last 14 days</p>`)}
      ${panel('Needs attention', { cls: 'list', html: todo.map(([t, p]) => `<a class="li todo" href="#${p}"><span class="grow">${t}</span><span class="muted">›</span></a>`).join('') || '<p class="muted li">Nothing needs attention.</p>' })}
      ${panel('Score trend', `${trendSvg(all.slice(-10).map((a, i) => ({ label: 'T' + (i + 1), value: pct(a) })))}`, ['results', 'Results'])}
      ${panel('Tests', { cls: 'tbl', html: `<table><tr><th>Title</th><th>Starts</th><th>Status</th><th>Taken</th></tr>${ts.data.slice(0, 5).map((t) => `<tr><td>${esc(t.title)}</td><td class="mono">${when(t.start_at)}</td><td>${statusChip(t)}</td><td class="mono">${attemptsOf(t)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No tests yet.</td></tr>'}</table>` }, ['tests', 'All tests'])}
    </div>
    ${panel('Recent attempts', { cls: 'tbl', html: `<table><tr><th>Student</th><th>Test</th><th>Score</th><th>Strategy</th><th>Flags</th><th>Submitted</th></tr>${[...all].reverse().slice(0, 6).map((a) => `<tr><td>${esc(a.student)}</td><td>${esc(a.title)}</td><td class="mono">${a.score} / ${a.max} · ${pct(a)}%</td><td>${esc(stratName(a.strategy))}</td><td class="mono">${(a.flags || []).length || '–'}</td><td class="mono">${when(a.submitted_at)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No attempts yet.</td></tr>'}</table>` }, ['results', 'All results'])}
    ${panel('Question bank', { cls: 'tbl', html: `<table><tr><th>Subject</th><th>Questions</th><th>Chapters</th></tr>${bySubj.map((r) => `<tr><td>${cap(r.s)}</td><td class="mono">${r.n}</td><td class="mono">${r.c}</td></tr>`).join('')}</table>` }, ['questions', 'Open'])}`;
}

/* ---------- Question bank ---------- */
const F = { subject: '', chapter: '', text: '', use: '', limit: 200 }; // bank filters, kept while moving between pages
async function vQuestions() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const { data, error } = await fetchAll(() => sb.from('questions').select('*, question_keys(correct, solution), test_questions(test_id)').order('created_at', { ascending: false }));
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const sel = new Set();
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Question bank</h1><span class="muted">${data.length} in the bank · ${data.filter((r) => !r.test_questions.length).length} not in any test</span></div><span class="grow"></span>
      <a class="btn" href="#import">Import CSV</a><a class="btn dark" href="#form">Add question</a></div>
    <div class="row filters">
      <select id="fs" class="field auto" aria-label="Subject"><option value="">All subjects</option>${SUBJECTS.map((s) => `<option value="${s}" ${s === F.subject ? 'selected' : ''}>${cap(s)}</option>`).join('')}</select>
      <select id="fc" class="field auto" aria-label="Chapter"></select>
      <select id="fu" class="field auto" aria-label="Use"><option value="">Used or not</option><option value="unused" ${F.use === 'unused' ? 'selected' : ''}>Not in any test</option><option value="used" ${F.use === 'used' ? 'selected' : ''}>In a test</option></select>
      <input id="ft" class="field grow" type="search" placeholder="Search question text" value="${esc(F.text)}" aria-label="Search"></div>
    <div class="tray"><div class="row tray-head"><span class="ttl" id="cnt"></span><span class="grow"></span>
      <button class="btn sm" id="selall">Select all shown</button><button class="btn sm danger" id="bulk" disabled>Delete selected</button></div>
      <div class="card tbl" id="qt"></div></div>`;
  const shown = () => data.filter((r) => (!F.subject || r.subject === F.subject) && (!F.chapter || r.chapter === F.chapter)
    && (!F.use || (F.use === 'used') === r.test_questions.length > 0) && (!F.text || r.body.toLowerCase().includes(F.text.toLowerCase())));
  const chapters = () => { const l = [...new Set(data.filter((r) => !F.subject || r.subject === F.subject).map((r) => r.chapter).filter(Boolean))].sort();
    if (!l.includes(F.chapter)) F.chapter = '';
    $('#fc').innerHTML = `<option value="">All chapters</option>${l.map((c) => `<option ${c === F.chapter ? 'selected' : ''}>${esc(c)}</option>`).join('')}`; };
  const table = () => {
    const l = shown();
    $('#cnt').textContent = `${plural(l.length, 'question')} shown${sel.size ? ` · ${sel.size} selected` : ''}`;
    $('#bulk').disabled = !sel.size;
    $('#qt').innerHTML = `<table><tr><th class="ck"></th><th>Subject</th><th>Chapter</th><th>Question</th><th>Ans</th><th>Tests</th><th></th></tr>
      ${l.slice(0, F.limit).map((r) => `<tr><td class="ck"><input type="checkbox" data-s="${r.id}" ${sel.has(r.id) ? 'checked' : ''} aria-label="Select"></td><td>${cap(r.subject)}</td><td>${esc(r.chapter) || '<span class="muted">–</span>'}</td>
        <td>${fmt(r.body.slice(0, 110))}${r.body.length > 110 ? '…' : ''}${r.image_url ? ' <span class="chip">Figure</span>' : ''}</td>
        <td class="mono">${r.question_keys ? 'ABCD'[r.question_keys.correct] : '<span class="err">none</span>'}</td><td class="mono">${r.test_questions.length || '–'}</td>
        <td class="actions"><button class="btn sm" data-e="${r.id}">Edit</button>${r.test_questions.length ? '' : `<button class="btn sm danger" data-d="${r.id}">Delete</button>`}</td></tr>`).join('')
        || '<tr><td colspan="7" class="muted">No questions match. Import a CSV or change the filters.</td></tr>'}</table>
      ${l.length > F.limit ? `<div class="row li"><span class="muted">Showing ${F.limit} of ${l.length}.</span><button class="btn sm" id="more">Show all</button></div>` : ''}`;
    $('#more')?.addEventListener('click', () => { F.limit = Infinity; table(); });
  };
  const del = async (ids) => {
    const used = ids.filter((id) => data.find((r) => r.id === id).test_questions.length), free = ids.filter((id) => !used.includes(id));
    if (!free.length) return toast('These questions are used in tests. Remove them from the tests first.');
    if (!confirm(`Delete ${plural(free.length, 'question')}?${used.length ? ` ${used.length} used in tests will be kept.` : ''} This cannot be undone.`)) return;
    for (let i = 0; i < free.length; i += 100) { // short URLs
      const { error } = await sb.from('questions').delete().in('id', free.slice(i, i + 100));
      if (error) return toast(error.message);
    }
    const paths = free.map((id) => imgPath(data.find((r) => r.id === id).image_url)).filter(Boolean);
    if (paths.length) await sb.storage.from(IMG).remove(paths);
    toast(`Deleted ${plural(free.length, 'question')}`);
    vQuestions();
  };
  view.onchange = (e) => {
    const t = e.target;
    if (t.id === 'fs') { F.subject = t.value; chapters(); }
    else if (t.id === 'fc') F.chapter = t.value;
    else if (t.id === 'fu') F.use = t.value;
    else if (t.dataset.s) t.checked ? sel.add(t.dataset.s) : sel.delete(t.dataset.s);
    table();
  };
  view.oninput = (e) => { if (e.target.id === 'ft') { F.text = e.target.value; table(); } };
  view.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.e) go('form', data.find((r) => r.id === b.dataset.e));
    else if (b.dataset.d) del([b.dataset.d]);
    else if (b.id === 'bulk') del([...sel]);
    else if (b.id === 'selall') { shown().slice(0, F.limit).forEach((r) => sel.add(r.id)); table(); }
  };
  chapters(); table();
}

/* ---------- Add / edit question ---------- */
function vForm(q, keep = {}) { // keep: subject and chapter carried over by "Save & add another"
  const k = q?.question_keys ?? {};
  const opts = q?.options ?? ['', '', '', ''];
  view.innerHTML = `
    <div class="head"><h1>${q ? 'Edit' : 'Add'} question</h1></div>
    ${q?.test_questions?.length ? `<p class="note">Used in ${plural(q.test_questions.length, 'test')}. Edits show in those tests. A changed answer or marks re-grades tests already taken.</p>` : ''}
    <div class="split"><div class="tray"><span class="lbl">Question</span><div class="card stack">
      <div class="row">
        <div class="col"><label class="lbl" for="subj">Subject</label><select id="subj" class="field">${SUBJECTS.map((s) => `<option value="${s}" ${(q?.subject ?? keep.subject) === s ? 'selected' : ''}>${cap(s)}</option>`).join('')}</select></div>
        <div class="col x2"><label class="lbl" for="chap">Chapter</label><input id="chap" class="field" list="chaps" value="${esc(q?.chapter ?? keep.chapter ?? '')}"><datalist id="chaps"></datalist></div>
        <div class="col s"><label class="lbl" for="marks">Marks</label><input id="marks" class="field mono" type="number" min="1" value="${q?.marks ?? 4}"></div>
      </div>
      <div class="col"><label class="lbl" for="body">Question text</label><textarea id="body" class="field" rows="4">${esc(q?.body ?? '')}</textarea>
        <span class="muted">x^2 power · x^{-3} · H_2O subscript · sqrt(10) root</span></div>
      <div class="col"><label class="lbl" for="img">Image (optional)</label><input id="img" type="file" accept="image/*">
        ${q?.image_url ? `<span class="row"><img class="thumb" src="${esc(q.image_url)}" alt="Current figure"><label class="opt sm-text"><input type="checkbox" id="noimg"> Remove the current image</label></span><span class="muted">Picking a new file replaces it.</span>` : ''}</div>
      <div class="stack tight"><span class="lbl">Options · mark the correct one</span>
        ${[0, 1, 2, 3].map((i) => `<div class="opt"><input type="radio" name="ans" value="${i}" aria-label="${'ABCD'[i]} is correct" ${k.correct === i ? 'checked' : ''}>
          <span class="key">${'ABCD'[i]}</span><input class="field o" aria-label="Option ${'ABCD'[i]}" value="${esc(opts[i])}"></div>`).join('')}</div>
      <div class="col"><label class="lbl" for="sol">Solution</label><textarea id="sol" class="field" rows="3">${esc(k.solution ?? '')}</textarea></div>
      <div class="err" id="msg" role="alert"></div>
      <div class="row"><button class="btn dark" id="save">Save question</button>${q ? '' : '<button class="btn" id="again">Save &amp; add another</button>'}</div>
    </div></div>
    <div class="tray"><span class="lbl">Student preview</span><div class="card" id="pv"></div></div></div>`;

  const preview = () => {
    const o = [...view.querySelectorAll('.o')].map((x) => x.value);
    const c = Number(view.querySelector('input[name=ans]:checked')?.value ?? -1);
    $('#pv').innerHTML = `<div class="qblock"><div class="qbody">${fmt($('#body').value) || '<span class="muted">Question appears here</span>'}</div>
      ${q?.image_url && !$('#noimg')?.checked ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure for this question">` : ''}
      ${o.map((t, i) => `<div class="optline ${i === c ? 'right' : ''}"><span class="key">${'ABCD'[i]}</span><span class="grow">${fmt(t)}</span>${i === c ? '<span>✓ correct</span>' : ''}</div>`).join('')}</div>`;
  };
  view.oninput = view.onchange = preview;
  preview();
  // suggest chapter names already in the bank, so spellings stay the same
  fetchAll(() => sb.from('questions').select('chapter')).then(({ data }) => { const d = $('#chaps'); if (d && data) d.innerHTML = [...new Set(data.map((x) => x.chapter).filter(Boolean))].sort().map((c) => `<option value="${esc(c)}">`).join(''); });

  async function save(again) {
    const msg = $('#msg'); msg.textContent = '';
    const options = [...view.querySelectorAll('.o')].map((x) => x.value.trim());
    const correct = view.querySelector('input[name=ans]:checked')?.value;
    if (!$('#body').value.trim()) return (msg.textContent = 'Write the question.');
    if (options.some((x) => !x)) return (msg.textContent = 'Fill all four options.');
    if (correct === undefined) return (msg.textContent = 'Mark the correct option.');
    $('#save').disabled = true;
    let image_url = $('#noimg')?.checked ? null : q?.image_url ?? null;
    const file = $('#img').files[0];
    if (file) {
      const path = `${crypto.randomUUID()}.${file.name.split('.').pop().toLowerCase()}`;
      const up = await sb.storage.from(IMG).upload(path, file);
      if (up.error) { $('#save').disabled = false; return (msg.textContent = up.error.message); }
      image_url = sb.storage.from(IMG).getPublicUrl(path).data.publicUrl;
    }
    const row = { subject: $('#subj').value, chapter: $('#chap').value.trim(), body: $('#body').value.trim(), options, image_url, marks: Number($('#marks').value) || 4 };
    const r = q ? await sb.from('questions').update(row).eq('id', q.id).select('id').single() : await sb.from('questions').insert(row).select('id').single();
    if (r.error) { $('#save').disabled = false; return (msg.textContent = r.error.message); }
    const key = await sb.from('question_keys').upsert({ question_id: r.data.id, correct: Number(correct), solution: $('#sol').value.trim() });
    if (key.error) {
      if (!q) await sb.from('questions').delete().eq('id', r.data.id); // never keep a new question without its answer key
      $('#save').disabled = false; return (msg.textContent = key.error.message);
    }
    if ((file || !image_url) && imgPath(q?.image_url)) await sb.storage.from(IMG).remove([imgPath(q.image_url)]); // replaced or removed image
    toast(q ? 'Question saved' : 'Question added');
    again ? vForm(null, { subject: row.subject, chapter: row.chapter }) : go('questions');
  }
  $('#save').onclick = () => save(false);
  if (!q) $('#again').onclick = () => save(true);
}

// One paper = one CSV + its pictures. Check runs on every change; nothing is saved until Import.
function vImport() {
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Import a paper</h1><span class="muted">Choose the CSV and its pictures. Nothing is saved until you press Import.</span></div><span class="grow"></span><button class="btn" id="tpl">Download template</button></div>
    <div class="tray"><span class="lbl">1 · Files</span><div class="card stack">
      <div class="row top-align">
        <div class="col"><label class="lbl" for="file">CSV file</label><input id="file" type="file" accept=".csv,text/csv"></div>
        <div class="col"><label class="lbl" for="imgs">Pictures · select all at once</label><input id="imgs" type="file" accept="image/*" multiple></div></div>
      <details><summary class="muted">Or paste CSV text</summary><textarea id="txt" class="field mono" rows="6" aria-label="CSV text"></textarea></details>
      <p class="muted">Columns: <span class="mono">${CSV_HEADER}</span>. Correct is A, B, C or D. Write x^2, 10^{-3}, H_2O, sqrt(10), A -> B. In Excel use Save As → "CSV UTF-8".</p></div></div>
    <div id="chk"></div>
    <div class="tray" id="opts" hidden><span class="lbl">3 · Save</span><div class="card stack">
      <label class="opt"><input type="radio" name="mk" value="test" checked><span>Add to the bank <b>and create a test</b> from this paper</span></label>
      <label class="opt"><input type="radio" name="mk" value="bank"> Add to the bank only</label>
      <div class="row" id="tf">
        <div class="col x2"><label class="lbl" for="title">Test title</label><input id="title" class="field"></div>
        <div class="col"><label class="lbl" for="start">Opens</label><input id="start" class="field" type="datetime-local" value="${soon()}"></div>
        <div class="col s"><label class="lbl" for="dur">Minutes</label><input id="dur" class="field mono" type="number" min="5" value="120"></div>
        <div class="col m"><label class="lbl" for="neg">Negative marks</label><input id="neg" class="field mono" type="number" min="0" step="0.25" value="1"></div>
        <label class="opt"><input type="checkbox" id="pub"> Publish now</label></div>
      <div class="err" id="msg" role="alert"></div>
      <div class="row"><button class="btn dark lg" id="go">Import</button><span class="muted" id="gonote"></span></div></div></div>`;
  let R = null, bank = null;
  $('#tpl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + CSV_HEADER + '\nphysics,Electricity,"Three 6 ohm resistors are joined in parallel. The total resistance is",18 ohm,2 ohm,6 ohm,3 ohm,B,"1/R = 3/6, so R = 2 ohm",4,phy_p01_q01.png\nchemistry,"Acids, Bases and Salts","The pH of a neutral solution at 25 °C is",0,7,14,1,B,Neutral water has [H^+] = 10^{-7},4,\n'], { type: 'text/csv' }));
    a.download = 'paper-template.csv'; a.click();
  };
  const check = async () => {
    const txt = $('#txt').value;
    if (!txt.trim()) { $('#chk').innerHTML = ''; $('#opts').hidden = true; return; }
    if (!bank) {
      $('#chk').innerHTML = '<p class="muted">Checking…</p>';
      const b = await fetchAll(() => sb.from('questions').select('id,subject,chapter,body,test_questions(test_id)'));
      if (b.error) return ($('#chk').innerHTML = `<p class="err">${esc(b.error.message)}</p>`);
      bank = b.data;
    }
    const r = readQuestions(txt);
    const files = new Map([...$('#imgs').files].map((f) => [f.name.toLowerCase(), f]));
    const known = new Map(bank.map((b) => [dupKey(b.subject, b.body), b]));
    const chaps = new Set(bank.map((b) => b.chapter)), seen = new Set();
    r.ok.forEach((q) => {
      const k = dupKey(q.subject, q.body), ex = known.get(k);
      q.existing = ex?.id ?? null;
      if (seen.has(k)) r.errors.push(`Row ${q.row}: same question as an earlier row`);
      seen.add(k);
      if (ex) r.warnings.push(`Row ${q.row}: already in the bank${ex.test_questions.length ? ` and used in ${plural(ex.test_questions.length, 'test')}` : ''}. The bank copy is used; it is not added twice.`);
      if (q.image && !ex) {
        const f = files.get(q.image.toLowerCase());
        if (!f) r.errors.push(`Row ${q.row}: picture "${q.image}" not selected`);
        else if (f.size > 1.5e6) r.warnings.push(`Row ${q.row}: picture "${q.image}" is ${(f.size / 1e6).toFixed(1)} MB and will load slowly`);
      }
    });
    const used = new Set(r.ok.map((q) => q.image?.toLowerCase()).filter(Boolean)), extra = [...files.keys()].filter((n) => !used.has(n));
    if (extra.length) r.warnings.push(`Pictures not named in the CSV: ${extra.join(', ')}`);
    const newCh = [...new Set(r.ok.filter((q) => q.chapter && !chaps.has(q.chapter)).map((q) => `${q.chapter} (${cap(q.subject)})`))];
    if (bank.length && newCh.length) r.warnings.push(`New chapter names: ${newCh.join('; ')}. Check they are spelt as in earlier papers.`);
    const n = SUBJECTS.map((s) => r.ok.filter((q) => q.subject === s).length);
    if (n.some((c) => c !== 15)) r.warnings.push(`Subjects have ${n.join(' / ')} questions (P / C / M / B), not 15 each.`);
    const rowNo = (x) => +(/^Row (\d+)/.exec(x)?.[1] ?? 1e9);
    r.errors.sort((x, y) => rowNo(x) - rowNo(y)); r.warnings.sort((x, y) => rowNo(x) - rowNo(y));
    R = r;
    const fresh = r.ok.filter((q) => !q.existing).length, urls = [];
    const thumb = (q) => { const f = q.image && files.get(q.image.toLowerCase()); if (!f) return q.image ? `<span class="mono muted">${esc(q.image)}</span>` : ''; const u = URL.createObjectURL(f); urls.push(u); return `<img class="thumb" src="${u}" alt="${esc(q.image)}">`; };
    $('#chk').innerHTML = `<div class="tray"><span class="lbl">2 · Check</span><div class="card stack">
      <div class="row tight">${r.errors.length ? `<span class="chip bad">✗ ${plural(r.errors.length, 'problem')} to fix</span>` : '<span class="chip ok">✓ Ready to import</span>'}
        <span class="chip">${plural(r.ok.length, 'question')}</span>${SUBJECTS.map((s, i) => `<span class="chip ${n[i] === 15 ? '' : 'warn'}">${cap(s).slice(0, 4)} ${n[i]}</span>`).join('')}${fresh < r.ok.length ? `<span class="chip">${r.ok.length - fresh} already in bank</span>` : ''}</div>
      ${r.errors.length ? `<div class="issues bad"><b>Fix these first</b> (missing pictures: add them above; anything else: fix the CSV and choose it again)<ul>${r.errors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.warnings.length ? `<div class="issues"><b>Check these</b> (import still works)<ul>${r.warnings.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="tbl pv"><table><tr><th>Row</th><th>Subject</th><th>Chapter</th><th>Question</th><th>Ans</th><th>Picture</th></tr>
        ${r.ok.map((q) => `<tr><td class="mono">${q.row}</td><td>${cap(q.subject)}</td><td>${esc(q.chapter)}</td><td>${fmt(q.body.slice(0, 120))}${q.body.length > 120 ? '…' : ''}${q.existing ? ' <span class="chip">In bank</span>' : ''}</td><td class="mono">${'ABCD'[q.correct]}</td><td>${thumb(q)}</td></tr>`).join('')}</table></div></div></div>`;
    $('#opts').hidden = !r.ok.length;
    $('#go').disabled = !!r.errors.length || !r.ok.length;
    $('#gonote').textContent = r.errors.length ? 'Fix the problems above first.' : '';
  };
  const mode = () => view.querySelector('input[name=mk]:checked').value;
  view.onchange = async (e) => {
    const t = e.target;
    if (t.id === 'file' && t.files[0]) {
      $('#txt').value = await t.files[0].text();
      if (!$('#title').value) $('#title').value = t.files[0].name.replace(/\.csv$/i, '').replace(/[_-]+/g, ' ');
    }
    if (t.name === 'mk') { $('#tf').hidden = mode() !== 'test'; $('#go').textContent = mode() === 'test' ? 'Import and create test' : 'Import'; return; }
    if (['file', 'imgs'].includes(t.id)) check();
  };
  let deb = 0;
  view.oninput = (e) => { if (e.target.id === 'txt') { clearTimeout(deb); deb = setTimeout(check, 400); } };
  $('#go').textContent = 'Import and create test';
  $('#go').onclick = async () => {
    const msg = $('#msg'), test = mode() === 'test';
    msg.textContent = '';
    if (!R || R.errors.length) return;
    if (test && (!$('#title').value.trim() || !$('#start').value)) return (msg.textContent = 'Give the test a title and an opening time.');
    $('#go').disabled = true; $('#go').textContent = 'Importing…';
    const fail = (m) => { msg.textContent = m; $('#go').disabled = false; $('#go').textContent = test ? 'Import and create test' : 'Import'; };
    const fresh = R.ok.filter((q) => !q.existing);
    const files = Object.fromEntries([...$('#imgs').files].map((f) => [f.name.toLowerCase(), f])), urls = {}, paths = [];
    const undo = () => paths.length && sb.storage.from(IMG).remove(paths);
    for (const name of new Set(fresh.map((q) => q.image?.toLowerCase()).filter(Boolean))) {
      const path = `${crypto.randomUUID()}.${name.split('.').pop()}`;
      const up = await sb.storage.from(IMG).upload(path, files[name]);
      if (up.error) { await undo(); return fail(`Nothing imported: ${up.error.message}`); }
      paths.push(path); urls[name] = sb.storage.from(IMG).getPublicUrl(path).data.publicUrl;
    }
    // ids made here so keys and test rows match exactly; created_at keeps the CSV order
    const base = Date.now();
    fresh.forEach((q) => (q.id = crypto.randomUUID()));
    if (fresh.length) {
      const ins = await sb.from('questions').insert(fresh.map((q, i) => ({ id: q.id, subject: q.subject, chapter: q.chapter, body: q.body, options: q.options, marks: q.marks,
        image_url: q.image ? urls[q.image.toLowerCase()] : null, created_at: new Date(base + i).toISOString() })));
      if (ins.error) { await undo(); return fail(`Nothing imported: ${ins.error.message}`); }
      const keys = await sb.from('question_keys').insert(fresh.map((q) => ({ question_id: q.id, correct: q.correct, solution: q.solution })));
      if (keys.error) {
        await sb.from('questions').delete().in('id', fresh.map((q) => q.id)); // all or nothing
        await undo(); return fail(`Nothing imported: ${keys.error.message}`);
      }
    }
    bank = null;
    if (!test) { toast(`Imported ${plural(fresh.length, 'question')}`); return go('questions'); }
    const t = await sb.from('tests').insert({ title: $('#title').value.trim(), start_at: new Date($('#start').value).toISOString(), duration_min: Number($('#dur').value) || 120,
      neg_marks: Number($('#neg').value), published: $('#pub').checked, cheat_flags: true, strategies: Object.keys(STRATEGIES) }).select('id').single();
    if (t.error) { toast(`Questions imported, but the test was not created: ${t.error.message}`); return go('questions'); }
    const order = [...R.ok].sort((a, b) => SUBJECTS.indexOf(a.subject) - SUBJECTS.indexOf(b.subject)); // stable: CSV order inside each subject
    const tq = await sb.from('test_questions').insert(order.map((q, i) => ({ test_id: t.data.id, question_id: q.existing ?? q.id, position: i + 1 })));
    if (tq.error) { await sb.from('tests').delete().eq('id', t.data.id); toast(`Questions imported, but the test was not created: ${tq.error.message}`); return go('questions'); }
    toast(`Imported ${plural(fresh.length, 'question')} and created the test`);
    go('preview', t.data.id);
  };
}

/* ---------- Tests ---------- */
async function vTests() {
  const { data, error } = await sb.from('tests').select('*, test_questions(question_id, questions(subject, marks, question_keys(correct))), attempts(id, submitted_at)').order('start_at', { ascending: false });
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const counts = (t) => SUBJECTS.map((s) => t.test_questions.filter((x) => x.questions.subject === s).length);
  view.innerHTML = `
    <div class="head"><div class="title"><h1>Tests</h1><span class="muted">Preview a test before publishing. She sees only published tests.</span></div><span class="grow"></span><a class="btn" href="#import">Import a paper</a><button class="btn dark" id="new">New test</button></div>
    <div class="tray"><span class="lbl">${plural(data.length, 'test')}</span><div class="card list">
      ${data.map((t) => { const n = counts(t), done = t.attempts.filter((a) => a.submitted_at).length;
        return `<div class="li wrap"><div class="col"><span class="row tight"><b>${esc(t.title)}</b>${statusChip(t)}${n.every((c) => c === 15) ? '' : `<span class="chip warn">${n.join(' / ')} (P / C / M / B)</span>`}</span>
        <span class="muted">${when(t.start_at)}${t.end_at ? ` to ${when(t.end_at)}` : ''} · ${t.duration_min} min${t.omr_min ? ` incl. ${t.omr_min} OMR` : ''} · +${[...new Set(t.test_questions.map((x) => x.questions.marks))].join('/') || 4} / −${t.neg_marks}${done ? ` · ${plural(done, 'attempt')}` : ''}${t.attempts.some((a) => !a.submitted_at) ? ' · one in progress' : ''}</span></div>
        <span class="row tight"><a class="btn sm" href="#preview" data-v="${t.id}">Preview</a><button class="btn sm" data-e="${t.id}">Edit</button>
        <button class="btn sm ${t.published ? '' : 'dark'}" data-p="${t.id}">${t.published ? 'Unpublish' : 'Publish'}</button>
        ${t.attempts.length ? '' : `<button class="btn sm danger" data-d="${t.id}">Delete</button>`}</span></div>`; }).join('') || '<p class="muted li">No tests yet. Import a paper to create one.</p>'}
    </div></div>`;
  view.onclick = async (e) => {
    const b = e.target.closest('[data-v],[data-e],[data-p],[data-d],#new'); if (!b) return;
    if (b.id === 'new') return go('testform');
    if (b.dataset.v) { e.preventDefault(); return go('preview', b.dataset.v); }
    const t = data.find((x) => x.id === (b.dataset.e || b.dataset.p || b.dataset.d));
    if (b.dataset.e) go('testform', t);
    else if (b.dataset.p) {
      if (!t.published) {
        const n = counts(t), keyless = t.test_questions.filter((x) => !x.questions.question_keys).length, issues = [];
        if (!t.test_questions.length) return toast('Add questions before publishing.');
        if (n.some((c) => c !== 15)) issues.push(`subjects have ${n.join(' / ')} questions, not 15 each`);
        if (keyless) issues.push(`${plural(keyless, 'question')} without an answer key`);
        if (issues.length && !confirm(`This test has ${issues.join(' and ')}. Publish anyway?`)) return;
      }
      const { error } = await sb.from('tests').update({ published: !t.published }).eq('id', t.id);
      if (error) return toast(error.message);
      toast(t.published ? 'Unpublished' : `Published. She can open it from ${when(Date.parse(t.start_at) - 15 * 60000)}.`);
      vTests();
    } else if (b.dataset.d) {
      if (t.attempts.length) return toast('She has attempts on this test. Unpublish it instead; her results stay.');
      if (!confirm(`Delete "${t.title}"? Questions stay in the bank.`)) return;
      const { error } = await sb.from('tests').delete().eq('id', t.id);
      if (error) return toast(error.message);
      toast('Test deleted'); vTests();
    }
  };
}

// The whole paper as she will see it, with answers, plus a pre-publish checklist
async function vPreview(id) {
  if (!id) return go('tests');
  view.innerHTML = '<p class="muted">Loading…</p>';
  const { data: t, error } = await sb.from('tests').select('*, test_questions(position, questions(*, question_keys(correct, solution)))').eq('id', id).single();
  if (error) return (view.innerHTML = `<p class="err">${esc(error.message)}</p>`);
  const qs = t.test_questions.sort((a, b) => a.position - b.position).map((x) => x.questions);
  const n = SUBJECTS.map((s) => qs.filter((q) => q.subject === s).length), keyless = qs.filter((q) => !q.question_keys).length;
  const checks = [[qs.length === 60, `${qs.length} questions`], [n.every((c) => c === 15), `${n.join(' / ')} per subject (P / C / M / B)`],
    [!keyless, keyless ? `${plural(keyless, 'question')} without an answer key` : 'Every question has an answer key'],
    [qs.every((q) => q.chapter), 'Every question has a chapter'], [true, `+${[...new Set(qs.map((q) => q.marks))].join('/')} / −${t.neg_marks}, ${t.duration_min} min`]];
  view.innerHTML = `<div class="head"><div class="title"><h1>${esc(t.title)}</h1><span class="muted">Opens ${when(t.start_at)} · ${statusOf(t)}</span></div><span class="grow"></span>
      <button class="btn" id="edit">Edit</button><button class="btn ${t.published ? '' : 'dark'}" id="pub">${t.published ? 'Unpublish' : 'Publish'}</button></div>
    <div class="tray"><span class="lbl">Checklist</span><div class="card list">${checks.map(([ok, txt]) => `<div class="li"><span class="chip ${ok ? 'ok' : 'warn'}">${ok ? '✓' : '!'}</span><span>${txt}</span></div>`).join('')}
      <div class="li" id="imgcheck"><span class="chip">…</span><span>Checking pictures</span></div></div></div>
    ${SUBJECTS.filter((s, i) => n[i]).map((s) => `<div class="tray"><span class="lbl">${cap(s)} · ${n[SUBJECTS.indexOf(s)]}</span><div class="card list">${qs.filter((q) => q.subject === s).map((q, i) => `<div class="qblock pq">
      <div class="row tight"><span class="mono muted">Q${i + 1}</span><span class="chip">${esc(q.chapter) || 'No chapter'}</span><span class="grow"></span><button class="btn sm" data-q="${q.id}">Edit question</button></div>
      <div class="qbody">${fmt(q.body)}</div>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure">` : ''}
      ${q.options.map((o, j) => `<div class="optline ${q.question_keys?.correct === j ? 'right' : ''}"><span class="key">${'ABCD'[j]}</span><span class="grow">${fmt(o)}</span>${q.question_keys?.correct === j ? '<span>✓ answer</span>' : ''}</div>`).join('')}
      ${q.question_keys?.solution ? `<p class="sol">${fmt(q.question_keys.solution)}</p>` : ''}</div>`).join('')}</div></div>`).join('') || '<p class="muted">No questions in this test yet.</p>'}`;
  const imgs = [...view.querySelectorAll('.qimg')];
  Promise.all(imgs.map((im) => (im.complete ? Promise.resolve(im.naturalWidth > 0) : new Promise((r) => { im.onload = () => r(true); im.onerror = () => r(false); })))).then((ok) => {
    const bad = ok.filter((x) => !x).length, el = $('#imgcheck'); if (!el) return;
    el.innerHTML = `<span class="chip ${bad ? 'warn' : 'ok'}">${bad ? '!' : '✓'}</span><span>${imgs.length ? (bad ? `${plural(bad, 'picture')} did not load` : `All ${plural(imgs.length, 'picture')} load`) : 'No pictures'}</span>`;
  });
  $('#edit').onclick = () => go('testform', t);
  $('#pub').onclick = async () => {
    if (!t.published && checks.some(([ok]) => !ok) && !confirm('Some checks are not met. Publish anyway?')) return;
    const { error } = await sb.from('tests').update({ published: !t.published }).eq('id', t.id);
    if (error) return toast(error.message);
    toast(t.published ? 'Unpublished' : 'Published'); vPreview(id);
  };
  view.onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) go('form', { ...qs.find((q) => q.id === b.dataset.q), test_questions: [{ test_id: id }] }); };
}

async function vTestForm(t) {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const [{ data: qs }, { data: use }, { count: attempts }] = await Promise.all([
    fetchAll(() => sb.from('questions').select('id,subject,chapter,body').order('created_at')),
    fetchAll(() => sb.from('test_questions').select('test_id,question_id')),
    t ? sb.from('attempts').select('*', { count: 'exact', head: true }).eq('test_id', t.id) : { count: 0 },
  ]);
  const winH = t?.end_at ? Math.round(((Date.parse(t.end_at) - Date.parse(t.start_at)) / 36e5) * 100) / 100 : '';
  if (!qs || !use) return (view.innerHTML = '<p class="err">Could not load questions.</p>');
  const chosen = new Set(use.filter((x) => x.test_id === t?.id).map((x) => x.question_id));
  const elsewhere = new Map(); use.filter((x) => x.test_id !== t?.id).forEach((x) => elsewhere.set(x.question_id, (elsewhere.get(x.question_id) || 0) + 1));
  view.innerHTML = `
    <div class="head"><h1>${t ? 'Edit' : 'New'} test</h1></div>
    ${attempts ? '<p class="note">She has taken this test, so its questions and negative marks are locked. Title, time, attempts and publishing can still change.</p>' : ''}
    <div class="tray"><span class="lbl">Settings</span><div class="card stack">
      <div class="row">
        <div class="col x2"><label class="lbl" for="title">Title</label><input id="title" class="field" value="${esc(t?.title ?? '')}"></div>
        <div class="col"><label class="lbl" for="start">Opens</label><input id="start" class="field" type="datetime-local" value="${t ? toLocal(t.start_at) : soon()}"></div>
        <div class="col s"><label class="lbl" for="dur">Minutes</label><input id="dur" class="field mono" type="number" min="5" value="${t?.duration_min ?? 120}"></div>
        <div class="col m"><label class="lbl" for="neg">Negative marks</label><input id="neg" class="field mono" type="number" min="0" step="0.25" value="${t?.neg_marks ?? 1}"></div>
        <div class="col s"><label class="lbl" for="att">Attempts</label><input id="att" class="field mono" type="number" min="1" max="10" value="${t?.max_attempts ?? 3}"></div>
      </div>
      <div class="row">
        <div class="col m"><label class="lbl" for="win">Open for (hrs)</label><input id="win" class="field mono" type="number" min="0" step="0.5" placeholder="No limit" value="${winH}"></div>
        <div class="col m"><label class="lbl" for="omr">OMR minutes</label><input id="omr" class="field mono" type="number" min="0" max="60" value="${t?.omr_min ?? 10}"></div>
        <p class="muted col x2" id="winTxt"></p>
      </div>
      <p class="muted">She can download it 15 minutes before it opens. OMR minutes come out of the test time at the end: answers lock and she copies them to a paper OMR sheet (0 turns it off). Every attempt is kept with its score and times.</p>
      <div class="row">
        <label class="opt"><input type="checkbox" id="cheat" ${t?.cheat_flags ?? true ? 'checked' : ''}> Record leaving fullscreen or the app</label>
        <label class="opt"><input type="checkbox" id="pub" ${t?.published ? 'checked' : ''}> Published</label>
      </div>
      <div class="stack tight"><span class="lbl">Strategies she can pick</span>
        <div class="row">${Object.entries(STRATEGIES).map(([k, v]) => `<label class="opt"><input type="checkbox" class="st" value="${k}" ${(t?.strategies ?? Object.keys(STRATEGIES)).includes(k) ? 'checked' : ''}> ${v[0]}</label>`).join('')}</div></div>
    </div></div>
    <div class="tray"><div class="row tray-head"><span class="ttl">Questions</span><span class="grow"></span>
      <input id="qf" class="field auto" type="search" placeholder="Search text or chapter" aria-label="Search questions">
      <label class="opt sm-text"><input type="checkbox" id="hide"> Hide ones used in other tests</label>
      <button class="btn sm" id="fill" title="Ticks random questions not used in any test until each subject has 15">Fill to 15 each</button></div>
      <div class="card"><div class="row top-align">${SUBJECTS.map((s) => `
      <div class="col pickcol"><span class="lbl">${cap(s)} · <span id="n-${s}">0</span> / 15</span>
        <div class="list pick">${qs.filter((x) => x.subject === s).map((x) => `
          <label data-t="${esc((x.chapter + ' ' + x.body).toLowerCase())}" data-u="${elsewhere.get(x.id) || 0}"><input type="checkbox" class="q" value="${x.id}" data-s="${s}" ${chosen.has(x.id) ? 'checked' : ''}><span><b>${esc(x.chapter) || '—'}</b> ${fmt(x.body.slice(0, 70))}${x.body.length > 70 ? '…' : ''}${elsewhere.get(x.id) ? ` <span class="chip">in ${plural(elsewhere.get(x.id), 'test')}</span>` : ''}</span></label>`).join('') || '<span class="muted">No questions.</span>'}</div></div>`).join('')}</div></div></div>
    <div class="err" id="msg" role="alert"></div>
    <div class="row"><button class="btn dark" id="save">Save test</button><button class="btn" id="back">Cancel</button></div>`;

  const count = () => SUBJECTS.forEach((s) => ($(`#n-${s}`).textContent = view.querySelectorAll(`.q[data-s=${s}]:checked`).length));
  const filter = () => { const f = $('#qf').value.toLowerCase(), h = $('#hide').checked;
    view.querySelectorAll('.pick label').forEach((l) => (l.hidden = (f && !l.dataset.t.includes(f)) || (h && l.dataset.u !== '0' && !l.querySelector('input').checked))); };
  // Plain-language window: when it opens, the latest start that still finishes in time, when it closes
  const winTxt = () => {
    const s = Date.parse($('#start').value), h = Number($('#win').value), d = Number($('#dur').value) || 120, o = Number($('#omr').value) || 0;
    const parts = [o ? `${d - o} min questions + ${o} min OMR.` : `${d} min, no OMR time.`];
    if (h && s) parts.push(h * 60 < d ? `The window must be at least ${d} min.` : `Start by ${when(s + h * 36e5 - d * 6e4)}, closes ${when(s + h * 36e5)}.`);
    else parts.push('She can start any time after it opens.');
    $('#winTxt').textContent = parts.join(' ');
  };
  view.onchange = () => { count(); filter(); winTxt(); };
  view.oninput = (e) => { if (e.target.id === 'qf') filter(); else winTxt(); };
  count(); winTxt();
  if (attempts) view.querySelectorAll('.q, #neg, #fill').forEach((x) => (x.disabled = true));
  $('#fill').onclick = () => {
    const short = [];
    SUBJECTS.forEach((s) => {
      const boxes = [...view.querySelectorAll(`.q[data-s=${s}]`)];
      let need = 15 - boxes.filter((b) => b.checked).length;
      const pool = boxes.filter((b) => !b.checked && !elsewhere.has(b.value)).sort(() => Math.random() - 0.5);
      while (need > 0 && pool.length) { pool.pop().checked = true; need--; }
      if (need > 0) short.push(`${cap(s)} needs ${need} more`);
    });
    count(); filter();
    toast(short.length ? `Not enough unused questions: ${short.join(', ')}` : 'Filled with unused questions');
  };
  $('#back').onclick = () => go('tests');
  $('#save').onclick = async () => {
    const msg = $('#msg');
    if (!$('#title').value.trim() || !$('#start').value) return (msg.textContent = 'Title and opening time are needed.');
    const strategies = [...view.querySelectorAll('.st:checked')].map((x) => x.value);
    if (!strategies.length) return (msg.textContent = 'Allow at least one strategy.');
    const start = new Date($('#start').value), dur = Number($('#dur').value) || 120, win = Number($('#win').value) || 0, omr = Math.round(Number($('#omr').value) || 0);
    if (win && win * 60 < dur) return (msg.textContent = `The window must be at least as long as the test (${dur} min).`);
    if (omr < 0 || omr > Math.min(60, dur / 2)) return (msg.textContent = 'OMR minutes must be between 0 and half the test time (60 at most).');
    $('#save').disabled = true;
    const row = { title: $('#title').value.trim(), start_at: start.toISOString(), duration_min: dur, neg_marks: Number($('#neg').value), cheat_flags: $('#cheat').checked, published: $('#pub').checked, strategies,
      max_attempts: Math.min(10, Math.max(1, Number($('#att').value) || 3)), omr_min: omr, end_at: win ? new Date(+start + win * 36e5).toISOString() : null };
    const r = t ? await sb.from('tests').update(row).eq('id', t.id).select('id').single() : await sb.from('tests').insert(row).select('id').single();
    if (r.error) { $('#save').disabled = false; return (msg.textContent = r.error.message); }
    if (!attempts) {
      let pos = 0; const rows = [];
      SUBJECTS.forEach((s) => view.querySelectorAll(`.q[data-s=${s}]:checked`).forEach((x) => rows.push({ test_id: r.data.id, question_id: x.value, position: ++pos })));
      // write the new list first, then drop unticked ones, so a failure never leaves the test empty
      if (rows.length) { const up = await sb.from('test_questions').upsert(rows); if (up.error) { $('#save').disabled = false; return (msg.textContent = up.error.message); } }
      const keep = new Set(rows.map((x) => x.question_id)), gone = [...chosen].filter((id) => !keep.has(id));
      for (let i = 0; i < gone.length; i += 100) {
        const d = await sb.from('test_questions').delete().eq('test_id', r.data.id).in('question_id', gone.slice(i, i + 100));
        if (d.error) { $('#save').disabled = false; return (msg.textContent = d.error.message); }
      }
    }
    toast('Test saved');
    go('preview', r.data.id);
  };
}

/* ---------- Results and report ---------- */
const FLAG = { fullscreen_exit: 'Left fullscreen', tab_hidden: 'Switched away or screen off' };

async function studentData(sid) {
  const { data: studs } = await sb.from('profiles').select('id,name').eq('role', 'student');
  if (!studs?.length) return { error: 'No student account yet.' };
  sid ??= studs[0].id;
  const r = await sb.rpc('get_progress', { p_student: sid });
  if (r.error) return { error: r.error.message };
  const picker = studs.length > 1 ? `<select id="stu" class="field auto noprint" aria-label="Student">${studs.map((s) => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>` : '';
  return { sid, name: studs.find((s) => s.id === sid).name, picker, ...r.data };
}

async function vResults(sid) {
  const d = await studentData(sid);
  if (d.error) return (view.innerHTML = `<h1>Results</h1><p class="muted">${esc(d.error)}</p>`);
  const { data: ts } = await sb.from('tests').select('*');
  const testOf = (id) => ts?.find((t) => t.id === id) ?? {};
  const flagLine = (a) => { const c = {}; (a.flags || []).forEach((f) => (c[f.type] = (c[f.type] || 0) + 1)); return Object.entries(c).map(([k, n]) => `${FLAG[k] ?? k} ×${n}`).join(' · ') || 'None'; };
  view.innerHTML = `<div class="head"><h1>Results</h1><span class="grow"></span>${d.picker}</div>
    <div class="tray"><span class="lbl">${plural(d.attempts.length, 'attempt')}</span><div class="card list">${[...d.attempts].reverse().map((a) => {
      const rows = d.answers.filter((r) => r.attempt_id === a.id), neg = +(testOf(a.test_id).neg_marks ?? 1);
      const subs = subjectStats(rows, [a]).filter((s) => s.total).map((s) => ({ ...s, score: rows.filter((r) => r.subject === s.subject && r.chosen === r.correct).reduce((n, r) => n + r.marks, 0) - s.wrong * neg, max: rows.filter((r) => r.subject === s.subject).reduce((n, r) => n + r.marks, 0) }));
      const active = Object.values(a.times || {}).reduce((x, y) => x + y, 0);
      const prev = d.attempts.find((x) => x.test_id === a.test_id && x.attempt_no === a.attempt_no - 1);
      return `<details class="rv"><summary><b>${esc(a.title)}</b>${a.attempt_no ? `<span class="chip">Attempt ${a.attempt_no}</span>` : ''}<span class="mono">${a.score} / ${a.max} · ${pct(a)}%${prev ? ` (${a.score === prev.score ? 'same as' : `${a.score > prev.score ? '+' : '−'}${Math.abs(a.score - prev.score)} vs`} attempt ${prev.attempt_no})` : ''}</span><span class="muted">${esc(stratName(a.strategy))} · ${when(a.submitted_at)}</span>
        <span class="chip ${(a.flags || []).length ? 'bad' : 'ok'}">Flags: ${esc(flagLine(a))}</span></summary>
        <div class="stack qblock"><span class="muted">Active time ${Math.round(active / 60)} min</span>
        <table><tr><th>Subject</th><th>Score</th><th>Right</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Time</th><th>Per question</th></tr>
        ${subs.map((s) => `<tr><td>${cap(s.subject)}</td><td class="mono">${s.score} / ${s.max}</td><td class="mono">${s.right}</td><td class="mono">${s.wrong}</td><td class="mono">${s.skipped}</td><td class="mono">${s.acc == null ? '–' : s.acc + '%'}</td><td class="mono">${mmss(s.secs)}</td><td class="mono">${mmss(s.perQ)}</td></tr>`).join('')}</table>
        ${(a.flags || []).length ? `<span class="lbl">Flag log</span>${a.flags.map((f) => `<div class="mono sm-text">${new Date(f.t).toLocaleTimeString()} · ${FLAG[f.type] ?? esc(f.type)}</div>`).join('')}` : ''}
        <div class="row"><button class="btn sm" data-sheet="${a.test_id}" data-att="${a.id}">Answer sheet</button></div></div></details>`;
    }).join('') || '<p class="muted">No submitted attempts yet.</p>'}</div></div>`;
  $('#stu')?.addEventListener('change', (e) => vResults(e.target.value));
  view.onclick = async (e) => {
    const b = e.target.closest('[data-sheet]'); if (b) go('sheet', { test: b.dataset.sheet, sid: d.sid, attempt: b.dataset.att });
  };
}

// Her answers for one test, question by question
async function vSheet(arg) {
  if (!arg) return go('results');
  view.onclick = (e) => { const b = e.target.closest('[data-att]'); if (b) vSheet({ ...arg, attempt: b.dataset.att }); };
  const r = await rpc('get_result', { p_test: arg.test, p_student: arg.sid, p_attempt: arg.attempt });
  if (r.error) return (view.innerHTML = `<p class="err">${esc(r.error.message)}</p>`);
  const { attempt: a, test, questions: qs, attempts = [] } = r.data, times = a.times || {}, marked = a.marked || [];
  const lbl = { C: ['ok', '✓ Correct'], W: ['bad', '✗ Wrong'], S: ['', '– Skipped'] };
  const slow = [...qs].sort((x, y) => (times[y.id] || 0) - (times[x.id] || 0)).slice(0, 5).filter((q) => times[q.id]);
  view.innerHTML = `<div class="head"><div class="title"><h1>${esc(test.title)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''}</h1><span class="muted">Score ${a.score} · ${a.correct} correct · ${a.wrong} wrong · ${a.skipped} skipped · ${esc(stratName(a.strategy))} · ${when(a.submitted_at)}</span></div></div>
    ${attempts.length > 1 ? `<div class="row tight">${attempts.map((x) => `<button class="tab ${x.id === a.id ? 'on' : ''}" data-att="${x.id}">Attempt ${x.attempt_no} <span class="mono">${x.score}</span></button>`).join('')}</div>` : ''}
    ${slow.length ? `<div class="tray"><span class="lbl">Most time spent</span><div class="card list">${slow.map((q) => `<div class="li"><span class="mono muted">${cap(q.subject.slice(0, 3))} ${qs.filter((x) => x.subject === q.subject).indexOf(q) + 1}</span><span class="grow">${fmt(q.body.slice(0, 80))}</span><span class="chip ${lbl[verdictOf(a.answers[q.id], q.correct)][0]}">${lbl[verdictOf(a.answers[q.id], q.correct)][1]}</span><span class="mono">${mmss(times[q.id])}</span></div>`).join('')}</div></div>` : ''}
    ${SUBJECTS.filter((s) => qs.some((q) => q.subject === s)).map((s) => `<div class="tray"><span class="lbl">${cap(s)}</span><div class="card list">${qs.filter((q) => q.subject === s).map((q, i) => {
      const ch = a.answers[q.id], v = verdictOf(ch, q.correct);
      return `<details class="rv"><summary><span class="chip ${lbl[v][0]}">${lbl[v][1]}</span><span class="mono muted">Q${i + 1}</span><span class="grow">${fmt(q.body.slice(0, 90))}</span><span class="mono muted">${mmss(times[q.id])}${marked.includes(q.id) ? ' · marked' : ''}</span></summary>
        <div class="qblock"><div class="qbody">${fmt(q.body)}</div>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure">` : ''}
        ${q.options.map((o, j) => `<div class="optline ${j === q.correct ? 'right' : ch === j ? 'wrong' : ''}"><span class="key">${'ABCD'[j]}</span><span class="grow">${fmt(o)}</span>${j === q.correct ? '<span>✓ correct</span>' : ch === j ? '<span>✗ her answer</span>' : ''}</div>`).join('')}
        ${q.solution ? `<p class="sol">${fmt(q.solution)}</p>` : ''}</div></details>`; }).join('')}</div></div>`).join('')}`;
}

async function vReport(sid, days = 7) {
  const d = await studentData(sid);
  if (d.error) return (view.innerHTML = `<h1>Report</h1><p class="muted">${esc(d.error)}</p>`);
  const since = Date.now() - days * 864e5;
  const rep = periodReport(d.attempts, d.answers, since);
  const day = (ms) => new Date(ms).toLocaleDateString([], { dateStyle: 'medium' });
  view.innerHTML = `<div class="head"><div class="title"><h1>${days === 7 ? 'Weekly' : days + '-day'} report · ${esc(d.name)}</h1><span class="muted">${day(since)} – ${day(Date.now())}</span></div><span class="grow"></span>${d.picker}
      <select id="days" class="field auto noprint" aria-label="Period">${[7, 14, 30].map((n) => `<option value="${n}" ${n === days ? 'selected' : ''}>Last ${n} days</option>`).join('')}</select>
      <button class="btn dark noprint" id="print">Print / Save as PDF</button></div>
    ${rep.tests ? `<div class="stats">${stat('Tests taken', rep.tests)}${stat('Average', rep.avg + '%')}${stat('Best', rep.best + '%')}${stat('Flags', rep.flags.fullscreen_exit + rep.flags.tab_hidden, `${plural(rep.flags.fullscreen_exit, 'exit')} · ${plural(rep.flags.tab_hidden, 'switch', 'switches')}`)}</div>
      <div class="tray"><span class="lbl">Scores</span><div class="card">${trendSvg(rep.attempts.map((a, i) => ({ label: 'T' + (i + 1), value: pct(a) })), 1000)}</div></div>
      <div class="tray"><span class="lbl">Summary</span><div class="card">${rep.strongest ? `Strongest subject: <b>${cap(rep.strongest.subject)}</b> (${rep.strongest.acc}% accuracy). ` : ''}${rep.weakest && rep.weakest !== rep.strongest ? `Weakest: <b>${cap(rep.weakest.subject)}</b> (${rep.weakest.acc}%). ` : ''}${rep.strategies[0] ? `Best strategy so far: <b>${esc(stratName(rep.strategies[0].strategy))}</b> (${rep.strategies[0].avg}% average).` : ''}</div></div>
      <div class="split"><div class="tray"><span class="lbl">By subject</span><div class="card tbl"><table><tr><th>Subject</th><th>Accuracy</th><th>Per question</th><th>Right</th><th>Wrong</th><th>Skipped</th></tr>
        ${rep.subjects.map((s) => `<tr><td>${cap(s.subject)}</td><td class="mono">${s.acc == null ? '–' : s.acc + '%'}</td><td class="mono">${mmss(s.perQ)}</td><td class="mono">${s.right}</td><td class="mono">${s.wrong}</td><td class="mono">${s.skipped}</td></tr>`).join('')}</table></div></div>
      <div class="tray"><span class="lbl">Weakest chapters</span><div class="card list">${rep.weak.map((c) => `<div class="li"><div class="col"><span>${esc(c.chapter)}</span><span class="muted">${cap(c.subject)}</span></div><span class="num-r">${c.right}/${c.total}</span></div>`).join('') || '<p class="muted li">None yet</p>'}</div></div></div>`
      : '<p class="muted">No tests submitted in this period.</p>'}`;
  $('#stu')?.addEventListener('change', (e) => vReport(e.target.value, days));
  $('#days').onchange = (e) => vReport(d.sid, Number(e.target.value));
  $('#print').onclick = () => window.print();
}

render();
</script>
</body>
</html>
