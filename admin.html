          ${SUBJECTS.map((s, i) => `
          <div class="pickcol" data-s="${s}" ${i ? 'hidden' : ''}><div class="list pick">${qs.filter((x) => x.subject === s && ((!x.hold && x.in_syllabus) || chosen.has(x.id))).map((x) => `
            <label data-t="${esc((x.chapter + ' ' + x.body).toLowerCase())}" data-u="${elsewhere.get(x.id) || 0}"><input type="checkbox" class="q" value="${x.id}" data-s="${s}" ${chosen.has(x.id) ? 'checked' : ''}><span><b>${esc(x.chapter) || '—'}</b> <span class="mono muted" title="difficulty ${esc(bandOf(x.difficulty, cuts))}">${x.difficulty ?? '–'}</span> ${fmt(x.body.slice(0, 120))}${x.body.length > 120 ? '…' : ''}${elsewhere.get(x.id) ? ` <span class="chip">in ${plural(elsewhere.get(x.id), 'test')}</span>` : ''}</span></label>`).join('') || '<span class="muted li">No questions.</span>'}</div></div>`).join('')}
          </div></div>
      </div>
      <aside class="te-side"><div class="tray"><div class="row tray-head"><span class="ttl">Summary</span></div><div class="card stack">
        ${SUBJECTS.map((s) => `<div class="sumrow"><span>${cap(s)}</span><span class="grow"></span><span class="mono"><span class="n-${s}">0</span> / 15</span><span class="mbar"><i class="b-${s}"></i></span></div>`).join('')}
        <div class="sumrow tot"><b>Total</b><span class="grow"></span><span class="mono"><b id="n-all">0</b> / 60</span></div>
        <label class="opt"><input type="checkbox" id="pub" ${t?.published ? 'checked' : ''}> Published</label>
        <p class="muted">She can download it 15 minutes before it opens. OMR minutes come out of the test time at the end: answers lock and she copies them to a paper OMR sheet (0 turns it off).</p>
        <div class="err" id="msg" role="alert"></div>
        <button class="btn dark lg" id="save">Save test</button><button class="btn" id="back">Cancel</button>
      </div></div></aside>
    </div>`;

  const count = () => { let all = 0; SUBJECTS.forEach((s) => { const n = view.querySelectorAll(`.q[data-s=${s}]:checked`).length; all += n;
    view.querySelectorAll(`.n-${s}`).forEach((e) => (e.textContent = n)); const b = view.querySelector(`.b-${s}`); b.style.width = Math.min(100, (n / 15) * 100) + '%'; b.classList.toggle('full', n === 15); }); $('#n-all').textContent = all; };
  view.querySelector('.tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (!b) return;
    view.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b)); view.querySelectorAll('.pickcol').forEach((c) => (c.hidden = c.dataset.s !== b.dataset.tab)); };
  const filter = () => { const f = $('#qf').value.toLowerCase(), h = $('#hide').checked;
    view.querySelectorAll('.pick label').forEach((l) => (l.hidden = (f && !l.dataset.t.includes(f)) || (h && l.dataset.u !== '0' && !l.querySelector('input').checked))); };
  // Plain-language window: when it opens, the latest start that still finishes in time, when it closes
  const winTxt = () => {
    const s = Date.parse($('#start').value), h = Number($('#win').value), d = Number($('#dur').value) || 120, o = Number($('#omr').value) || 0;
    const parts = [o ? `${d - o} min questions + ${o} min OMR.` : `${d} min, no OMR time.`];
    if (h && s) parts.push(h * 60 < d ? `The window must be at least ${d} min.` : `Start by ${when(s + h * 36e5 - d * 6e4)}, closes ${when(s + h * 36e5)}.`);
    else parts.push('She can start any time after it opens.');
    $('#winTxt').textContent = parts.join(' ');
  };
  view.onchange = () => { count(); filter(); winTxt(); };
  view.oninput = (e) => { if (e.target.id === 'qf') filter(); else winTxt(); };
  count(); winTxt();
  // chapter mix: start from what the test already has, else an even split
  const meta = new Map(qs.map((x) => [x.id, x])), cn = (s, c) => view.querySelector(`.cn[data-s="${s}"][data-c="${CSS.escape(c)}"]`) ?? [...view.querySelectorAll(`.cn[data-s=${s}]`)].find((i) => i.dataset.c === c);
  const mixSum = (s) => [...view.querySelectorAll(`.cn[data-s=${s}]`)].reduce((a, i) => a + (Number(i.value) || 0), 0);
  const showMix = () => SUBJECTS.forEach((s) => { const n = mixSum(s), e = $('#cm-' + s); e.textContent = `${n} / 15`; e.classList.toggle('err', n !== 15); });
  const evenMix = () => SUBJECTS.forEach((s) => { const l = [...CHAPTERS[s]].sort(() => Math.random() - 0.5), base = Math.floor(15 / l.length), extra = 15 % l.length;
    l.forEach((c, i) => { const el = [...view.querySelectorAll(`.cn[data-s=${s}]`)].find((x) => x.dataset.c === c); el.value = base + (i < extra ? 1 : 0); }); });
  if (chosen.size) [...chosen].forEach((id) => { const q = meta.get(id), el = q && [...view.querySelectorAll(`.cn[data-s=${q.subject}]`)].find((x) => x.dataset.c === q.chapter); if (el) el.value = Number(el.value) + 1; });
  else evenMix();
  showMix();
  view.addEventListener('input', (e) => { if (e.target.classList?.contains('cn')) showMix(); });
  $('#even').onclick = () => { evenMix(); showMix(); };
  $('#auto').onclick = () => {
    const bad = SUBJECTS.filter((s) => mixSum(s) !== 15);
    if (bad.length) return toast(`Chapter numbers must add up to 15 for ${bad.map(cap).join(', ')}.`);
    const target = $('#bd').value, rnd = () => Math.random() - 0.5, lacks = [];
    let reused = 0, off = 0;
    SUBJECTS.forEach((s) => {
      const boxes = [...view.querySelectorAll(`.q[data-s=${s}]`)];
      boxes.forEach((b) => (b.checked = false));
      [...view.querySelectorAll(`.cn[data-s=${s}]`)].forEach((inp) => {
        let need = Number(inp.value) || 0; if (!need) return;
        const pool = boxes.filter((b) => meta.get(b.value).chapter === inp.dataset.c && meta.get(b.value).in_syllabus && !meta.get(b.value).hold)
          .map((b) => { const q = meta.get(b.value), miss = target && bandOf(q.difficulty, cuts) !== target ? 1 : 0; return { b, miss, used: elsewhere.get(b.value) || 0, r: Math.random() }; })
          .sort((x, y) => x.miss - y.miss || (x.used > 0) - (y.used > 0) || x.r - y.r);
        const take = pool.slice(0, need); take.forEach((o) => { o.b.checked = true; reused += o.used ? 1 : 0; off += o.miss; });
        if (take.length < need) lacks.push(`${inp.dataset.c} ${need - take.length} short`);
      });
    });
    count(); filter();
    toast(`Picked.${off ? ` ${off} are outside the ${target} band (too few in the bank).` : ''}${reused ? ` ${reused} already used in other tests.` : ''}${lacks.length ? ` Short: ${lacks.join(', ')}.` : ''}`);
  };
  if (attempts) view.querySelectorAll('.q, #neg, #fill, #auto, #even, .cn, #bd').forEach((x) => (x.disabled = true));
  $('#fill').onclick = () => {
    const short = [];
    SUBJECTS.forEach((s) => {
      const boxes = [...view.querySelectorAll(`.q[data-s=${s}]`)];
      let need = 15 - boxes.filter((b) => b.checked).length;
      const pool = boxes.filter((b) => !b.checked && !elsewhere.has(b.value)).sort(() => Math.random() - 0.5);
      while (need > 0 && pool.length) { pool.pop().checked = true; need--; }
      if (need > 0) short.push(`${cap(s)} needs ${need} more`);
    });
    count(); filter();
    toast(short.length ? `Not enough unused questions: ${short.join(', ')}` : 'Filled with unused questions');
  };
  $('#back').onclick = () => go('tests');
  $('#save').onclick = async () => {
    const msg = $('#msg');
    if (!$('#title').value.trim() || !$('#start').value) return (msg.textContent = 'Title and opening time are needed.');
    const strategies = [...view.querySelectorAll('.st:checked')].map((x) => x.value);
    if (!strategies.length) return (msg.textContent = 'Allow at least one strategy.');
    const start = new Date($('#start').value), dur = Number($('#dur').value) || 120, win = Number($('#win').value) || 0, omr = Math.round(Number($('#omr').value) || 0);
    if (win && win * 60 < dur) return (msg.textContent = `The window must be at least as long as the test (${dur} min).`);
    if (omr < 0 || omr > Math.min(60, dur / 2)) return (msg.textContent = 'OMR minutes must be between 0 and half the test time (60 at most).');
    $('#save').disabled = true;
    const row = { title: $('#title').value.trim(), start_at: start.toISOString(), duration_min: dur, neg_marks: Number($('#neg').value), cheat_flags: $('#cheat').checked, published: $('#pub').checked, strategies,
      max_attempts: Math.min(10, Math.max(1, Number($('#att').value) || 3)), omr_min: omr, end_at: win ? new Date(+start + win * 36e5).toISOString() : null };
    const r = t ? await sb.from('tests').update(row).eq('id', t.id).select('id').single() : await sb.from('tests').insert(row).select('id').single();
    if (r.error) { $('#save').disabled = false; return (msg.textContent = r.error.message); }
    if (!attempts) {
      let pos = 0; const rows = [];
      SUBJECTS.forEach((s) => view.querySelectorAll(`.q[data-s=${s}]:checked`).forEach((x) => rows.push({ test_id: r.data.id, question_id: x.value, position: ++pos })));
      // write the new list first, then drop unticked ones, so a failure never leaves the test empty
      if (rows.length) { const up = await sb.from('test_questions').upsert(rows); if (up.error) { $('#save').disabled = false; return (msg.textContent = up.error.message); } }
      const keep = new Set(rows.map((x) => x.question_id)), gone = [...chosen].filter((id) => !keep.has(id));
      for (let i = 0; i < gone.length; i += 100) {
        const d = await sb.from('test_questions').delete().eq('test_id', r.data.id).in('question_id', gone.slice(i, i + 100));
        if (d.error) { $('#save').disabled = false; return (msg.textContent = d.error.message); }
      }
    }
    toast('Test saved');
    go('preview', r.data.id);
  };
}

/* ---------- Results and report ---------- */

async function studentData(sid) {
  const { data: studs } = await sb.from('profiles').select('id,name').eq('role', 'student').eq('is_test', false);
  if (!studs?.length) return { error: 'No student account yet.' };
  sid ??= studs[0].id;
  const r = await sb.rpc('get_progress', { p_student: sid });
  if (r.error) return { error: r.error.message };
  return { sid, name: studs.find((s) => s.id === sid).name, ...r.data };
}

async function vResults(sid) {
  const d = await studentData(sid);
  if (d.error) return (view.innerHTML = `<h1>Results</h1><p class="muted">${esc(d.error)}</p>`);
  const { data: ts } = await sb.from('tests').select('*');
  const met = await metricsOf((q) => q.eq('student_id', d.sid));
  const testOf = (id) => ts?.find((t) => t.id === id) ?? {};
  view.innerHTML = `<div class="head"><div class="title"><h1>Results</h1><span class="muted desc">Every submitted attempt. Open one for subject scores and flags.</span></div></div>
    <section class="sec"><div class="sec-h"><h2>${plural(d.attempts.length, 'attempt')}</h2></div><div class="sep">${[...d.attempts].reverse().map((a) => {
      const rows = d.answers.filter((r) => r.attempt_id === a.id), neg = +(testOf(a.test_id).neg_marks ?? 1);
      const subs = subjectStats(rows, [a]).filter((s) => s.total).map((s) => ({ ...s, score: rows.filter((r) => r.subject === s.subject && r.chosen === r.correct).reduce((n, r) => n + r.marks, 0) - s.wrong * neg, max: rows.filter((r) => r.subject === s.subject).reduce((n, r) => n + r.marks, 0) }));
      const active = Object.values(a.times || {}).reduce((x, y) => x + y, 0);
      const prev = d.attempts.find((x) => x.test_id === a.test_id && x.attempt_no === a.attempt_no - 1);
      const dd = prev ? pct(a) - pct(prev) : 0;
      return `<details class="rv"><summary class="rs rrow"><span class="col"><span class="t1">${esc(a.title)}</span><span class="muted">${when(a.submitted_at)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''} · ${esc(stratName(a.strategy))}</span>
          ${openFlags(a) ? `<span class="flagtxt">! ${esc(flagLine(a))}</span>` : (a.flags || []).length ? '<span class="muted">Flags ignored</span>' : ''}</span>
        <span class="col r"><span class="pc">${pct(a)}%</span><span class="muted mono">${a.score}/${a.max}${dd ? ` · <span class="${dd > 0 ? 'up' : 'down'}">${dd > 0 ? '+' : '−'}${Math.abs(dd)}</span>` : ''}</span></span>${(() => { const m = met.get(a.id); return m ? `<span class="mx muted">Difficulty ${Math.round(m.paper_difficulty)} · Rating ${Math.round(m.rating)} ${chg(m.rating_change)}</span>` : ''; })()}</summary>
        <div class="stack qblock"><span class="muted">Active time ${Math.round(active / 60)} min</span>
        <table><tr><th>Subject</th><th>Score</th><th>Right</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Time</th><th>Per question</th></tr>
        ${subs.map((s) => `<tr><td>${cap(s.subject)}</td><td class="mono">${s.score} / ${s.max}</td><td class="mono">${s.right}</td><td class="mono">${s.wrong}</td><td class="mono">${s.skipped}</td><td class="mono">${s.acc == null ? '–' : s.acc + '%'}</td><td class="mono">${mmss(s.secs)}</td><td class="mono">${mmss(s.perQ)}</td></tr>`).join('')}</table>
        ${(a.flags || []).length ? `<span class="lbl">Flag log</span>${a.flags.map((f) => `<div class="mono sm-text">${new Date(f.t).toLocaleTimeString()} · ${FLAG[f.type] ?? esc(f.type)}</div>`).join('')}` : ''}
        <div class="row"><button class="btn sm" data-sheet="${a.test_id}" data-att="${a.id}">Answer sheet</button></div></div></details>`;
    }).join('') || '<p class="muted">No submitted attempts yet.</p>'}</div></section>`;
  view.onclick = async (e) => {
    const b = e.target.closest('[data-sheet]'); if (b) go('sheet', { test: b.dataset.sheet, sid: d.sid, attempt: b.dataset.att });
  };
}

// Her answers for one test, question by question
async function vSheet(arg) {
  if (!arg) return go('results');
  view.onchange = (e) => { if (e.target.id === 'attsel') vSheet({ ...arg, attempt: e.target.value }); };
  const r = await rpc('get_result', { p_test: arg.test, p_student: arg.sid, p_attempt: arg.attempt });
  if (r.error) return (view.innerHTML = `<p class="err">${esc(r.error.message)}</p>`);
  const m = (await sb.from('attempt_metrics').select('*').eq('attempt_id', r.data.attempt.id).maybeSingle()).data;
  const { attempt: a, test, questions: qs, attempts = [] } = r.data, times = a.times || {}, marked = a.marked || [];
  const lbl = { C: ['ok', '✓ Correct'], W: ['bad', '✗ Wrong'], S: ['', '– Skipped'] };
  const slow = [...qs].sort((x, y) => (times[y.id] || 0) - (times[x.id] || 0)).slice(0, 5).filter((q) => times[q.id]);
  view.innerHTML = `<div class="head"><div class="title"><h1>${esc(test.title)}${a.attempt_no ? ` · attempt ${a.attempt_no}` : ''}</h1><span class="muted">Score ${a.score} · ${a.correct} correct · ${a.wrong} wrong · ${a.skipped} skipped · ${esc(stratName(a.strategy))} · ${when(a.submitted_at)}</span></div></div>
    <div class="sheetgrid"><div class="bento">
      <div class="card bc"><span class="k">Marks</span><span class="v">${a.score}<small> / 240</small>${chg(m?.score_change)}</span></div>
      <div class="card bc"><span class="k">Paper difficulty</span><span class="v">${m ? Math.round(m.paper_difficulty) : '–'}</span>${m ? `<span class="muted">${diffLabel(m.paper_difficulty)}</span>` : ''}</div>
      <div class="card bc"><span class="k">Rating</span><span class="v">${m ? Math.round(m.rating) : '–'}${chg(m?.rating_change)}</span></div>
      <div class="card bc"><span class="k">Correct / Wrong / Skipped</span><span class="v cws"><span class="up">${a.correct}</span><span class="down">${a.wrong}</span><span>${a.skipped}</span></span></div>
    </div><div id="omrph"></div></div>
    ${attempts.length > 1 ? `<label class="row tight attpick"><span class="muted">Attempt</span><select id="attsel" class="field auto">${attempts.map((x) => `<option value="${x.id}" ${x.id === a.id ? 'selected' : ''}>Attempt ${x.attempt_no} · ${x.score}</option>`).join('')}</select></label>` : ''}
    ${slow.length ? `<div class="tray"><span class="lbl">Most time spent</span><div class="card list">${slow.map((q) => `<div class="li"><span class="mono muted">${cap(q.subject.slice(0, 3))} ${qs.filter((x) => x.subject === q.subject).indexOf(q) + 1}</span><span class="grow">${fmt(q.body.slice(0, 80))}</span><span class="chip ${lbl[verdictOf(a.answers[q.id], q.correct)][0]}">${lbl[verdictOf(a.answers[q.id], q.correct)][1]}</span><span class="mono">${mmss(times[q.id])}</span></div>`).join('')}</div></div>` : ''}
    ${SUBJECTS.filter((s) => qs.some((q) => q.subject === s)).map((s) => `<div class="tray"><span class="lbl">${cap(s)}</span><div class="card list">${qs.filter((q) => q.subject === s).map((q, i) => {
      const ch = a.answers[q.id], v = verdictOf(ch, q.correct);
      return `<details class="rv"><summary><span class="chip ${lbl[v][0]}">${lbl[v][1]}</span><span class="mono muted">Q${i + 1}</span><span class="grow">${fmt(q.body.slice(0, 90))}</span><span class="mono muted">${mmss(times[q.id])}${marked.includes(q.id) ? ' · marked' : ''}</span></summary>
        <div class="qblock"><div class="qbody">${fmt(q.body)}</div>${q.image_url ? `<img class="qimg" src="${esc(q.image_url)}" alt="Figure">` : ''}
        ${q.options.map((o, j) => `<div class="optline ${j === q.correct ? 'right' : ch === j ? 'wrong' : ''}"><span class="key">${'ABCD'[j]}</span><span class="grow">${fmt(o)}</span>${j === q.correct ? '<span>✓ correct</span>' : ch === j ? '<span>✗ her answer</span>' : ''}</div>`).join('')}
        ${q.solution ? `<p class="sol">${fmt(q.solution)}</p>` : ''}</div></details>`; }).join('')}</div></div>`).join('')}`;
  sb.storage.from('omr-photos').createSignedUrl(`${arg.sid}/${a.id}.jpg`, 600).then(({ data }) => { if (!data?.signedUrl) $('.sheetgrid')?.classList.add('solo'); if (data?.signedUrl && $('#omrph')) $('#omrph').innerHTML = `<div class="tray"><span class="lbl">Her OMR sheet photo</span><div class="card"><a href="${data.signedUrl}" target="_blank" rel="noopener"><img class="qimg" style="max-height:24rem" src="${data.signedUrl}" alt="OMR sheet photo"></a></div></div>`; });
}

async function vReport(sid, days = 7) { // days: 7 | 14 | 30 | 'all'
  const d = await studentData(sid);
  if (d.error) return (view.innerHTML = `<h1>Report</h1><p class="muted">${esc(d.error)}</p>`);
  const since = days === 'all' ? 0 : Date.now() - days * 864e5, from = days === 'all' ? (d.attempts[0] ? Date.parse(d.attempts[0].submitted_at) : Date.now()) : since;
  const rep = periodReport(d.attempts, d.answers, since);
  const day = (ms) => new Date(ms).toLocaleDateString([], { dateStyle: 'medium' });
  view.innerHTML = `<div class="head"><div class="title"><h1>${days === 7 ? 'Weekly' : days === 'all' ? 'All-time' : days + '-day'} report</h1><span class="muted">${day(from)} – ${day(Date.now())}</span></div></div>
    <div class="row noprint repbar"><div class="pseg" id="days" role="group" aria-label="Period">${[[7, '7 days'], [14, '14 days'], [30, '30 days'], ['all', 'All']].map(([n, l]) => `<button class="${n === days ? 'on' : ''}" data-d="${n}" aria-pressed="${n === days}">${l}</button>`).join('')}</div><span class="grow"></span><button class="btn dark" id="print">Print / PDF</button></div>
    ${rep.tests ? `<div class="stats">${stat('Tests taken', rep.tests)}${stat('Average', rep.avg + '%')}${stat('Best', rep.best + '%')}${stat('Flags', rep.flags.fullscreen_exit + rep.flags.tab_hidden, `${plural(rep.flags.fullscreen_exit, 'exit')} · ${plural(rep.flags.tab_hidden, 'switch', 'switches')}`)}</div>
      <div class="tray"><span class="lbl">Scores</span><div class="card">${areaSvg(rep.attempts.slice(-8).map((a) => ({ label: new Date(a.submitted_at).toLocaleDateString([], { day: 'numeric', month: 'short' }), value: pct(a) })), Math.max(300, Math.min(900, view.clientWidth - 40)))}</div></div>
      <div class="tray"><span class="lbl">Summary</span><div class="card"><ul class="bul">${rep.strongest ? `<li>Strongest: <b>${cap(rep.strongest.subject)}</b> · ${rep.strongest.acc}% accuracy</li>` : ''}${rep.weakest && rep.weakest !== rep.strongest ? `<li>Weakest: <b>${cap(rep.weakest.subject)}</b> · ${rep.weakest.acc}% accuracy</li>` : ''}${rep.strategies[0] ? `<li>Best strategy: <b>${esc(stratName(rep.strategies[0].strategy))}</b> · ${rep.strategies[0].avg}% average</li>` : ''}</ul></div></div>
      <div class="split"><div class="tray"><span class="lbl">By subject</span><div class="sep">${rep.subjects.map((s) => `<div class="subj"><b>${cap(s.subject)}</b><span class="muted skp">${s.skipped} skipped</span>
          <div><span class="k">Accuracy</span><span class="mono">${s.acc == null ? '–' : s.acc + '%'}</span></div><div><span class="k">Per question</span><span class="mono">${mmss(s.perQ)}</span></div>
          <div><span class="k">Right</span><span class="mono">${s.right}</span></div><div><span class="k">Wrong</span><span class="mono">${s.wrong}</span></div></div>`).join('')}</div></div>
      <div class="tray"><span class="lbl">Weakest chapters</span><div class="card list">${rep.weak.map((c) => `<div class="li"><div class="col"><span>${esc(c.chapter)}</span><span class="muted">${cap(c.subject)}</span></div><span class="num-r">${c.right}/${c.total}</span></div>`).join('') || '<p class="muted li">None yet</p>'}</div></div></div>`
      : '<p class="muted">No tests submitted in this period.</p>'}`;
  $('#days').onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) vReport(d.sid, b.dataset.d === 'all' ? 'all' : Number(b.dataset.d)); };
  $('#print').onclick = () => window.print();
}

render();
