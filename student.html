<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1E4ED8">
<title>Mock Tests</title>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
</head>
<body class="stu">
<div id="app" class="shell"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="rotate" role="alert"><div class="card stack"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="17" width="38" height="24" rx="3"/><path d="M14 10a14 12 0 0 1 20 0"/><path d="M30 6l4 4-5 2"/></svg><b>Turn the tablet sideways</b><span class="muted">The tests work in landscape only.</span></div></div>
<dialog id="dlg"><form method="dialog" class="stack"><div id="dlgText"></div>
  <div class="row"><button class="btn" value="no">Go back</button><button class="btn dark" value="yes" id="dlgOk">OK</button></div></form></dialog>
<script type="module">
import { sb, rpc, currentUser, logout } from './shared.js';
import { SUBJECTS, STRATEGIES, STATE, KIND, qStatus, stateCounts, attemptKind, guessValue, stratName, esc, fmt, cap, when, stat, phaseOf, pct, verdictOf, chapterStats, strategyStats, subjectStats, mistakes, trendSvg, mmss, plural, windowOf, boxSubject, omrColumns } from './util.js';

const $ = (s) => document.querySelector(s);
const app = $('#app');
const hms = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, '0')).join(':'); };
const clockTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage full */ } };

const EXAM = 'exam.active';
let S = read(EXAM); // active exam, kept on the tablet so a crash or restart resumes it
let tick = 0, ticks = 0, wl = null, startTimer = 0, toastT = 0, armed = false, cw = null;

// Text size: A− / A+ scale the root font size, and every size in style.css is in rem, so boxes, gaps, palette and pictures grow with the text
const baseSize = () => (innerWidth >= 2400 ? 24 : innerWidth >= 1800 ? 20 : 16);
const setSize = (z) => { z = Math.min(1.5, Math.max(0.8, Math.round(z * 10) / 10)); write('ui.size', z); document.documentElement.style.fontSize = baseSize() * z + 'px'; return z; };
let size = setSize(read('ui.size') ?? 1);
addEventListener('resize', () => setSize(size));
const sizeCtl = () => `<span class="row tight" role="group" aria-label="Text size"><button class="btn sm" data-a="size" data-d="-1" aria-label="Smaller text">A−</button><button class="btn sm" data-a="size" data-d="1" aria-label="Larger text">A+</button></span>`;
const persist = () => write(EXAM, S);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 6000);
}
// html: trusted markup built here; text otherwise
const ask = (text, ok = 'Confirm', html = '') => new Promise((res) => {
  if (html) $('#dlgText').innerHTML = html; else $('#dlgText').textContent = text;
  $('#dlgOk').textContent = ok;
  const d = $('#dlg'); d.returnValue = ''; d.onclose = () => res(d.returnValue === 'yes'); d.showModal();
});
const isFull = () => !!document.fullscreenElement || matchMedia('(display-mode: fullscreen)').matches;
const landscape = () => screen.orientation?.lock?.('landscape').catch(() => {}); // works in fullscreen; the rotate notice covers the rest
async function fullscreen() { try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch { /* installed app is already fullscreen */ } landscape(); }

/* ================= Routing: every screen has its own address, so the tablet's back button and the Back buttons go one screen back ================= */
const PARENT = { start: 'tests', result: 'tests', progress: 'tests', mistakes: 'tests', practice: 'mistakes' };
let depth = 0; // screens opened in this session; with none left, Back goes to the parent screen instead of leaving the app
const here = () => location.hash.slice(1).split('/');
function go(hash, replace = false) {
  if (replace) history.replaceState(null, '', '#' + hash); else { history.pushState(null, '', '#' + hash); depth++; }
  route();
}
function back() {
  if (depth > 0) { depth--; history.back(); } else go(PARENT[here()[0]] ?? 'tests', true);
}
addEventListener('popstate', () => {
  if (S) return holdExam();
  depth = Math.max(0, depth - 1);
  route();
});
async function route() {
  if (S) return;
  clearInterval(startTimer);
  const [v, a, b] = here();
  if (v === 'start' && a) return openTest(a);
  if (v === 'result' && a) { const r = await rpc('get_result', { p_test: a, ...(b ? { p_attempt: b } : {}) }); return r.data ? showResult(r.data) : (toast(r.error?.message ?? 'Could not load'), go('tests', true)); }
  if (v === 'progress') return progress();
  if (v === 'mistakes') return notebook();
  if (v === 'practice') return P ? drawPractice() : go('mistakes', true);
  home();
}
const backBtn = () => `<button class="btn sm back" data-a="back" aria-label="Back">‹ Back</button>`;
const netPill = () => `<span class="pill net ${navigator.onLine ? 'on' : ''}">${navigator.onLine ? 'ONLINE' : 'OFFLINE'}</span>`;
const nav = (on) => `<div class="top">${on === 'home' ? '' : backBtn()}<span class="brand">Mock Tests</span>${[['home', 'Tests'], ['progress', 'Progress'], ['notebook', 'Mistakes']].map(([a, n]) => `<button class="tab ${on === a ? 'on' : ''}" data-a="${a}"${on === a ? ' aria-current="page"' : ''}>${n}</button>`).join('')}<span class="grow"></span>${netPill()}${sizeCtl()}<button class="btn sm" data-a="out">Sign out</button></div>`;

/* ================= Home ================= */
async function home() {
  document.body.classList.remove('exam');
  const me = await currentUser();
  if (!me) { location.href = 'index.html'; return; }
  const [t, a] = await Promise.all([
    sb.from('tests').select('*').eq('published', true).order('start_at'),
    sb.rpc('get_progress'),
  ]);
  const saved = Object.keys(localStorage).filter((k) => k.startsWith('paper.')).map((k) => read(k).test);
  const tests = t.error ? saved : t.data;
  const doneOf = (id) => (a.data?.attempts ?? []).filter((x) => x.test_id === id);
  app.innerHTML = `<div class="frame">${nav('home')}
    <div class="page"><h1>Your tests</h1><div class="tray"><span class="lbl">${plural(tests.length, 'test')}</span>
    <div class="card list">${tests.map((x) => {
      const d = doneOf(x.id), w = windowOf(x, Date.now()), open = Date.now() >= w.start - 15 * 60000, left = (x.max_attempts ?? 1) - d.length;
      const go = !left ? '' : w.closed ? '<span class="chip">Window closed</span>' : open || read('paper.' + x.id) ? `<button class="btn dark" data-a="open" data-id="${x.id}">${d.length ? `Retake · ${left} left` : 'Open'}</button>`
        : `<span class="muted">Opens ${when(w.start)}</span>`;
      return `<div class="li"><div class="col"><b>${esc(x.title)}</b>
        <span class="muted mono">${when(w.start)} · ${x.duration_min} min${w.lastStart ? ` · start by ${when(w.lastStart)}` : ''}${d.length ? ` · ${plural(d.length, 'attempt')}` : ''}</span></div>
        ${d.length ? `<span class="chip ok">${d.length > 1 ? `Best ${Math.max(...d.map((z) => z.score))} · Last ` : ''}${d.at(-1).score} / ${d.at(-1).max}</span><button class="btn" data-a="result" data-id="${x.id}">Result</button>` : ''}${go}</div>`;
    }).join('') || '<p class="muted li">No tests yet.</p>'}</div></div></div></div>`;
}

app.addEventListener('click', async (e) => {
  if (S) armBack();
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'size') { size = setSize(size + 0.1 * b.dataset.d); return; }
  if (S && actions[a]) return inOmr() && !OMR_OK.includes(a) ? undefined : actions[a](b.dataset);
  if (a === 'out') { if (await ask(navigator.onLine ? 'Sign out of this tablet?' : 'You are offline. Once signed out, you can sign in again only with internet. Sign out?', 'Sign out')) logout(); }
  else if (a === 'back') back();
  else if (a === 'open') go('start/' + b.dataset.id);
  else if (a === 'result') go(`result/${b.dataset.id}`);
  else if (a === 'att') go(`result/${b.dataset.id}/${b.dataset.att}`, true);
  else if (a === 'home') go('tests');
  else if (a === 'progress') go('progress');
  else if (a === 'notebook') go('mistakes');
  else if (a === 'nbf') notebook(b.dataset.s, PROG);
  else if (a === 'practice') { startPractice(NB); go('practice'); }
  else if (a === 'rpractice') { startPractice(RQ); go('practice'); }
  else if (a === 'rf') reviewFilter(b.dataset.f);
  else if (a === 'ppick') ppick(+b.dataset.i);
  else if (a === 'pnext') { P.i++; P.picked = null; drawPractice(); }
  else if (['strat', 'up', 'down', 'go'].includes(a)) startScreen.handle?.(a, b.dataset);
});

/* ================= Download + start screen ================= */
async function openTest(id) {
  let paper = read('paper.' + id);
  const r = await sb.rpc('get_paper', { p_test: id });
  if (r.data) {
    paper = { ...r.data, offset: Date.parse(r.data.now) - Date.now() }; // offset = server clock minus tablet clock
    write('paper.' + id, paper);
    await Promise.all(paper.questions.filter((q) => q.image_url).map((q) => fetch(q.image_url).catch(() => {}))); // lets the service worker cache images
  } else if (!paper) { toast(r.error?.message ?? 'Could not download the paper'); return go('tests', true); }
  startScreen(paper);
}

// OMR minutes, never more than half the paper
const omrMin = (t) => Math.min(Math.floor(t.duration_min / 2), Math.max(0, t.omr_min ?? 0));

function startScreen(paper) {
  document.body.classList.remove('exam');
  const t = paper.test;
  let pick = t.strategies.includes('timebox') ? 'timebox' : t.strategies[0], pinned = false;
  const has = SUBJECTS.filter((s) => paper.questions.some((q) => q.subject === s)); // drills may cover fewer subjects
  const saved = (read('ui.order') ?? []).filter((s) => has.includes(s));
  const order = [...saved, ...has.filter((s) => !saved.includes(s))]; // her last chosen order
  const marks = [...new Set(paper.questions.map((q) => q.marks))].join('/');
  const omr = omrMin(t), w = () => windowOf(t, Date.now() + paper.offset);
  const draw = () => {
    app.innerHTML = `<div class="frame"><div class="top">${backBtn()}<span class="brand">${esc(t.title)}</span><span class="grow"></span>${netPill()}${sizeCtl()}</div>
      <div class="page"><div class="cols3">
      <div class="tray"><span class="lbl">1 · Strategy</span>
        <div class="card flush">${t.strategies.map((k) => `<button class="strat ${k === pick ? 'on' : ''}" data-a="strat" data-k="${k}" aria-pressed="${k === pick}"><span class="dot"></span>
          <span class="txt"><b>${STRATEGIES[k][0]}</b><span class="muted">${STRATEGIES[k][1]}</span></span></button>`).join('')}</div></div>
      <div class="stack">
        ${order.length > 1 ? `<div class="tray"><span class="lbl">2 · Which subject first?</span><div class="card list">${order.map((s, i) => `<div class="li"><span class="mono muted">${i + 1}</span><span class="grow">${cap(s)}</span>
          <button class="btn sm" data-a="up" data-i="${i}" aria-label="Move ${s} up" ${i ? '' : 'disabled'}>↑</button><button class="btn sm" data-a="down" data-i="${i}" aria-label="Move ${s} down" ${i < order.length - 1 ? '' : 'disabled'}>↓</button></div>`).join('')}</div></div>` : ''}
        <div class="tray"><span class="lbl">How it works</span><div class="card stack tight sm-text rules">
          <div>Tap an option to answer. <b>Clear</b> removes it. <b>Mark for review &amp; next</b> flags it to come back to; a marked answer still counts.</div>
          <div>Done with a subject early? Tap <b>Finish subject</b> or <b>Next</b> on the right.</div>
          <div>Correct +${marks}, wrong −${t.neg_marks}, skipped 0. ${guessTip(+String(marks).split('/')[0], +t.neg_marks)}</div>
          ${omr ? `<div><b>Last ${omr} min: OMR.</b> Answers lock and you copy them to the paper OMR sheet. Keep the sheet and a black pen ready.</div>` : ''}</div></div></div>
      <div class="stack"><div class="dark-card"><span class="pill ondark">${when(t.start_at)}</span>
        <div class="t">${esc(t.title)}</div>
        <div class="sub">${paper.questions.length} questions · ${t.duration_min} min${omr ? ` (${t.duration_min - omr} + ${omr} min OMR)` : ''}<br>Marking +${marks} / −${t.neg_marks}${t.max_attempts ? `<br>Attempt ${Math.min((t.attempts_used ?? 0) + 1, t.max_attempts)} of ${t.max_attempts}` : ''}${w().lastStart ? `<br>Start by ${clockTime(w().lastStart)}` : ''}</div>
        <div class="cd" id="cd" aria-live="polite"></div></div>
        <div class="tray"><span class="lbl">Before you start</span><div class="card stack tight sm-text">
          <div>✓ Paper downloaded</div><div id="bat">Battery: checking…</div>
          <div id="air">${airText()}</div>
          <label class="opt"><input type="checkbox" id="pin" ${pinned ? 'checked' : ''}> Screen pinning is on</label></div></div>
        <button class="btn dark lg" data-a="go" id="go" disabled>Start test</button></div></div></div></div>`;
    tickStart();
    navigator.getBattery?.().then((b) => { const el = $('#bat'); if (el) el.textContent = `${b.level >= 0.5 ? '✓' : '!'} Battery ${Math.round(b.level * 100)}%`; });
  };
  const tickStart = () => {
    const now = Date.now() + paper.offset, x = w(), cd = $('#cd'), go = $('#go');
    const spent = t.max_attempts && (t.attempts_used ?? 0) >= t.max_attempts;
    if (cd) cd.textContent = spent ? 'All attempts used' : x.closed ? 'Window closed' : now < x.start ? 'Opens in ' + hms(x.start - now) : x.lastStart ? `Ready · ${hms(Math.max(0, x.lastStart - now))} left to start` : 'Ready';
    const ok = now >= x.start && !x.closed && paper.questions.length && !spent;
    if (go) { go.disabled = !ok || !pinned; go.textContent = ok && !pinned ? 'Tick “Screen pinning is on” first' : 'Start test'; }
  };
  app.onchange = (e) => { if (e.target.id === 'pin') { pinned = e.target.checked; tickStart(); } };
  startScreen.handle = async (a, d) => {
    if (a === 'strat') { pick = d.k; draw(); }
    else if (a === 'up' || a === 'down') { const i = +d.i, j = a === 'up' ? i - 1 : i + 1; [order[i], order[j]] = [order[j], order[i]]; write('ui.order', order); draw(); }
    else if (a === 'go') begin(paper, pick, order);
  };
  clearInterval(startTimer); startTimer = setInterval(tickStart, 1000);
  draw();
}

async function begin(paper, strategy, order) {
  await fullscreen();
  clearInterval(startTimer);
  const t = paper.test;
  let startedAt = Date.now() + paper.offset, attemptId = crypto.randomUUID(); // id made here so an offline start uploads as the same attempt
  const r = await rpc('start_attempt', { p_test: t.id, p_strategy: strategy, p_id: attemptId });
  if (r.error?.code) { toast(r.error.message); return startScreen(paper); } // a server rule said no
  if (r.data?.submitted_at) return go(`result/${t.id}`, true);
  if (r.data?.id) attemptId = r.data.id; // an unfinished attempt on the server continues
  if (r.data?.started_at) startedAt = Date.parse(r.data.started_at); // offline start falls back to the tablet clock
  const first = (s) => paper.questions.find((q) => q.subject === s);
  S = { testId: t.id, attemptId, title: t.title, strategy, order, startedAt, offset: paper.offset, durationMs: t.duration_min * 60000, omrMs: omrMin(t) * 60000,
        neg: t.neg_marks, cheat: t.cheat_flags, qs: paper.questions, answers: {}, marked: [], visited: [], times: {}, flags: [], done: [], copied: [],
        cur: first(order[0]).id, subjIdx: 0, alerts: [], lastIdx: -1, pending: false };
  S.visited.push(S.cur); persist();
  app.onchange = null;
  history.replaceState(null, '', '#exam');
  startEngine();
}

// What a guess is worth with this marking, so she knows when to attempt
function guessTip(m, n) {
  const g4 = guessValue(4, m, n), g3 = guessValue(3, m, n), g2 = guessValue(2, m, n);
  if (g4 > 0) return `A blind guess is worth ${g4} on average; after ruling out one option, ${g3}.`;
  if (g3 > 0) return `Do not guess blindly. After ruling out one option a guess is worth ${g3}.`;
  return g2 > 0 ? `Guess only when you are down to two options (worth ${g2}).` : 'Do not guess.';
}

/* ================= Exam engine ================= */
const now = () => Date.now() + S.offset;
const elapsed = () => now() - S.startedAt;
const qMs = () => S.durationMs - S.omrMs; // time for questions; the OMR block follows inside the same total
const inOmr = () => S.omrMs > 0 && (S.omrNow || elapsed() >= qMs());
const phase = () => phaseOf(S.strategy, elapsed(), qMs(), S.order);
const bySubj = (s) => S.qs.filter((q) => q.subject === s);
const qOf = (id) => S.qs.find((q) => q.id === id);
const no = (q) => S.qs.indexOf(q) + 1; // paper number, the same as on the OMR sheet whatever order she picked
const box = () => boxSubject(phase().lock, S.order, S.done);
function allowed() {
  if (S.strategy === 'subject') return [S.order[S.subjIdx]];
  if (S.strategy === 'timebox') { const b = box(); return b ? [b] : S.order; }
  return S.order;
}
// Where "Next" goes. lock: 'final' = cannot come back, 'box' = back only in review time, '' = free
function nextOf() {
  const cur = qOf(S.cur).subject;
  if (S.strategy === 'subject') { const n = S.order[S.subjIdx + 1]; return n ? { from: cur, to: n, lock: 'final' } : null; }
  if (S.strategy === 'timebox') { const b = box(); if (!b) return null; const n = S.order.slice(S.order.indexOf(b) + 1).find((s) => !S.done.includes(s)); return { from: b, to: n ?? null, lock: 'box' }; }
  const n = S.order[S.order.indexOf(cur) + 1];
  return n ? { from: cur, to: n, lock: '' } : null;
}
const firstOpen = (s) => { const l = bySubj(s); return (l.find((q) => S.answers[q.id] == null) ?? l[0]).id; };

function flag(type) { if (S.cheat) { S.flags.push({ t: now(), type }); persist(); } }
async function keepAwake() { try { wl = await navigator.wakeLock?.request('screen'); } catch { /* not supported */ } }

// Back is blocked in the exam. Chrome only honours a blocked back that follows a tap, so every tap re-arms it.
function armBack() {
  if (!armed) { history.pushState({ exam: 1 }, '', '#exam'); armed = true; }
  if ('CloseWatcher' in window && !cw) { try { cw = new CloseWatcher(); cw.oncancel = (e) => { e.preventDefault(); holdExam(); }; cw.onclose = () => { cw = null; holdExam(); }; } catch { cw = null; } }
}
function holdExam() {
  history.pushState({ exam: 1 }, '', '#exam'); armed = true;
  if (S && !S.pending) toast('The test is running. Submit it to leave.');
}
function lockUI() {
  document.body.classList.add('exam');
  armed = false; armBack();
  window.onbeforeunload = (e) => { e.preventDefault(); e.returnValue = ''; };
  document.oncontextmenu = (e) => e.preventDefault();
  document.onfullscreenchange = () => { if (S && !S.pending && !isFull()) { flag('fullscreen_exit'); render(); } };
  document.onvisibilitychange = () => { if (!S || S.pending) return; if (document.hidden) flag('tab_hidden'); else keepAwake(); };
  keepAwake();
}
function unlockUI() {
  document.body.classList.remove('exam');
  window.onbeforeunload = document.oncontextmenu = document.onfullscreenchange = document.onvisibilitychange = null;
  if (cw) { cw.onclose = null; cw.destroy(); cw = null; }
  armed = false;
  wl?.release?.().catch(() => {}); wl = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

function startEngine() {
  S.done ??= []; S.copied ??= []; S.omrMs ??= 0; // tests started before these existed
  lockUI();
  if (S.pending) return upload();
  checkPhase(true);
  render();
  clearInterval(tick); tick = setInterval(onTick, 1000);
}

function onTick() {
  if (S.pending) return;
  const l = S.durationMs - elapsed();
  if (l <= 0) return finish();
  const warn = (key, msg) => { if (!S.alerts.includes(key)) { S.alerts.push(key); toast(msg); } };
  if (inOmr()) {
    if (!S.alerts.includes('omr')) { warn('omr', 'OMR time. Copy your answers to the paper sheet.'); $('#dlg').close(); persist(); render(); }
    if (l <= 60000) warn('t1', '1 min left');
    return updateClock();
  }
  if (!document.hidden) S.times[S.cur] = (S.times[S.cur] || 0) + 1;
  checkPhase(false);
  const p = phase(), q = qMs() - elapsed(), what = S.omrMs ? 'before OMR' : 'left';
  if (!p.final && p.endsInMs <= 5 * 60000) warn('e' + p.idx, `5 min left: ${p.label}`);
  if (q <= 10 * 60000) warn('t10', `10 min ${what}`);
  if (q <= 5 * 60000) warn('t5', `5 min ${what}`);
  if (q <= 60000) warn('t1q', `1 min ${what}`);
  updateClock();
  if (++ticks % 5 === 0) persist();
}

function checkPhase(initial) {
  const p = phase();
  if (p.idx === S.lastIdx) return;
  S.lastIdx = p.idx;
  if (!initial && S.strategy !== 'free') toast(S.strategy === 'subject' ? p.label : `Now: ${p.label}`);
  const b = S.strategy === 'timebox' ? box() : null;
  if (b && qOf(S.cur).subject !== b) { S.cur = firstOpen(b); if (!S.visited.includes(S.cur)) S.visited.push(S.cur); } // a time box moves her on
  persist();
  if (!initial) render();
}

function updateClock() {
  const omr = inOmr(), l = omr ? S.durationMs - elapsed() : qMs() - elapsed();
  const c = $('#clock'); if (c) { c.textContent = hms(l); c.classList.toggle('low', l <= 5 * 60000); }
  const ph = $('#phase'); if (ph && !omr) {
    const p = phase(), review = S.strategy === 'timebox' && !box(); // finished every box early
    ph.textContent = review ? 'Review time: all subjects open' : p.label + (isFinite(p.endsInMs) && !p.final ? ` · ends in ${hms(p.endsInMs).replace(/^00:/, '')}` : '');
  }
}

const status = (q) => qStatus(q.id, S.answers, S.marked, S.visited);

function setCur(id) {
  S.cur = id;
  if (!S.visited.includes(id)) S.visited.push(id);
  persist(); render();
}
function step(dir) {
  const ids = S.order.filter((s) => allowed().includes(s)).flatMap((s) => bySubj(s).map((q) => q.id));
  const j = ids.indexOf(S.cur) + dir;
  if (j >= 0 && j < ids.length) return setCur(ids[j]);
  if (dir > 0 && nextOf()) { persist(); render(); return actions.next(); } // end of a subject: show the latest marks, then offer the next subject; never a dead end
  render();
  if (dir > 0) toast(S.omrMs ? 'Last question. Check marked ones, then go to the OMR sheet or submit.' : 'Last question. Check marked ones, then submit.');
}

const actions = {
  pick: (d) => { S.answers[S.cur] = +d.i; persist(); render(); }, // Clear removes an answer; a second tap never does, so a stray touch cannot lose it
  save: () => step(1),
  markNext: () => { if (!S.marked.includes(S.cur)) S.marked.push(S.cur); step(1); }, // a mark is only a flag: it never blocks moving on
  unmark: () => { S.marked = S.marked.filter((x) => x !== S.cur); persist(); render(); },
  clear: () => { delete S.answers[S.cur]; persist(); render(); },
  prev: () => step(-1),
  subj: (d) => {
    if (allowed().includes(d.s)) return setCur(firstOpen(d.s));
    toast(S.strategy === 'subject' ? 'One subject at a time. Tap Finish on the right to move on.' : `${cap(box())} time box. Tap Finish ${cap(box())} on the right to move on early.`);
  },
  jump: (d) => { if (allowed().includes(qOf(d.id).subject)) setCur(d.id); },
  next: async () => {
    const n = nextOf(); if (!n) return;
    const l = bySubj(n.from), left = l.filter((q) => S.answers[q.id] == null).length, mk = l.filter((q) => S.marked.includes(q.id)).length;
    const dlg = (what) => `<h2>Finish ${cap(n.from)}?</h2><p><b>${l.length - left}</b> answered · <b${left ? ' class="err"' : ''}>${left}</b> not answered${mk ? ` · <b>${mk}</b> marked` : ''}</p><p class="muted">${what}</p>`;
    if (n.lock === 'final' && !(await ask('', `Go to ${cap(n.to)}`, dlg(`You cannot come back to ${cap(n.from)}.`)))) return;
    if (n.lock === 'box' && !(await ask('', n.to ? `Go to ${cap(n.to)}` : 'Start review', dlg(`${n.to ? `${cap(n.to)} starts now and gets the time you save.` : 'Review time starts now: all subjects open.'} You can return to ${cap(n.from)} in the review time.`)))) return;
    if (n.lock === 'final') S.subjIdx++;
    if (n.lock === 'box') S.done.push(n.from);
    if (n.lock === 'box' && !n.to) toast('Review time: all subjects open');
    setCur(firstOpen(n.to ?? S.order[0]));
  },
  toOmr: async () => {
    if (!(await ask(`Go to the OMR sheet now? Your answers lock. You get the remaining ${hms(S.durationMs - elapsed())} to copy them, then the test submits.`, 'Go to OMR'))) return;
    S.omrNow = true; S.alerts.push('omr'); persist(); render(); // she chose it: no alert, and the next tick must not close a dialog
  },
  copied: (d) => { S.copied = S.copied.includes(d.id) ? S.copied.filter((x) => x !== d.id) : [...S.copied, d.id]; persist(); render(); },
  full: async () => { await fullscreen(); render(); },
  submit: async () => {
    const c = stateCounts(S.qs, S.answers, S.marked, S.visited), left = S.qs.filter((q) => S.answers[q.id] == null).length;
    const omr = inOmr(), tl = omr ? S.durationMs - elapsed() : qMs() - elapsed(), cols = ['A', 'AM', 'M', 'S', 'V'];
    const html = `<h2>Submit the test?</h2><p class="muted">${hms(tl)} left${S.omrMs && !omr ? ' before OMR' : ''}. ${left ? `${plural(left, 'question')} not answered.` : 'All questions answered.'} You cannot change answers after this.</p>
      <div class="tbl"><table><tr><th>Subject</th>${cols.map((k) => `<th title="${STATE[k]}"><span class="sq mini ${k}" aria-hidden="true"></span><span class="vh">${STATE[k]}</span></th>`).join('')}</tr>
      ${S.order.map((s) => `<tr><td>${cap(s)}</td>${cols.map((k) => `<td class="mono">${c[s]?.[k] ?? 0}</td>`).join('')}</tr>`).join('')}</table></div>
      <p class="muted sm-text">${cols.map((k) => `<span class="row tight inl"><span class="sq mini ${k}" aria-hidden="true"></span>${STATE[k]}</span>`).join(' ')}</p>`;
    if (await ask('', 'Submit test', html)) finish();
  },
  retry: () => upload(),
};
const OMR_OK = ['copied', 'submit', 'full', 'retry']; // the only taps that work once answers lock

const examTop = (mid) => `<header class="xm-top"><span class="brand hide-sm">${esc(S.title)}</span>${mid}<span class="grow"></span>${sizeCtl()}<span class="pill dark" id="clock" role="timer" aria-label="Time left"></span></header>`;
const fullGate = () => (isFull() ? '' : '<div class="overlay"><div class="card stack"><b>The test is paused on screen</b><span class="muted">The clock keeps running.</span><button class="btn dark lg" data-a="full">Continue test</button></div></div>');

function render() {
  if (!S) return;
  if (S.pending) return renderPending();
  if (inOmr()) return renderOmr();
  const q = qOf(S.cur), allow = allowed(), list = bySubj(q.subject), idx = list.indexOf(q), ans = S.answers[q.id];
  const marked = S.marked.includes(q.id), n = nextOf(), count = (st) => list.filter((x) => status(x) === st).length;
  const nextLbl = !n ? '' : n.lock ? `Finish ${cap(n.from)} →` : `Next: ${cap(n.to)} →`;
  app.innerHTML = `<div class="xm">
    ${examTop(`<div class="segs" role="group" aria-label="Subjects">${S.order.map((s) => `<button class="seg ${s === q.subject ? 'on' : ''} ${allow.includes(s) ? '' : 'locked'}" aria-pressed="${s === q.subject}" data-a="subj" data-s="${s}">${cap(s).slice(0, 3)}<span class="long">${s.slice(3)}</span> <span class="mono">${bySubj(s).filter((x) => S.answers[x.id] != null).length}/${bySubj(s).length}</span></button>`).join('')}</div>`)}
    <main class="xm-q"><div class="qhead"><h1>Question ${no(q)}</h1><span class="muted">${cap(q.subject)} ${idx + 1} of ${list.length} · +${q.marks} / −${S.neg}</span><span class="grow"></span>${marked ? '<span class="chip mark-chip">● Marked for review</span>' : ''}</div>
      <div class="qtext">${fmt(q.body)}</div>${img(q)}
      <div class="opts" role="radiogroup" aria-label="Options">${q.options.map((o, i) => `<button class="optrow ${ans === i ? 'on' : ''}" role="radio" aria-checked="${ans === i}" data-a="pick" data-i="${i}"><span class="dot"></span><span class="key">${'ABCD'[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div></main>
    <footer class="xm-foot"><button class="btn" data-a="clear" ${ans == null ? 'disabled' : ''}>Clear</button>

      <button class="btn" data-a="prev" ${allow.flatMap(bySubj)[0] === q ? 'disabled' : ''} aria-label="Previous">‹<span class="long"> Previous</span></button><button class="btn dark wide" data-a="save">Save &amp; next ›</button></footer>
    <aside class="xm-side" aria-label="Question palette">
      <div class="phase"><span class="lbl">${stratName(S.strategy)}</span><span id="phase" class="sm-text"></span>${S.omrMs ? `<span class="muted">Then ${S.omrMs / 60000} min OMR</span>` : ''}</div>
      <div class="side-h"><b>${cap(q.subject)}</b><span class="muted">${list.filter((x) => S.answers[x.id] != null).length} of ${list.length} answered</span></div>
      <div class="side-mid"><div class="pal">${list.map((x) => `<button class="sq ${status(x)} ${x.id === S.cur ? 'cur' : ''}" data-a="jump" data-id="${x.id}" aria-label="Question ${no(x)}, ${STATE[status(x)]}"${x.id === S.cur ? ' aria-current="true"' : ''}>${no(x)}</button>`).join('')}</div>
      <div class="legend">${Object.entries(STATE).map(([k, nm]) => `<div class="li"><span class="sq mini ${k}" aria-hidden="true"></span><span class="grow">${nm}</span><span class="mono">${count(k)}</span></div>`).join('')}</div></div>
      <div class="side-act">${n ? `<button class="btn dark" data-a="next">${nextLbl}</button>` : ''}
        ${S.omrMs ? '<button class="btn" data-a="toOmr">Go to OMR sheet</button>' : ''}<button class="btn danger" data-a="submit">Submit test</button></div></aside></div>

// Last minutes: every answer on one screen, laid out like the paper sheet, to copy with a pen
function renderOmr() {
  const cols = omrColumns(S.qs, S.qs.length > 100 ? 25 : 20), rows = Math.max(...cols.map((c) => c.items.length));
  const got = S.qs.filter((q) => S.answers[q.id] != null);
  app.innerHTML = `<div class="xm omr">
    ${examTop('<span class="chip mark-chip">OMR time · answers locked</span>')}

      <div class="omr-cols" style="--rows:${rows}">${cols.map((c) => `<div class="omr-col"><span class="lbl">${c.subject.slice(0, 3)}</span>${c.items.map(({ n, q }) => {
        const a = S.answers[q.id], done = S.copied.includes(q.id);
        return `<button class="omr-row ${a == null ? 'blank' : ''} ${done ? 'done' : ''} ${n % 5 === 0 ? 'five' : ''}" data-a="copied" data-id="${q.id}" aria-pressed="${done}" aria-label="Question ${n}: ${a == null ? 'blank' : 'ABCD'[a]}${done ? ', copied' : ''}"><span class="n">${n}</span>${[0, 1, 2, 3].map((i) => `<span class="bub ${a === i ? 'on' : ''}">${'ABCD'[i]}</span>`).join('')}<span class="ck" aria-hidden="true">${done ? '✓' : ''}</span></button>`;
      }).join('')}</div>`).join('')}</div></main>
    <aside class="xm-side"><div class="phase"><span class="lbl">OMR sheet</span><span class="sm-text">The test submits itself when the time ends.</span></div>
      <div class="stack tight">${stat('Answered', got.length, 'to fill', '')}${stat('Blank', S.qs.length - got.length, 'leave empty', '')}${stat('Copied', got.filter((q) => S.copied.includes(q.id)).length, `of ${got.length}`, '')}</div>
      <div class="side-act"><button class="btn danger" data-a="submit">Submit test</button></div></aside></div>

/* ================= Finish + upload ================= */
async function finish() {
  clearInterval(tick);
  $('#dlg').close(); // time ran out with a confirm box open
  S.pending = true; S.err = ''; persist();
  upload();
}
function renderPending() {
  app.innerHTML = `<div class="center"><div class="tray narrow"><span class="lbl">Test finished</span><div class="card stack">
    <h1>${S.busy ? 'Uploading…' : 'Answers saved on this tablet'}</h1>
    <p class="muted">${S.busy ? 'Please wait.' : 'Turn off airplane mode so they can be uploaded.'}</p>
    <div class="err">${esc(S.err || '')}</div>
    <button class="btn dark" data-a="retry" ${S.busy ? 'disabled' : ''}>Upload now</button></div></div></div>`;
}
async function upload() {
  if (S.busy) return;
  S.busy = true; render();
  // ponytail: the attempt row is created here too, so an offline start still works; its started_at is then the upload time
  const st = await rpc('start_attempt', { p_test: S.testId, p_strategy: S.strategy, p_id: S.attemptId });
  if (st.data?.id) S.attemptId = st.data.id;
  const r = await rpc('submit_attempt', { p_test: S.testId, p_answers: S.answers, p_marked: S.marked, p_times: S.times, p_flags: S.flags, p_id: S.attemptId });
  S.busy = false;
  if (r.error) { S.err = r.error.message; persist(); return render(); }
  localStorage.removeItem(EXAM); localStorage.removeItem('paper.' + S.testId);
  const id = S.testId;
  S = null; unlockUI();
  history.replaceState(null, '', `#result/${id}/${r.data.attempt.id}`); depth = 0;
  showResult(r.data);
}
window.addEventListener('online', () => { if (S?.pending) upload(); });

/* ================= Result ================= */
const TARGET = 120; // seconds per question: 120 min for 60 questions
let RQ = []; // this result's questions, for "Practise mistakes"
function showResult({ attempt: a, test, questions: qs, attempts = [] }) {
  document.body.classList.remove('exam');
  $('#toast').classList.remove('on');
  const neg = test?.neg_marks ?? 1, ans = a.answers, times = a.times || {}, marked = a.marked || [];
  const verdict = (q) => verdictOf(ans[q.id], q.correct);
  const total = qs.reduce((s, q) => s + q.marks, 0), mine = total ? Math.round((a.score / total) * 100) : 0;
  const qrows = qs.map((q) => ({ ...q, question_id: q.id, attempt_id: a.id, chosen: ans[q.id], secs: times[q.id] || 0 }));
  const sum = (l) => l.reduce((x, q) => x + q.marks, 0);
  const rows = subjectStats(qrows, [{ id: a.id, times }]).filter((r) => r.total).map((r) => {
    const l = qrows.filter((q) => q.subject === r.subject);
    return { ...r, l, max: sum(l), score: sum(l.filter((q) => verdict(q) === 'C')) - r.wrong * neg };
  });
  const weakHere = chapterStats(qrows, 1).filter((c) => c.acc < 1).slice(0, 6);
  const tried = a.correct + a.wrong, kinds = {};
  qrows.forEach((q) => { q.kind = attemptKind(q.chosen, q.correct, q.secs, TARGET); kinds[q.kind] = (kinds[q.kind] || 0) + 1; });
  RQ = qrows.filter((q) => verdict(q) !== 'C');
  const used = Object.values(times).reduce((x, y) => x + y, 0);
  const slow = [...qrows].sort((x, y) => y.secs - x.secs).slice(0, 5).filter((q) => q.secs);
  const FILTERS = [['all', 'All', qrows.length], ['W', 'Wrong', a.wrong], ['S', 'Skipped', a.skipped], ['C', 'Correct', a.correct], ['M', 'Marked', qrows.filter((q) => marked.includes(q.id)).length]];
  const left = (test?.max_attempts ?? 1) - attempts.length, prevA = attempts.find((x) => x.attempt_no === a.attempt_no - 1);
  app.innerHTML = `<div class="frame"><div class="top">${backBtn()}<span class="brand">${esc(test?.title ?? 'Result')}</span><span class="chip">${stratName(a.strategy)}</span><span class="grow"></span>${sizeCtl()}<button class="btn sm" data-a="progress">Progress</button></div>
    <div class="page">${attempts.length > 1 || left > 0 ? `<div class="row tight" role="group" aria-label="Attempts">${attempts.map((x) => `<button class="tab ${x.id === a.id ? 'on' : ''}" aria-pressed="${x.id === a.id}" data-a="att" data-id="${test.id}" data-att="${x.id}">Attempt ${x.attempt_no} · <span class="mono">${x.score}</span></button>`).join('')}
      <span class="grow"></span>${left > 0 && test?.id ? `<button class="btn dark" data-a="open" data-id="${test.id}">Retake · ${plural(left, 'attempt')} left</button>` : ''}</div>` : ''}
    <div class="hero"><div class="stat"><span class="lbl">Score</span><span class="v">${a.score} <span class="u">/ ${total}</span></span><span class="delta" id="delta">${mine}%</span></div>
      <div class="stats">${stat('✓ Correct', a.correct, '', '')}${stat('✗ Wrong', a.wrong, a.wrong ? `−${a.wrong * neg} marks` : '', '')}${stat('– Skipped', a.skipped, '', '')}${stat('Accuracy', tried ? Math.round((a.correct / tried) * 100) + '%' : '–', `${tried} tried`, '')}${stat('Time used', mmss(used).replace(/:\d+$/, '') + ' min', '', '')}</div></div>
    <div class="tray"><span class="lbl">Every question</span><div class="card stack tight">${rows.map((r) => `<div class="row"><span class="abbr">${r.subject.slice(0, 3).toUpperCase()}</span><div class="sqs">${r.l.map((q) => `<i class="${verdict(q)}" title="Q${q.position} ${{ C: 'correct', W: 'wrong', S: 'skipped' }[verdict(q)]}"></i>`).join('')}</div></div>`).join('')}
      <div class="row muted"><span class="sqs"><i class="C"></i></span>Correct<span class="sqs"><i class="W"></i></span>Wrong<span class="sqs"><i></i></span>Skipped</div></div></div>
    <div class="split even"><div class="tray"><span class="lbl">By subject</span><div class="card tbl"><table><tr><th>Subject</th><th>Score</th><th>Accuracy</th><th>Time</th><th>Per question</th></tr>
      ${rows.map((r) => `<tr><td>${cap(r.subject)}</td><td class="mono">${r.score} / ${r.max}</td><td class="mono">${r.acc == null ? '–' : r.acc + '%'}</td><td class="mono">${mmss(r.secs)}</td><td class="mono">${mmss(r.perQ)}</td></tr>`).join('')}</table></div></div>
    <div class="tray"><span class="lbl">How you used time · target 2 min a question</span><div class="card list">${Object.entries(KIND).filter(([k]) => kinds[k]).map(([k, n]) => `<div class="li"><span class="kind ${k}" aria-hidden="true"></span><span class="grow">${n}</span><span class="num-r">${kinds[k]}</span></div>`).join('')}
      ${kinds.wrong_fast ? `<p class="muted li">${plural(kinds.wrong_fast, 'question')} answered wrong in under 36 s. Slow down on these: each cost ${4 + +neg} marks against a correct answer.</p>` : ''}</div></div></div>
    ${slow.length ? `<div class="tray"><span class="lbl">Most time spent</span><div class="card list">${slow.map((q) => `<div class="li"><span class="mono muted">Q${q.position}</span><span class="grow clip">${fmt(line(q.body))}</span>${verdictChip(verdict(q))}<span class="mono">${mmss(q.secs)}</span></div>`).join('')}</div></div>` : ''}
    ${weakHere.length ? `<div class="tray"><span class="lbl">Chapters to revise from this test</span><div class="card list">${weakHere.map(chapterRow).join('')}</div></div>` : ''}
    <div class="tray"><div class="row tray-head"><span class="lbl">Review solutions</span><span class="grow"></span>${RQ.length ? `<button class="btn sm dark" data-a="rpractice">Practise ${RQ.length} wrong and skipped</button>` : ''}</div>
      <div class="row tight filt" role="group" aria-label="Show">${FILTERS.map(([k, n, c], i) => `<button class="tab ${i ? '' : 'on'}" data-a="rf" data-f="${k}" aria-pressed="${!i}">${n} <span class="mono">${c}</span></button>`).join('')}</div>
      <div class="card list" id="rv">${qrows.map((q) => `<details class="rv" data-v="${verdict(q)}" data-m="${marked.includes(q.id) ? 1 : 0}"><summary>${verdictChip(verdict(q))}<span class="mono muted">Q${q.position}</span><span class="grow clip">${fmt(line(q.body))}</span><span class="mono muted" title="Time spent">${mmss(q.secs)}</span></summary>${qBlock(q, ans[q.id])}<p class="muted sm-text">${KIND[q.kind]} · ${mmss(q.secs)}${marked.includes(q.id) ? ' · marked for review' : ''}</p></details>`).join('')}</div></div></div></div>`;
  reviewFilter(a.wrong ? 'W' : 'all'); // open on what needs revising
  const delta = (d, vs) => { const el = $('#delta'); if (!el) return; el.textContent = `${mine}% · ${d ? `${d > 0 ? '+' : '−'}${Math.abs(d)} vs ${vs}` : `same as ${vs}`}`; if (d) el.classList.add(d > 0 ? 'up' : 'down'); };
  if (prevA) return delta(mine - Math.round((prevA.score / total) * 100), `attempt ${prevA.attempt_no}`); // change vs her previous attempt at this paper
  // change vs the previous test (needs internet; the result shows fine without it)
  sb.rpc('get_progress').then(({ data }) => {
    const at = data?.attempts ?? [], i = at.findIndex((x) => x.id === a.id);
    if (i > 0) delta(mine - pct(at[i - 1]), 'previous test');
  }).catch(() => {});
}
function reviewFilter(f) {
  document.querySelectorAll('.filt .tab').forEach((b) => { const on = b.dataset.f === f; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  document.querySelectorAll('#rv details').forEach((d) => (d.hidden = !(f === 'all' || d.dataset.v === f || (f === 'M' && d.dataset.m === '1'))));
}

/* ================= Progress, mistake notebook, practice ================= */
const airText = () => (navigator.onLine ? '○ Turn on airplane mode' : '✓ Airplane mode is on');
const syncNet = () => { document.querySelectorAll('.net').forEach((e) => (e.outerHTML = netPill())); const a = $('#air'); if (a) a.textContent = airText(); };
addEventListener('online', syncNet); addEventListener('offline', syncNet);
const blocks = (n) => `<span class="bar" role="img" aria-label="${Math.round(n)}%">${Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.round(n / 10) ? 'on' : ''}"></i>`).join('')}</span>`;
const chapterRow = (c) => `<div class="li"><div class="col"><span>${esc(c.chapter)}</span><span class="muted">${cap(c.subject)}</span></div>${blocks(c.acc * 100)}<span class="num-r">${c.right}/${c.total}</span></div>`;

const optLine = (o, j, correct, chosen) => `<div class="optline ${j === correct ? 'right' : chosen === j ? 'wrong' : ''}"><span class="key">${'ABCD'[j]}</span><span class="grow">${fmt(o)}</span>${j === correct ? '<span>✓ correct</span>' : chosen === j ? '<span>✗ your answer</span>' : ''}</div>`;
const qBlock = (q, chosen) => `<div class="qblock"><div class="qbody">${fmt(q.body)}</div>${img(q)}${q.options.map((o, j) => optLine(o, j, q.correct, chosen)).join('')}${q.solution ? `<p class="sol">${fmt(q.solution)}</p>` : ''}</div>`;

let PROG = null, NB = [], P = null;
async function loadProgress() {
  const r = await sb.rpc('get_progress');

async function progress() {
  const d = await loadProgress(); if (!d) return go('tests', true);
  const at = d.attempts;
  let body = '<p class="muted">Take a test to see your progress here.</p>';
  if (at.length) {
    const last = at.at(-1), prev = at.at(-2), diff = prev ? pct(last) - pct(prev) : null;
    const subs = subjectStats(d.answers, at).filter((s) => s.total), weak = chapterStats(d.answers).filter((c) => c.acc < 1).slice(0, 8), strat = strategyStats(at);
    body = `<div class="stats">${stat('Tests taken', at.length)}${stat('Latest', pct(last) + '%', diff == null ? '' : (diff >= 0 ? '+' : '−') + Math.abs(diff) + ' vs previous')}${stat('Best', Math.max(...at.map(pct)) + '%')}</div>
      <div class="tray"><span class="lbl">Score trend</span><div class="card">${trendSvg(at.map((a, i) => ({ label: 'T' + (i + 1), value: pct(a) })), 1000)}</div></div>
      <div class="split"><div class="tray"><span class="lbl">By subject</span><div class="card tbl"><table><tr><th>Subject</th><th>Accuracy</th><th>Per question</th><th>Right</th><th>Wrong</th><th>Skipped</th></tr>
        ${subs.map((s) => `<tr><td>${cap(s.subject)}</td><td class="mono">${s.acc == null ? '–' : s.acc + '%'}</td><td class="mono">${mmss(s.perQ)}</td><td class="mono">${s.right}</td><td class="mono">${s.wrong}</td><td class="mono">${s.skipped}</td></tr>`).join('')}</table></div></div>
        <div class="tray"><span class="lbl">Strategies</span><div class="card list">${strat.map((s) => `<div class="li"><div class="col"><span>${stratName(s.strategy)}</span><span class="muted">${plural(s.n, 'test')}</span></div>${blocks(s.avg)}<span class="num-r">${s.avg}%</span></div>`).join('')}
          <p class="muted li">${strat.length > 1 ? 'Average score per strategy. More tests make this more reliable.' : 'Try other strategies in later tests to compare.'}</p></div></div></div>
      <div class="tray"><span class="lbl">Weakest chapters</span><div class="card list">${weak.map(chapterRow).join('') || '<p class="muted li">No weak chapters yet.</p>'}</div></div>`;
  }
  app.innerHTML = `<div class="frame">${nav('progress')}<div class="page"><h1>Progress</h1>${body}</div></div>`;
}

async function notebook(filter = '', data) {
  const d = data ?? (await loadProgress()); if (!d) return go('tests', true);
  const all = mistakes(d.answers, read('notebook.cleared') ?? {});
  NB = filter ? all.filter((r) => r.subject === filter) : all;
  const chip = (s, n) => `<button class="tab ${filter === s ? 'on' : ''}" aria-pressed="${filter === s}" data-a="nbf" data-s="${s}">${n} <span class="mono">${(s ? all.filter((r) => r.subject === s) : all).length}</span></button>`;
  app.innerHTML = `<div class="frame">${nav('notebook')}<div class="page"><div class="head"><h1>Mistake notebook</h1><span class="grow"></span><button class="btn dark" data-a="practice" ${NB.length ? '' : 'disabled'}>Practise ${NB.length}</button></div>
    <div class="row tight">${chip('', 'All')}${SUBJECTS.map((s) => chip(s, cap(s))).join('')}</div>
    <div class="tray"><span class="lbl">Wrong or skipped last time</span><div class="card list">${NB.map((r) => `<details class="rv"><summary>${verdictChip(r.chosen == null ? 'S' : 'W')}<span class="mono muted">${cap(r.subject.slice(0, 3))}</span><span class="grow clip">${fmt(line(r.body))}</span></summary>${qBlock(r, r.chosen)}</details>`).join('') || '<p class="muted li">Nothing to revise. Mistakes from your tests appear here.</p>'}</div></div></div></div>`;
}

// Untimed retry with instant feedback; a correct answer clears the question from the notebook
function startPractice(list) { P = { list: [...list].sort(() => Math.random() - 0.5), i: 0, right: 0, picked: null }; }
function drawPractice() {
  if (P.i >= P.list.length) {
    app.innerHTML = `<div class="frame">${nav('practice')}<div class="page"><h1>Practice done</h1><div class="stats one">${stat('Right', P.right, 'of ' + P.list.length)}</div><div class="row"><button class="btn dark" data-a="back">Done</button></div></div></div>`;
    return;
  }
  const q = P.list[P.i], done = P.picked != null;
  app.innerHTML = `<div class="frame">${nav('practice')}<div class="page"><div class="head"><h1>Question ${P.i + 1} of ${P.list.length}</h1><span class="grow"></span><span class="chip">${cap(q.subject)} · ${esc(q.chapter)}</span></div>
    <div class="tray"><div class="card q stack"><div><div class="qtext">${fmt(q.body)}</div>${img(q)}</div>
    <div role="radiogroup" aria-label="Options">${q.options.map((o, i) => { const v = done && i === q.correct ? 'right' : done && i === P.picked ? 'wrong' : ''; return `<button class="optrow ${P.picked === i ? 'on' : ''} ${v}" role="radio" aria-checked="${P.picked === i}" data-a="ppick" data-i="${i}" ${done ? 'disabled' : ''}><span class="dot"></span><span class="key">${'ABCD'[i]}</span><span>${fmt(o)}</span>${v === 'right' ? '<span class="tag">✓ correct</span>' : v === 'wrong' ? '<span class="tag">✗ your answer</span>' : ''}</button>`; }).join('')}</div>
    ${done ? `<p class="sol" role="status"><b>${P.picked === q.correct ? 'Correct.' : 'Not quite.'}</b> ${fmt(q.solution || '')}</p><div class="row"><button class="btn dark" data-a="pnext">${P.i + 1 < P.list.length ? 'Next' : 'Finish'}</button></div>` : ''}</div></div></div></div>`;
}
function ppick(i) {
  if (P.picked != null) return;
  P.picked = i;
  const q = P.list[P.i];
  if (i === q.correct) { P.right++; const c = read('notebook.cleared') ?? {}; c[q.question_id] = Date.now(); write('notebook.cleared', c); }
  drawPractice();
}

/* ================= Boot ================= */
if (matchMedia('(display-mode: fullscreen)').matches) landscape();
if (S) { history.replaceState(null, '', '#exam'); startEngine(); } // resume after a crash or restart, works offline
else route();
</script>
