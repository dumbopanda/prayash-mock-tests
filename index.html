<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prayas Mock Tests</title>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E4ED8">
</head>
<body class="center">
<form id="f" class="tray narrow">
  <span class="lbl" id="mode">Sign in</span>
  <div class="card stack">
    <h1>Mock Tests</h1>
    <div class="col"><label class="lbl" for="e">Email</label><input id="e" class="field" type="email" autocomplete="username" required></div>
    <div class="col"><label class="lbl" for="p">Password</label><input id="p" class="field" type="password" minlength="6" autocomplete="current-password" required><label class="opt sm-text"><input type="checkbox" id="show"> Show password</label></div>
    <div class="err" id="msg" role="alert"></div>
    <button class="btn dark" id="go">Sign in</button>
    <button class="btn" type="button" id="swap">Create account</button>
    <button class="btn" type="button" id="forgot">Forgot password?</button>
  </div>
</form>
<script type="module">
import { sb, currentUser } from './shared.js';

let signup = false, recovery = /type=recovery/.test(location.hash);
const $ = (id) => document.getElementById(id);

async function route() {
  const u = await currentUser();
  if (!u) return;
  if (u.role === 'admin') location.href = 'admin.html';
  else location.href = 'student.html';
}

$('show').onchange = (e) => { $('p').type = e.target.checked ? 'text' : 'password'; };

$('swap').onclick = () => {
  signup = !signup;
  setMode(signup ? 'Create account' : 'Sign in', signup ? 'Create account' : 'Sign in');
  $('swap').textContent = signup ? 'I have an account' : 'Create account';
  $('msg').textContent = '';
};

const setMode = (t, b) => { $('mode').textContent = t; $('go').textContent = b; };
$('forgot').onclick = async () => {
  const email = $('e').value.trim();
  if (!email) { $('msg').textContent = 'Type your email first.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/index.html' });
  $('msg').textContent = error ? error.message : 'If this email has an account, a reset link is on its way.';
};
if (recovery) {
  setMode('New password', 'Save password');
  $('e').closest('.col').hidden = $('swap').hidden = $('forgot').hidden = true;
  $('e').required = false; $('p').autocomplete = 'new-password';
}

$('f').onsubmit = async (ev) => {
  ev.preventDefault();
  $('msg').textContent = '';
  if (recovery) {
    const { error } = await sb.auth.updateUser({ password: $('p').value });
    if (error) { $('msg').textContent = error.message; return; }
    history.replaceState(null, '', 'index.html'); recovery = false; route(); return;
  }
  const creds = { email: $('e').value.trim(), password: $('p').value };
  const { error } = signup ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
  if (error) { $('msg').textContent = error.message; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('msg').textContent = 'Check your email to confirm, then sign in.'; return; }
  route();
};

if (!recovery) route();
</script>
</body>
</html>
